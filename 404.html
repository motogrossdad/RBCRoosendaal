<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16120f">
<title>Buitenspel — RBC Roosendaal</title>
<link rel="icon" href="/rbc-klein.png">
<style>
@font-face{ font-family:"Big Shoulders Display"; font-weight:700 900; font-display:swap; src:url(/fonts/big-shoulders-display.woff2) format("woff2") }
@font-face{ font-family:Barlow; font-weight:600; font-display:swap; src:url(/fonts/barlow-600.woff2) format("woff2") }
:root{ --oranje:#ff6a13; --inkt:#f4ece1; --nacht:#16120f }
*{ box-sizing:border-box; margin:0 }
body{ min-height:100vh; display:grid; place-items:center; padding:24px 16px; text-align:center; color:var(--inkt);
      font:600 17px/1.5 Barlow, system-ui, sans-serif;
      background:linear-gradient(180deg,rgba(22,18,15,.72),rgba(22,18,15,.95)), #16120f url(/atik-800.webp) center/cover }
img{ width:64px; margin:0 auto 18px; display:block }
.vlag{ display:inline-block; font-size:56px; transform:rotate(-12deg); margin-bottom:6px }
h1{ font:900 clamp(64px,16vw,140px)/.85 "Big Shoulders Display", Impact, sans-serif; text-transform:uppercase; color:var(--oranje) }
p{ max-width:34ch; margin:14px auto 26px; opacity:.85 }
a{ display:inline-block; background:var(--oranje); color:#1b0f06; text-decoration:none; font:900 18px/1 "Big Shoulders Display", Impact, sans-serif;
   text-transform:uppercase; letter-spacing:.08em; padding:14px 22px; border-radius:999px }
a:hover{ background:#fff }
</style>
</head>
<body>
<main>
    <img src="/rbc-klein.png" alt="" width="143" height="192">
    <div class="vlag" aria-hidden="true">🚩</div>
    <h1>Buitenspel!</h1>
    <p>Deze pagina bestaat niet (meer). De grensrechter vlagt, maar de wedstrijd gaat gewoon door.</p>
    <a href="/">Terug naar RBC</a>
</main>
</body>
</html>
