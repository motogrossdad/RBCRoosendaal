<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBC ROOSENDAAL — 16-BIT</title>
<meta name="theme-color" content="#10142B">
<meta name="description" content="RBC Roosendaal in 16 bit — selectie, stand, wedstrijden en penalty's. Derde Divisie B 2026/2027.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/rbc.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RBC">
<style>
/* ════════════════════════════════════════════════════════════
   RBC ROOSENDAAL — 16-bit editie
   Alles zelfgemaakt: geen fonts, geen libraries, geen CDN.
   Pixelportretten worden uit de echte foto's gegenereerd.
   ════════════════════════════════════════════════════════════ */

:root {
    /* SNES-achtig palet, gebouwd rond oranje-wit */
    --ink:        #080A16;
    --bg:         #10142B;
    --bg2:        #1A2145;
    --panel:      #232C57;
    --panel-lit:  #33407A;
    --line:       #4A5799;
    --orange:     #F1942D;
    --orange-lit: #FFC873;
    --orange-dk:  #A85C0E;
    --cream:      #F6F1E2;
    --white:      #FFFFFF;
    --grey:       #8A94BE;
    --red:        #D9483C;
    --green:      #4FC06B;
    --px: 3px;                 /* basis pixelgrootte, JS stelt bij */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    background: var(--ink);
    color: var(--cream);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: none;
    font-smooth: never;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* ── de "console": vast venster, gecentreerd ─────────────── */
#cab {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background:
        radial-gradient(ellipse at 50% 40%, #1B2038 0%, #080A16 78%);
    padding: 8px;
}
#screen {
    position: relative;
    width: min(100%, calc(100vh * 4 / 3), 1024px);
    aspect-ratio: 4 / 3;
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 0 0 4px #000, 0 0 0 8px #2A2F45, 0 20px 60px -10px #000;
    image-rendering: pixelated;
}
@media (max-aspect-ratio: 3/4) {
    #screen { width: 100%; height: 100%; aspect-ratio: auto; }
}

/* scanlines + CRT-glans, puur decoratief */
#crt {
    position: absolute; inset: 0; z-index: 90; pointer-events: none;
    background:
        repeating-linear-gradient(to bottom,
            rgba(0,0,0,.09) 0 1px, rgba(0,0,0,0) 1px 4px),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.03) 0%, rgba(0,0,0,.20) 100%);
    mix-blend-mode: multiply;
}
#crt.off { display: none; }

/* ── schermen ────────────────────────────────────────────── */
.view { position: absolute; inset: 0; display: none; z-index: 10; }
.view.on { display: block; }

/* ── titelscherm ─────────────────────────────────────────── */
#v-title {
    display: none;
    place-items: center; align-content: center; gap: 0;
    text-align: center;
    background:
        linear-gradient(to bottom, #0B1024 0%, #1A2145 55%, #2A1A0B 100%);
}
#v-title.on { display: grid; }
#title-crest { image-rendering: pixelated; margin-bottom: 4%; }
#title-wordmark { image-rendering: pixelated; }
#title-sub { image-rendering: pixelated; margin-top: 3%; }
#title-press { image-rendering: pixelated; margin-top: 8%; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
#title-foot { image-rendering: pixelated; position: absolute; bottom: 4%; opacity: .55; }

/* sterretjes op de achtergrond */
#stars { position: absolute; inset: 0; z-index: -1; }

/* ── HUD-balk boven ──────────────────────────────────────── */
.hud {
    position: absolute; top: 0; left: 0; right: 0; height: 11%;
    display: flex; align-items: center; gap: 3%;
    padding: 0 3%;
    background: linear-gradient(to bottom, #2A3566, #1A2145);
    border-bottom: var(--px) solid var(--orange-dk);
    z-index: 20;
}
.hud canvas { image-rendering: pixelated; }
.hud-spacer { flex: 1 1 auto; }

/* ── menu ────────────────────────────────────────────────── */
/* Alle items moeten passen zonder scrollen: gelijke rijen tussen HUD en
   footbar, hoeveel menu-items er ook bij komen. */
#menu-list {
    position: absolute; left: 6%; right: 6%; top: 13.5%; bottom: 14%;
    display: grid; grid-auto-rows: 1fr; gap: 1.1%;
}
.mi {
    display: flex; align-items: center; gap: 3%;
    padding: 0 4%; min-height: 0; overflow: hidden;
    background: linear-gradient(to bottom, var(--panel), #1B2349);
    border: var(--px) solid var(--line);
    cursor: pointer;
}
.mi canvas { image-rendering: pixelated; }
.mi .cursor { width: 0; overflow: hidden; transition: none; }
.mi.sel {
    background: linear-gradient(to bottom, var(--orange), var(--orange-dk));
    border-color: var(--orange-lit);
}
.mi.sel .cursor { width: auto; }

/* ── generiek paneel ─────────────────────────────────────── */
.pane {
    position: absolute; left: 3%; right: 3%; top: 13%; bottom: 12%;
    background: linear-gradient(to bottom, #1D2549, #151B38);
    border: var(--px) solid var(--line);
    box-shadow: inset 0 0 0 var(--px) #0D1128;
    overflow: hidden;
}
.pane-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 2.5%; }
.pane-scroll::-webkit-scrollbar { width: 8px; }
.pane-scroll::-webkit-scrollbar-track { background: #0D1128; }
.pane-scroll::-webkit-scrollbar-thumb { background: var(--orange-dk); }

/* ── voetbalveld-onderbalk met knoppen ───────────────────── */
.footbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 12%;
    display: flex; align-items: center; gap: 2%;
    padding: 0 3%;
    background: linear-gradient(to bottom, #1A2145, #0D1128);
    border-top: var(--px) solid var(--orange-dk);
    z-index: 20;
}
.btn {
    display: flex; align-items: center; gap: 6px;
    padding: 1.4% 3%;
    background: linear-gradient(to bottom, var(--panel-lit), var(--panel));
    border: var(--px) solid var(--line);
    cursor: pointer; user-select: none;
}
.btn:active, .btn.hit { background: linear-gradient(to bottom, var(--orange), var(--orange-dk)); border-color: var(--orange-lit); }
.btn canvas { image-rendering: pixelated; }

/* ── selectie / roster ───────────────────────────────────── */
#roster { position: absolute; inset: 0; display: grid; grid-template-columns: 42% 58%; }
#port-col {
    position: relative;
    display: grid; place-items: center; align-content: center; gap: 4%;
    padding: 4%;
    background: linear-gradient(to bottom, #202A55 0%, #141A36 100%);
    border-right: var(--px) solid var(--line);
}
#portrait { image-rendering: pixelated; border: var(--px) solid var(--orange-dk); background: var(--bg2); }
#port-name { image-rendering: pixelated; }
#port-stats { display: grid; gap: 6px; width: 100%; }
.statline { display: flex; align-items: center; gap: 6px; }
.statline canvas { image-rendering: pixelated; }
.bar { flex: 1 1 auto; height: 9px; background: #0D1128; border: 1px solid var(--line); position: relative; }
.bar i { position: absolute; inset: 1px; width: 0; background: repeating-linear-gradient(to right, var(--orange) 0 3px, var(--orange-lit) 3px 6px); }
#list-col { position: relative; overflow: hidden; }
#list-scroll { position: absolute; inset: 0; overflow-y: auto; padding: 2% 3%; }
.pl {
    display: flex; align-items: center; gap: 3%;
    padding: 1.5% 2.5%;
    border-bottom: 1px solid #2A3358;
    cursor: pointer;
}
.pl canvas { image-rendering: pixelated; }
.pl.sel { background: linear-gradient(to right, var(--orange-dk), transparent 90%); }
.pl .cursor { width: 0; overflow: hidden; }
.pl.sel .cursor { width: auto; }
.grouphdr { padding: 2.5% 2.5% 1%; }
.grouphdr canvas { image-rendering: pixelated; }

/* ── tabel (stand) ───────────────────────────────────────── */
table.px { border-collapse: collapse; width: 100%; }
table.px td { padding: 0; }
table.px tr.rbc { background: linear-gradient(to right, var(--orange-dk), transparent); }
table.px tr.alt { background: rgba(255,255,255,.03); }
table.px canvas { image-rendering: pixelated; display: block; }

/* ── dialoogvenster (nieuws) ─────────────────────────────── */
.dlg {
    position: absolute; left: 4%; right: 4%; bottom: 14%; top: auto; height: 34%;
    background: linear-gradient(to bottom, #2B3568 0%, #141A36 100%);
    border: var(--px) solid var(--cream);
    box-shadow: inset 0 0 0 var(--px) #0D1128, 0 6px 0 rgba(0,0,0,.5);
    padding: 3%;
}
#dlg-body { image-rendering: pixelated; }
#dlg-more { position: absolute; right: 3%; bottom: 3%; animation: bob .6s steps(2) infinite; }
@keyframes bob { 0% { transform: translateY(0) } 50% { transform: translateY(3px) } 100% { transform: translateY(0) } }

/* ── wedstrijd / versus ──────────────────────────────────── */
#vs { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto 1fr; place-items: center; padding: 4%; }
#vs .side { display: grid; place-items: center; gap: 8px; }
#vs img { image-rendering: pixelated; width: 22%; min-width: 54px; }
#vs canvas { image-rendering: pixelated; }

/* ── touch d-pad ─────────────────────────────────────────── */
#pad { position: absolute; z-index: 80; display: none; }
@media (pointer: coarse) { #pad { display: block; } }
#pad { left: 3%; bottom: 14.5%; width: 27%; aspect-ratio: 1; }
.pk {
    position: absolute; width: 33.3%; height: 33.3%;
    background: rgba(74,87,153,.55); border: 2px solid rgba(246,241,226,.35);
}
.pk:active { background: var(--orange); }
.pk.up { left: 33.3%; top: 0 } .pk.dn { left: 33.3%; bottom: 0 }
.pk.lf { left: 0; top: 33.3% } .pk.rt { right: 0; top: 33.3% }
#ab { position: absolute; z-index: 80; right: 3%; bottom: 15%; display: none; gap: 8px; }
@media (pointer: coarse) { #ab { display: flex; } }
.rk {
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--orange-lit), var(--orange-dk));
    border: 2px solid #0D1128; display: grid; place-items: center;
}
.rk:active { filter: brightness(1.4); }
.rk canvas { image-rendering: pixelated; }

/* ── iconische goal ──────────────────────────────────────── */
#goal-wrap { position: absolute; inset: 0; display: grid; place-items: center; }
#goal-canvas {
    image-rendering: pixelated;
    display: block;
    height: 100%; width: auto;
    aspect-ratio: 320 / 240;
    max-width: 100%; max-height: 100%;
}

/* verborgen werkplaats voor de portretgenerator */
#forge { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>

<div id="cab">
<div id="screen">

    <!-- ══ TITEL ══ -->
    <div class="view on" id="v-title">
        <canvas id="stars"></canvas>
        <img id="title-crest" src="rbc.png" alt="RBC" width="120">
        <canvas id="title-wordmark"></canvas>
        <canvas id="title-sub"></canvas>
        <canvas id="title-press"></canvas>
        <canvas id="title-foot"></canvas>
    </div>

    <!-- ══ MENU ══ -->
    <div class="view" id="v-menu">
        <div class="hud"><canvas id="hud-menu"></canvas><span class="hud-spacer"></span><canvas id="hud-season"></canvas></div>
        <div id="menu-list"></div>
        <div class="footbar" id="foot-menu"></div>
    </div>

    <!-- ══ SELECTIE ══ -->
    <div class="view" id="v-squad">
        <div class="hud"><canvas id="hud-squad"></canvas><span class="hud-spacer"></span><canvas id="hud-count"></canvas></div>
        <div class="pane" style="padding:0">
            <div id="roster">
                <div id="port-col">
                    <canvas id="portrait" width="64" height="80"></canvas>
                    <canvas id="port-name"></canvas>
                    <div id="port-stats"></div>
                </div>
                <div id="list-col"><div id="list-scroll"></div></div>
            </div>
        </div>
        <div class="footbar" id="foot-squad"></div>
    </div>

    <!-- ══ STAND ══ -->
    <div class="view" id="v-stand">
        <div class="hud"><canvas id="hud-stand"></canvas><span class="hud-spacer"></span><canvas id="hud-div"></canvas></div>
        <div class="pane"><div class="pane-scroll" id="stand-body"></div></div>
        <div class="footbar" id="foot-stand"></div>
    </div>

    <!-- ══ WEDSTRIJD ══ -->
    <div class="view" id="v-match">
        <div class="hud"><canvas id="hud-match"></canvas></div>
        <div class="pane"><div id="vs"></div></div>
        <div class="footbar" id="foot-match"></div>
    </div>

    <!-- ══ NIEUWS ══ -->
    <div class="view" id="v-news">
        <div class="hud"><canvas id="hud-news"></canvas><span class="hud-spacer"></span><canvas id="hud-newsn"></canvas></div>
        <div class="pane" style="bottom:50%"><div class="pane-scroll" id="news-list"></div></div>
        <div class="dlg"><canvas id="dlg-body"></canvas><canvas id="dlg-more"></canvas></div>
        <div class="footbar" id="foot-news"></div>
    </div>

    <!-- ══ CLUB ══ -->
    <div class="view" id="v-club">
        <div class="hud"><canvas id="hud-club"></canvas></div>
        <div class="pane"><div class="pane-scroll" id="club-body"></div></div>
        <div class="footbar" id="foot-club"></div>
    </div>

    <!-- ══ ICONISCHE GOAL ══ -->
    <div class="view" id="v-goal">
        <div class="hud"><canvas id="hud-goal"></canvas><span class="hud-spacer"></span><canvas id="hud-goalscore"></canvas></div>
        <div class="pane" style="padding:0">
            <div id="goal-wrap"><canvas id="goal-canvas" width="320" height="240"></canvas></div>
        </div>
        <div class="footbar" id="foot-goal"></div>
    </div>

    <!-- besturing -->
    <div id="pad">
        <div class="pk up" data-k="ArrowUp"></div><div class="pk dn" data-k="ArrowDown"></div>
        <div class="pk lf" data-k="ArrowLeft"></div><div class="pk rt" data-k="ArrowRight"></div>
    </div>
    <div id="ab">
        <div class="rk" data-k="Escape"><canvas class="rkl" data-t="B"></canvas></div>
        <div class="rk" data-k="Enter"><canvas class="rkl" data-t="A"></canvas></div>
    </div>

    <div id="crt"></div>
</div>
</div>
<div id="forge"></div>

<script>
/* ════════════════════════════════════════════════════════════
   1. PIXELFONT
   In plaats van een fontbestand rasteren we bij het opstarten
   elk teken één keer op 7px en gooien we alles onder de
   drempel weg. Resultaat: een echt 1-bit font dat automatisch
   ook é/á/ï dekt, zonder handmatige glyphdata.
   ════════════════════════════════════════════════════════════ */
const FONT = (() => {
    // 11px i.p.v. 7px: veel meer detail per letter, dus veel beter leesbaar.
    // PX is met dezelfde factor verkleind, dus tekst blijft even groot op het
    // scherm maar is fijner getekend.
    const H = 11;                      // hoogte in "echte" pixels
    const cache = new Map();
    const c = document.createElement('canvas');
    const x = c.getContext('2d', { willReadFrequently: true });

    function glyph(ch) {
        if (cache.has(ch)) return cache.get(ch);
        c.width = 16; c.height = H + 4;
        x.clearRect(0, 0, c.width, c.height);
        x.imageSmoothingEnabled = false;
        x.font = `700 ${H + 2}px ui-monospace, Menlo, Consolas, monospace`;
        x.textBaseline = 'alphabetic';
        x.fillStyle = '#fff';
        x.fillText(ch, 0, H + 1);
        const d = x.getImageData(0, 0, c.width, c.height).data;
        // 1-bit drempel + bounding box zodat letters netjes aansluiten
        const rows = [];
        let minX = 99, maxX = -1;
        for (let yy = 0; yy < c.height; yy++) {
            let row = [];
            for (let xx = 0; xx < c.width; xx++) {
                const on = d[(yy * c.width + xx) * 4 + 3] > 110 ? 1 : 0;
                row.push(on);
                if (on) { if (xx < minX) minX = xx; if (xx > maxX) maxX = xx; }
            }
            rows.push(row);
        }
        if (maxX < 0) { minX = 0; maxX = 1; }           // spatie
        const g = { w: maxX - minX + 1, h: c.height, rows, minX };
        cache.set(ch, g);
        return g;
    }

    /** Rendert tekst als pixelbitmap op een canvas.
     *  s=schaal (1 pixel = s css-px), col=kleur, sh=schaduwkleur of null */
    function draw(canvas, text, s, col, sh) {
        text = String(text == null ? '' : text);
        const gs = [...text].map(glyph);
        const gap = 1;
        const w = gs.reduce((a, g) => a + g.w + gap, 0) - gap;
        const h = H + 4;
        canvas.width = Math.max(1, (w + (sh ? 1 : 0)) * s);
        canvas.height = (h + (sh ? 1 : 0)) * s;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const put = (dx, dy, color) => {
            ctx.fillStyle = color;
            let ox = 0;
            gs.forEach(g => {
                for (let yy = 0; yy < g.h; yy++)
                    for (let xx = 0; xx < g.w; xx++)
                        if (g.rows[yy][xx + g.minX])
                            ctx.fillRect((ox + xx + dx) * s, (yy + dy) * s, s, s);
                ox += g.w + gap;
            });
        };
        if (sh) put(1, 1, sh);
        put(0, 0, col);
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        return canvas;
    }
    function make(text, s, col, sh) { return draw(document.createElement('canvas'), text, s, col, sh); }
    return { draw, make, H };
})();

const C = {
    cream: '#F6F1E2', white: '#FFFFFF', orange: '#F1942D', orangeLit: '#FFC873',
    grey: '#8A94BE', red: '#D9483C', green: '#4FC06B', ink: '#080A16', dk: '#0D1128'
};

/* Schaal: 1 logische pixel = PX css-pixels, meeschalend met het scherm. */
let PX = 3;
function rescale() {
    const w = document.getElementById('screen').clientWidth;
    PX = Math.max(1, Math.round(w / 470));
    document.documentElement.style.setProperty('--px', Math.max(2, Math.round(w / 400)) + 'px');
}

/* diacritics eruit voor de smalle glyphs, net als een echte 16-bit rom */
function flat(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function txt(el, text, mult, col, sh) {
    return FONT.draw(el, flat(text).toUpperCase(), PX * (mult || 1), col || C.cream, sh === undefined ? C.dk : sh);
}
function mk(text, mult, col, sh) {
    return FONT.make(flat(text).toUpperCase(), PX * (mult || 1), col || C.cream, sh === undefined ? C.dk : sh);
}
/* gemengde kast toegestaan voor lopende tekst */
function mkRaw(text, mult, col, sh) {
    return FONT.make(flat(text), PX * (mult || 1), col || C.cream, sh === undefined ? null : sh);
}

/* ════════════════════════════════════════════════════════════
   2. GELUID — kleine blips, geen bestanden
   ════════════════════════════════════════════════════════════ */
const SFX = (() => {
    let ac = null, on = true;
    function ctx() { return ac || (ac = new (window.AudioContext || window.webkitAudioContext)()); }
    function blip(freq, dur, type) {
        if (!on) return;
        try {
            const a = ctx(), o = a.createOscillator(), g = a.createGain();
            o.type = type || 'square'; o.frequency.value = freq;
            g.gain.value = .05;
            g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
            o.connect(g).connect(a.destination);
            o.start(); o.stop(a.currentTime + dur);
        } catch (e) {}
    }
    return {
        move: () => blip(420, .05),
        ok:   () => { blip(660, .06); setTimeout(() => blip(990, .09), 55); },
        back: () => blip(240, .08),
        start:() => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, .12, 'square'), i * 90)); },
        toggle: () => { on = !on; return on; },
        get enabled() { return on; }
    };
})();

/* ════════════════════════════════════════════════════════════
   3. PORTRETGENERATOR
   96x120, 32 kleuren via median-cut, achtergrond platgeslagen.
   Begonnen op 64x80/16c (het minimum dat herkenbaar bleef); op verzoek
   fijner gezet omdat 64x80 te grof-pixelig aanvoelde.
   ════════════════════════════════════════════════════════════ */
const PORTRAIT = (() => {
    const W = 96, H = 120, COLORS = 32;
    const cache = new Map();
    const forge = document.getElementById('forge');

    function medianCut(px, depth) {
        if (depth === 0 || !px.length) {
            if (!px.length) return [[0, 0, 0]];
            let r = 0, g = 0, b = 0;
            px.forEach(p => { r += p[0]; g += p[1]; b += p[2]; });
            const n = px.length;
            return [[Math.round(r / n), Math.round(g / n), Math.round(b / n)]];
        }
        let ch = 0, best = -1;
        for (let c = 0; c < 3; c++) {
            let mn = 255, mx = 0;
            px.forEach(p => { if (p[c] < mn) mn = p[c]; if (p[c] > mx) mx = p[c]; });
            if (mx - mn > best) { best = mx - mn; ch = c; }
        }
        px.sort((a, b) => a[ch] - b[ch]);
        const mid = px.length >> 1;
        return medianCut(px.slice(0, mid), depth - 1).concat(medianCut(px.slice(mid), depth - 1));
    }
    function nearest(pal, p) {
        let bi = 0, bd = 1e9;
        for (let i = 0; i < pal.length; i++) {
            const d = (pal[i][0] - p[0]) ** 2 + (pal[i][1] - p[1]) ** 2 + (pal[i][2] - p[2]) ** 2;
            if (d < bd) { bd = d; bi = i; }
        }
        return pal[bi];
    }

    function build(img) {
        const cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        const g = cv.getContext('2d', { willReadFrequently: true });
        g.imageSmoothingEnabled = true;
        // hoofd + schouders: bovenste ~72% van een 3:4 bron
        const sh = img.naturalHeight * 0.72, sw = sh * (W / H);
        g.drawImage(img, (img.naturalWidth - sw) / 2, img.naturalHeight * 0.02, sw, sh, 0, 0, W, H);

        const d = g.getImageData(0, 0, W, H);
        const px = [];
        for (let i = 0; i < d.data.length; i += 4) px.push([d.data[i], d.data[i + 1], d.data[i + 2]]);

        // Achtergrond platslaan: bemonster de vier bovenhoeken. Bij een
        // studio-achtergrond haalt dit de ruis weg; bij een actiefoto
        // (Troost, Ubbink) scheelt het in ieder geval de reclameborden.
        const corner = [];
        [[0,0],[W-1,0],[0,1],[W-1,1],[1,0],[W-2,0]].forEach(([cx,cy]) => corner.push(px[cy*W+cx]));
        const avg = corner.reduce((a,p) => [a[0]+p[0],a[1]+p[1],a[2]+p[2]], [0,0,0]).map(v => v/corner.length);
        const FLAT = [35, 42, 87];                       // --panel, plat vlak
        const TOL = 46 * 46;
        // Over de VOLLE hoogte platslaan. Eerst stopte dit op 60%, wat een
        // harde horizontale naad door het portret trok.
        // Flood fill vanaf de RAND, niet "elke grijze pixel". De schaduw onder
        // de kin is ook grijs; die werd anders als achtergrond weggepoetst en
        // gaf een blauwe vlek op het gezicht.
        const like = j => {
            const p = px[j];
            return (p[0]-avg[0])**2 + (p[1]-avg[1])**2 + (p[2]-avg[2])**2 < TOL;
        };
        const bg = new Uint8Array(px.length);
        const stack = [];
        for (let x = 0; x < W; x++) { stack.push(x); stack.push((H - 1) * W + x); }
        for (let y = 0; y < H; y++) { stack.push(y * W); stack.push(y * W + W - 1); }
        while (stack.length) {
            const j = stack.pop();
            if (j < 0 || j >= px.length || bg[j] || !like(j)) continue;
            bg[j] = 1;
            const x = j % W;
            if (x > 0)     stack.push(j - 1);
            if (x < W - 1) stack.push(j + 1);
            stack.push(j - W);
            stack.push(j + W);
        }

        // Het palet alleen uit de speler zelf halen en FLAT er los naast
        // zetten. Anders krijgt de achtergrondkleur een palet-entry en
        // slaan donkere schaduwen op het gezicht om naar blauw.
        const fg = [];
        for (let j = 0; j < px.length; j++) if (!bg[j]) fg.push(px[j].slice());
        const pal = fg.length ? medianCut(fg, Math.log2(COLORS)) : [FLAT];
        for (let i = 0, j = 0; i < d.data.length; i += 4, j++) {
            const c = bg[j] ? FLAT : nearest(pal, px[j]);
            d.data[i] = c[0]; d.data[i+1] = c[1]; d.data[i+2] = c[2];
        }
        g.putImageData(d, 0, 0);
        return cv;
    }

    /* Fallback-sprite voor spelers zonder (bruikbare) foto:
       silhouet + rugnummer, in clubkleuren. */
    function unknown(number) {
        const cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        const g = cv.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.fillStyle = '#232C57'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#1A2145';
        for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 3);
        // silhouet
        g.fillStyle = '#151B38';
        g.fillRect(36, 21, 24, 27);                 // hoofd
        g.fillRect(21, 51, 54, 45);                 // torso
        g.fillRect(30, 45, 36, 9);                  // schouderlijn
        // shirt-wig in oranje
        g.fillStyle = '#F1942D';
        for (let i = 0; i < 18; i++) g.fillRect(48 - i, 60 + i, 2 + i * 2, 2);
        // schaal 2 en vanaf de onderkand terugrekenen: op schaal 3 viel het
        // nummer buiten het 120px hoge portret.
        const n = FONT.make(String(number == null ? '?' : number), 2, '#FFC873', '#080A16');
        g.drawImage(n, Math.round((W - n.width) / 2), H - n.height - 6);
        return cv;
    }

    function get(player) {
        const key = player.photo || ('#' + player.number);
        if (cache.has(key)) return cache.get(key);
        const p = new Promise(resolve => {
            if (!player.photo) { resolve(unknown(player.number)); return; }
            const img = new Image();
            img.onload = () => { try { resolve(build(img)); } catch (e) { resolve(unknown(player.number)); } };
            img.onerror = () => resolve(unknown(player.number));
            img.src = player.photo;
            forge.appendChild(img);
        });
        cache.set(key, p);
        return p;
    }
    return { get, W, H };
})();

   4. DATA — zelfde bronnen als index.html
   ════════════════════════════════════════════════════════════ */
const SEASON = '2026-2027', SEASON_LABEL = '2026/2027';
const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://api.cors.lol/?url='
];
const STAND_URL = `https://www.hollandsevelden.nl/competities/${SEASON}/landelijk/derde-divisie-b/`;
const SOFASCORE_TEAM = 'https://www.sofascore.com/nl/football/team/rbc-roosendaal/2969';
const NIEUWS_HOME = 'https://rbcvoetbal.nl/';

const POSNAME = { G: 'KEEPER', D: 'VERDEDIGER', M: 'MIDDENVELDER', F: 'AANVALLER', '?': 'ONBEKEND' };
const GROUPS = [['G','KEEPERS'],['D','VERDEDIGERS'],['M','MIDDENVELDERS'],['F','AANVALLERS'],['?','RESERVES']];

const DB = { squad: [], stand: null, news: [], match: null, photos: {}, notes: [] };

async function fetchWithFallback(url) {
    for (const p of PROXIES) {
        try {
            const r = await fetch(p + encodeURIComponent(url), { signal: AbortSignal.timeout(8000) });
            if (r.ok) return await r.text();
        } catch (e) {}
    }
    throw new Error('proxies down');
}
function nameSlug(n) {
    return flat(n).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
const TOO_SMALL = ['oussama-bouyaghlafen'];   // 97x130, te klein om te vergroten

async function loadLocal() {
    const m = await (await fetch('data.json?v=' + Date.now())).json();
    DB.photos = m.photos || {};
    Object.keys(DB.photos).forEach(k => { DB.photos[nameSlug(k)] = DB.photos[k]; });
    DB.match = m.match || null;
    DB.squad = (m.squad || []).map((p, i) => ({
        id: i, number: p.number, name: p.name, position: '?',
        nat: p.nationality || '', photo: usable(p.name, p.photo)
    })).sort((a, b) => a.number - b.number);
}
function usable(name, photo) {
    const slug = nameSlug(name);
    if (TOO_SMALL.includes(slug)) return null;
    return photo || DB.photos[name] || DB.photos[slug] || null;
}

async function loadSquadLive() {
    const html = await fetchWithFallback(SOFASCORE_TEAM);
    const m = html.match(/id="__NEXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
    const pp = JSON.parse(m ? m[1] : html.slice(html.indexOf('{"props"'))).props.pageProps;
    const list = ((pp.players || {}).players || []).map(e => e.player).filter(p => p && p.jerseyNumber);
    if (!list.length) throw new Error('leeg');
    DB.squad = list.map((p, i) => ({
        id: i, number: parseInt(p.jerseyNumber, 10), name: p.name,
        position: p.position || '?', nat: (p.country || {}).alpha2 || '',
        photo: usable(p.name, null)
    })).sort((a, b) => a.number - b.number);
    DB.notes.push('SELECTIE: LIVE');
}

async function loadStand() {
    const html = await fetchWithFallback(STAND_URL);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    let tbl = null;
    for (const h2 of doc.querySelectorAll('h2')) {
        if (!h2.textContent.includes('Stand')) continue;
        let el = h2.nextElementSibling;
        while (el) {
            const t = el.querySelector('table') || (el.tagName === 'TABLE' ? el : null);
            if (t) { tbl = t; break; }
            if (el.matches('h2,h3')) break;
            el = el.nextElementSibling;
        }
        if (!tbl) {
            let p = h2.parentElement;
            while (p) { const t = p.querySelector('table'); if (t) { tbl = t; break; } p = p.parentElement; if (!p || p.tagName === 'BODY') break; }
        }
        break;
    }
    if (!tbl) throw new Error('geen tabel');
    const rows = [...tbl.querySelectorAll('tbody tr')];
    DB.stand = rows.map(r => {
        const c = [...r.querySelectorAll('th,td')].map(e => e.textContent.trim().replace(/\s+/g, ' '));
        if (c.length < 5) return null;
        // twee kolomindelingen in het wild, net als in index.html
        let wed = c[2] || '', pnt, ds;
        if (c.length >= 9) { pnt = c[4] || ''; ds = c[7] || ''; }
        else { pnt = c[9] || ''; ds = c[8] || ''; }
        return { pos: c[0], club: c[1], wed, pnt, ds };
    }).filter(Boolean);
}

async function loadNews() {
    const html = await fetchWithFallback(NIEUWS_HOME);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    // De koppen staan in h3's; de nieuws-ankers zelf zijn lege spans, dus
    // op ankertekst filteren leverde nul berichten op.
    const seen = new Set(), out = [];
    const SKIP = /^(nieuwsarchief|voetbal academie|zakelijk netwerk|maatschappelijk)$/i;
    doc.querySelectorAll('h3, h1.index_title').forEach(h => {
        const t = (h.textContent || '').trim().replace(/\s+/g, ' ');
        if (t.length < 10 || t.length > 130 || seen.has(t) || SKIP.test(t)) return;
        seen.add(t); out.push({ title: t });
    });
    DB.news = out.slice(0, 10);
}

/* typemachine-effect in het dialoogvenster */
let typeTimer = null;
function typeOut(text) {
    clearInterval(typeTimer);
    const cv = document.getElementById('dlg-body');
    const more = document.getElementById('dlg-more');
    more.style.visibility = 'hidden';
    // handmatig afbreken op regels die in het venster passen
    const perLine = Math.max(18, Math.floor(document.getElementById('screen').clientWidth * 0.86 / (PX * 1.2 * 6)));
    const words = String(text).split(/\s+/);
    const lines = []; let cur = '';
    words.forEach(w => {
        if ((cur + ' ' + w).trim().length > perLine) { lines.push(cur.trim()); cur = w; }
        else cur += ' ' + w;
    });
    if (cur.trim()) lines.push(cur.trim());
    let n = 0;
    const full = lines.join('\n');
    const render = () => {
        const shown = full.slice(0, n);
        const ls = shown.split('\n');
        const cvs = ls.map(l => mkRaw(l, 1.2, C.cream));
        const w = Math.max(1, ...cvs.map(c => c.width));
        const lh = (FONT.H + 4) * PX * 1.2;
        cv.width = w; cv.height = Math.max(1, Math.round(lh * lines.length));
        cv.style.width = w + 'px'; cv.style.height = cv.height + 'px';
        const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
        g.clearRect(0, 0, cv.width, cv.height);
        cvs.forEach((c, i) => g.drawImage(c, 0, Math.round(i * lh)));
    };
    typeTimer = setInterval(() => {
        n += 2;
        render();
        if (n >= full.length) {
            clearInterval(typeTimer);
            txt(more, 'V', 1.4, C.orangeLit);
            more.style.visibility = 'visible';
        }
    }, 18);
}

        ['RBC ROOSENDAAL', 2, C.orangeLit],
        ['', 1, C.grey],
        ['STADION', 1, C.grey], ['ATIK STADION, ROOSENDAAL', 1.4, C.cream],
        ['', 1, C.grey],
        ['COMPETITIE', 1, C.grey], ['DERDE DIVISIE B - ' + SEASON_LABEL, 1.4, C.cream],
        ['', 1, C.grey],
        ['CLUBKLEUREN', 1, C.grey], ['ORANJE EN WIT', 1.4, C.cream],
        ['', 1, C.grey],
        ['DEZE EDITIE', 1, C.grey],
        ['16-BIT SCHIL OVER DE ECHTE SITE.', 1.1, C.cream],
        ['PORTRETTEN WORDEN LIVE UIT DE', 1.1, C.cream],
        ['CLUBFOTOS GEGENEREERD: 64X80, 16', 1.1, C.cream],
        ['KLEUREN, GEEN GETEKENDE SPRITES.', 1.1, C.cream]
    ];
    lines.forEach(([t, m, c]) => {
        const d = document.createElement('div');
        d.style.marginBottom = (PX) + 'px';
        if (t) d.appendChild(mk(t, m, c)); else d.style.height = (PX * 3) + 'px';
        b.appendChild(d);
    });
    if (DB.notes.length) {
        const d = document.createElement('div'); d.style.marginTop = (PX * 4) + 'px';
        d.appendChild(mk(DB.notes.join('  |  '), 1, C.green));
        b.appendChild(d);
    }
    footer(document.getElementById('foot-club'), [['B', 'TERUG']]);
}

/* ════════════════════════════════════════════════════════════
   5b. ICONISCHE GOAL — pseudo-3D reconstructie
   Mode 7-achtige projectie: per beeldlijn wordt teruggerekend
   welke diepte daar ligt, sprites schalen mee met afstand.
   Geen 3D-library, alles fillRect op een 320x240 canvas.
   ════════════════════════════════════════════════════════════ */
const GOAL = (() => {
    const W = 320, H = 240;
    const cv = document.getElementById('goal-canvas');
    const g = cv.getContext('2d');

    /* ── DE SCENE ─────────────────────────────────────────────
       Alles wat over de goal wordt beweerd staat hier, op één
       plek, zodat het in één regel te corrigeren is.

       NAGETROKKEN : Regi Blinker maakte het eerste Eredivisie-
       doelpunt in het nieuwe stadion (2001).
       RECONSTRUCTIE: tegenstander en de opzet (voorzet van
       rechts, kopbal tweede paal) zijn ingevuld, niet bevestigd.
       Daarom staat er "reconstructie" op de titelkaart.        */
    const SCENE = {
        speler:  'REGI BLINKER',
        jaar:    '2001',
        tegen:   'NAC',
        context: 'EERSTE EREDIVISIE-DOELPUNT',
        plek:    'IN HET NIEUWE STADION',
        opzet:   'VOORZET VAN RECHTS, KOPBAL TWEEDE PAAL'
    };

    const P = {
        grass1: '#2E6B34', grass2: '#357A3C', grassDk: '#245628',
        line: '#D8E4D7',
        post: '#F6F1E2', net: '#93A4CE',
        shirt: '#F1942D', shirtW: '#F6F1E2', skin: '#D8A278',
        short: '#F6F1E2', sock: '#1B2349', boot: '#0D1128',
        opp: '#E8D93F', oppDk: '#7A7016',
        keeper: '#4FC06B', keeperDk: '#2C7A40',
        ball: '#FFFFFF', ballDk: '#1A2145',
        good: '#4FC06B', bad: '#D9483C', aim: '#FFC873',
        stand: '#1B2349', standLit: '#2A3566'
    };
    P.sky1 = '#1B2A5C'; P.sky2 = '#465EA0';   // lucht: avondblauw onder de lichtmasten

    /* ── projectie ─────────────────────────────────────────── */
    const HOR = 70, CAMY = 40, FOV = 235;
    function proj(x, y, z) {
        const s = FOV / Math.max(8, z);
        return { x: W / 2 + x * s, y: HOR + (CAMY - y) * s, s };
    }

    /* ── vaste punten in de scene ──────────────────────────── */
    const GZ = 164, GHW = 60, GHH = 34;          // doel: diepte, halve breedte, hoogte
    const HIT = { x: -42, z: 152 };              // kopbalpunt, tweede paal
    const T_CROSS = 1.9, T_HIT = 3.15, WIN = 0.20;   // iets ruimer: clubsite, geen arcadehal

    let st = 'kaart';        // kaart | speel | goal | mis
    let t = 0, raf = null, last = 0;
    let pressed = null, verdict = '', shots = 0, scored = 0;
    let ballAfter = 0;

    function reset(full) {
        st = 'kaart'; t = 0; pressed = null; verdict = ''; ballAfter = 0;
        if (full) { shots = 0; scored = 0; }
    }

    /* ── baan van de bal ───────────────────────────────────── */
    function lerp(a, b, k) { return a + (b - a) * k; }
    function ease(k) { return k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k); }

    function ballAt(tt) {
        // 0.0-0.9  inspelen naar rechts
        // 0.9-1.9  vleugelspeler naar de achterlijn
        // 1.9-3.15 de voorzet, met boog
        if (tt < 0.9) {
            const k = ease(tt / 0.9);
            return { x: lerp(-34, 92, k), y: 1.5, z: lerp(96, 120, k) };
        }
        if (tt < T_CROSS) {
            const k = ease((tt - 0.9) / (T_CROSS - 0.9));
            return { x: lerp(92, 100, k), y: 1.5, z: lerp(120, 146, k) };
        }
        const k = Math.min(1, (tt - T_CROSS) / (T_HIT - T_CROSS));
        return {
            x: lerp(100, HIT.x, k),
            y: Math.sin(k * Math.PI) * 30 + 2,
            z: lerp(146, HIT.z, k)
        };
    }

    // na de kopbal: van het kopbalpunt het doel in
    function ballGoalAt(k) {
        return { x: lerp(HIT.x, -24, k), y: lerp(15, 6, k), z: lerp(HIT.z, GZ + 6, k) };
    }
    function ballMissAt(k) {
        return { x: lerp(HIT.x, -76, k), y: lerp(15, 40, k), z: lerp(HIT.z, GZ + 26, k) };
    }

    /* ── posities van de spelers ───────────────────────────── */
    function blinkerAt(tt) {
        const k = ease(Math.min(1, (tt - 1.2) / (T_HIT - 1.2)));
        return { x: lerp(24, HIT.x, k), z: lerp(126, HIT.z, k) };
    }
    function wingerAt(tt) {
        const k = ease(Math.min(1, tt / T_CROSS));
        return { x: lerp(56, 100, k), z: lerp(102, 146, k) };
    }
    function markerAt(tt) {                        // verdediger in de rug
        const b = blinkerAt(tt - 0.16);
        return { x: b.x + 11, z: b.z - 5 };
    }
    function keeperAt(tt) {
        const k = ease(Math.min(1, (tt - T_CROSS) / (T_HIT - T_CROSS)));
        return { x: lerp(4, -20, k), z: GZ - 5 };
    }

    /* ── tekenen ───────────────────────────────────────────── */
    function px(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x | 0, y | 0, Math.max(1, w | 0), Math.max(1, h | 0)); }

    function drawSky() {
        const sky = g.createLinearGradient(0, 0, 0, HOR);
        sky.addColorStop(0, P.sky1); sky.addColorStop(1, P.sky2);
        g.fillStyle = sky; g.fillRect(0, 0, W, HOR);
        // tribune achter het doel
        px(0, HOR - 26, W, 26, P.stand);
        for (let x = 0; x < W; x += 3)
            px(x, HOR - 24 + ((x * 7) % 5), 2, 2,
               ['#F1942D', '#F6F1E2', '#2A3566', '#3B4C8A'][(x * 5) % 4]);
        px(0, HOR - 3, W, 3, '#0D1128');
    }

    function drawPitch() {
        // Per beeldlijn de diepte terugrekenen: z = FOV*CAMY/(sy-HOR).
        for (let sy = HOR; sy < H; sy++) {
            const z = FOV * CAMY / Math.max(0.6, sy - HOR);
            const band = Math.floor(z / 16) % 2;
            px(0, sy, W, 1, band ? P.grass1 : P.grass2);
        }
        // lijnen: constante z = horizontale schermlijn
        const zline = z => HOR + CAMY * (FOV / z);
        const drawZ = (z, x0, x1, c) => {
            const a = proj(x0, 0, z), b = proj(x1, 0, z);
            px(Math.min(a.x, b.x), zline(z), Math.abs(b.x - a.x), 1, c || P.line);
        };
        const drawX = (x, z0, z1, c) => {
            for (let z = z0; z <= z1; z += 1.5) {
                const p = proj(x, 0, z);
                px(p.x, p.y, Math.max(1, p.s * 0.9), 1, c || P.line);
            }
        };
        drawZ(GZ, -150, 150);                      // achterlijn
        drawZ(GZ - 68, -104, 104);                 // 16 meter
        drawX(-104, GZ - 68, GZ); drawX(104, GZ - 68, GZ);
        drawZ(GZ - 26, -44, 44);                   // 5 meter
        drawX(-44, GZ - 26, GZ); drawX(44, GZ - 26, GZ);
        drawX(-150, 80, GZ); drawX(150, 80, GZ);   // zijlijnen
    }

    function drawGoal() {
        const l = proj(-GHW, 0, GZ), r = proj(GHW, 0, GZ);
        const lt = proj(-GHW, GHH, GZ), rt = proj(GHW, GHH, GZ);
        // net
        const nw = r.x - l.x, nh = l.y - lt.y;
        for (let i = 0; i <= 12; i++) px(l.x + (nw / 12) * i, lt.y, 1, nh, P.net);
        for (let j = 0; j <= 6; j++)  px(l.x, lt.y + (nh / 6) * j, nw, 1, P.net);
        // palen en lat
        const pw = Math.max(2, l.s * 1.6);
        px(l.x - pw, lt.y, pw, nh + 1, P.post);
        px(r.x, rt.y, pw, nh + 1, P.post);
        px(l.x - pw, lt.y - pw, nw + pw * 2, pw, P.post);
    }

    /* speler-sprite, geschaald op afstand */
    function drawMan(wx, wz, kit, opts) {
        opts = opts || {};
        const p = proj(wx, 0, wz);
        const u = Math.max(1, p.s * 0.9);            // "pixel" op deze afstand
        const x = p.x - u * 3, y = p.y - u * 17;
        const jump = opts.jump ? u * 5 : 0;
        const yy = y - jump;
        px(x + u * 2, yy, u * 3, u * 3, P.skin);                       // hoofd
        px(x + u * 2, yy - u, u * 3, u, opts.hair || '#3B2A18');
        if (kit === 'rbc') {
            px(x, yy + u * 3, u * 6, u * 6, P.shirt);
            px(x + u * 2.2, yy + u * 3, u * 1.6, u * 6, P.shirtW);
        } else if (kit === 'opp') {
            px(x, yy + u * 3, u * 6, u * 6, P.opp);
            px(x, yy + u * 5, u * 6, u, P.oppDk);
        } else {
            px(x, yy + u * 3, u * 6, u * 6, P.keeper);
            px(x - u * 2, yy + u * 3.4, u * 2, u * 1.4, P.keeperDk);
            px(x + u * 6, yy + u * 3.4, u * 2, u * 1.4, P.keeperDk);
        }
        px(x + u * 0.4, yy + u * 9, u * 2.2, u * 4, P.short);          // broek
        px(x + u * 3.4, yy + u * 9, u * 2.2, u * 4, P.short);
        px(x + u * 0.8, yy + u * 13, u * 1.6, u * 3, P.sock);          // sokken
        px(x + u * 3.6, yy + u * 13, u * 1.6, u * 3, P.sock);
        px(x + u * 0.6, yy + u * 16, u * 2, u, P.boot);
        px(x + u * 3.4, yy + u * 16, u * 2, u, P.boot);
        // schaduw
        if (!opts.jump) px(p.x - u * 3, p.y, u * 6, Math.max(1, u), 'rgba(0,0,0,.25)');
    }

    function drawBall(b) {
        const p = proj(b.x, b.y, b.z);
        const r = Math.max(3, p.s * 2.0);
        // schaduw op de grond
        const sh = proj(b.x, 0, b.z);
        px(sh.x - r * 0.8, sh.y - 1, r * 1.6, Math.max(1, r * 0.5), 'rgba(0,0,0,.28)');
        px(p.x - r / 2, p.y - r / 2, r, r, P.ball);
        px(p.x - r / 2, p.y - r / 2, Math.max(1, r / 3), Math.max(1, r / 3), P.ballDk);
        px(p.x + r / 2 - r / 3, p.y + r / 2 - r / 3, Math.max(1, r / 3), Math.max(1, r / 3), P.ballDk);
    }

    function label(text, y, mult, col, shadow) {
        const c = FONT.make(flat(text).toUpperCase(), mult, col, shadow === undefined ? '#0D1128' : shadow);
        g.imageSmoothingEnabled = false;
        g.drawImage(c, Math.round((W - c.width) / 2), y);
    }

    /* timingbalk: laat zien wanneer de kopbal moet */
    function drawTiming() {
        const bw = 150, bx = (W - bw) / 2, by = H - 22;
        px(bx - 2, by - 2, bw + 4, 12, '#0D1128');
        px(bx, by, bw, 8, '#2A3566');
        // groene zone = het trefmoment
        const z0 = ((T_HIT - WIN) - T_CROSS) / (T_HIT + 0.5 - T_CROSS);
        const z1 = ((T_HIT + WIN) - T_CROSS) / (T_HIT + 0.5 - T_CROSS);
        px(bx + bw * z0, by, bw * (z1 - z0), 8, P.good);
        const k = Math.min(1, Math.max(0, (t - T_CROSS) / (T_HIT + 0.5 - T_CROSS)));
        px(bx + bw * k - 1, by - 3, 3, 14, P.aim);
    }

    /* ── invoer ────────────────────────────────────────────── */
    function tap() {
        if (st === 'kaart') { st = 'speel'; t = 0; SFX.ok(); return; }
        if (st === 'speel') {
            if (pressed !== null) return;
            pressed = t;
            const off = Math.abs(t - T_HIT);
            shots++;
            if (off <= WIN) { st = 'goal'; scored++; verdict = 'GOAL'; SFX.start(); }
            else { st = 'mis'; verdict = t < T_HIT ? 'TE VROEG' : 'TE LAAT'; SFX.back(); }
            ballAfter = 0;
            hud();
            return;
        }
        if (st === 'goal' || st === 'mis') { reset(false); SFX.move(); }
    }

    /* ── hoofdlus ──────────────────────────────────────────── */
    function frame(ts) {
        const dt = Math.min(50, ts - last) / 1000; last = ts;

        if (st === 'speel') {
            t += dt;
            // niet gedrukt en het moment voorbij: gemist
            if (pressed === null && t > T_HIT + WIN + 0.05) {
                pressed = t; shots++; st = 'mis'; verdict = 'GEEN CONTACT'; SFX.back(); ballAfter = 0; hud();
            }
        } else if (st === 'goal' || st === 'mis') {
            ballAfter = Math.min(1, ballAfter + dt * 1.5);
        }

        g.clearRect(0, 0, W, H);
        drawSky();
        drawPitch();
        drawGoal();

        if (st === 'kaart') {
            px(20, 52, W - 40, 132, 'rgba(8,10,22,.86)');
            px(20, 52, W - 40, 2, P.shirt); px(20, 182, W - 40, 2, P.shirt);
            label(SCENE.speler, 66, 2, P.aim);
            label(SCENE.context, 92, 1, P.post);
            label(SCENE.plek, 106, 1, P.post);
            label('RBC - ' + SCENE.tegen + '   ' + SCENE.jaar, 124, 1, P.shirt);
            label(SCENE.opzet, 146, 1, '#93A4CE');
            label('VRIJE RECONSTRUCTIE', 160, 1, '#6B7885');
            label('DRUK A OM TE SPELEN', 200, 1, P.aim);
        } else {
            const tt = (st === 'speel') ? t : Math.min(t, T_HIT);
            const bl = blinkerAt(tt), mk = markerAt(tt), wg = wingerAt(tt), kp = keeperAt(tt);
            const springt = (st === 'goal') || (st === 'speel' && Math.abs(t - T_HIT) < 0.22);

            // ver naar dichtbij tekenen
            const cast = [
                { z: kp.z, f: () => drawMan(kp.x, kp.z, 'kee') },
                { z: mk.z, f: () => drawMan(mk.x, mk.z, 'opp') },
                { z: bl.z, f: () => drawMan(bl.x, bl.z, 'rbc', { jump: springt }) },
                { z: wg.z, f: () => drawMan(wg.x, wg.z, 'rbc') }
            ].sort((a, b) => b.z - a.z);
            cast.forEach(c => c.f());

            let b;
            if (st === 'goal') b = ballGoalAt(ballAfter);
            else if (st === 'mis') b = ballMissAt(ballAfter);
            else b = ballAt(t);
            drawBall(b);

            if (st === 'speel') {
                if (t < T_CROSS) label('KIJK MEE...', 190, 1, '#93A4CE');
                else {
                    drawTiming();
                    if (t > T_CROSS + 0.35) label('DRUK A OP HET JUISTE MOMENT', 190, 1, P.aim);
                }
            } else {
                // Onderin, niet over het doel heen: anders zie je de bal
                // het net niet in gaan, en dat is juist de beloning.
                px(26, 162, W - 52, 54, 'rgba(8,10,22,.88)');
                px(26, 162, W - 52, 1, st === 'goal' ? P.good : P.bad);
                label(verdict, 168, 2, st === 'goal' ? P.good : P.bad);
                label(st === 'goal' ? SCENE.speler + ' KOPT BINNEN' : 'DE KANS IS VOORBIJ',
                      192, 1, P.post);
                label('DRUK A VOOR NOG EEN POGING', 204, 1, P.aim);
            }
        }
        raf = requestAnimationFrame(frame);
    }

    function hud() {
        txt(document.getElementById('hud-goal'), 'ICONISCHE GOAL', 2, C.cream);
        txt(document.getElementById('hud-goalscore'),
            shots ? ('RAAK ' + scored + ' / ' + shots) : SCENE.jaar, 1.5, C.orangeLit);
    }

    function start() {
        hud();
        footer(document.getElementById('foot-goal'), [['A', 'KOP'], ['B', 'TERUG']]);
        reset(true);
        if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
    }
    function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

    return { start, stop, tap };
})();

/* ════════════════════════════════════════════════════════════
   6. BESTURING
   ════════════════════════════════════════════════════════════ */
function enter() {
    if (SCREEN === 'title') { SFX.start(); show('menu'); drawMenu(); return; }
    if (SCREEN === 'menu') {
        const id = MENU[menuIdx][0];
        if (id === 'klassiek') { SFX.ok(); location.href = '/'; return; }
        show(id);
        ({ goal: GOAL.start, squad: drawSquad, stand: drawStand, match: drawMatch,
           news: drawNews, club: drawClub })[id]();
        return;
    }
    if (SCREEN === 'goal') { GOAL.tap(); return; }
}
function back() {
    if (SCREEN === 'goal') GOAL.stop();        // lus stoppen, anders draait hij door
    if (SCREEN === 'menu') { SFX.back(); show('title'); return; }
    if (SCREEN !== 'title') { SFX.back(); show('menu'); drawMenu(); }
}
function move(dir) {
    if (SCREEN === 'menu') {
        menuIdx = (menuIdx + dir + MENU.length) % MENU.length; SFX.move(); drawMenu();
    } else if (SCREEN === 'squad') {
        const ids = DB.squad.map(p => p.id);
        if (!ids.length) return;
        let i = ids.indexOf(squadIdx); if (i < 0) i = 0;
        squadIdx = ids[(i + dir + ids.length) % ids.length];
        SFX.move(); drawSquad();
    } else if (SCREEN === 'news') {
        if (!DB.news.length) return;
        newsIdx = (newsIdx + dir + DB.news.length) % DB.news.length; SFX.move(); drawNews();
    } else if (SCREEN === 'stand') {
        document.getElementById('stand-body').scrollBy({ top: dir * 40 });
    } else if (SCREEN === 'club') {
        document.querySelector('#v-club .pane-scroll').scrollBy({ top: dir * 40 });
    }
    // 'goal' negeert de pijltjes: het spel draait op timing met A
}
function press(k) {
    if (k === 'ArrowDown' || k === 'ArrowRight') return move(1);
    if (k === 'ArrowUp' || k === 'ArrowLeft') return move(-1);
    if (k === 'Enter' || k === ' ') return enter();
    if (k === 'Escape') return back();
    if (k === 'SFX') { SFX.toggle(); drawMenu(); return; }
    if (k === 'CRT') { document.getElementById('crt').classList.toggle('off'); return; }
}
addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter','Escape'].includes(e.key)) {
        e.preventDefault(); press(e.key);
    }
});
document.querySelectorAll('.pk, .rk').forEach(el => {
    el.addEventListener('pointerdown', e => { e.preventDefault(); press(el.dataset.k); });
});
document.getElementById('v-title').addEventListener('click', () => { if (SCREEN === 'title') enter(); });

/* ════════════════════════════════════════════════════════════
   7. START
   ════════════════════════════════════════════════════════════ */
function redrawCurrent() {
    rescale();
    drawTitle();
    document.querySelectorAll('.rkl').forEach(c => txt(c, c.dataset.t, 1.4, C.ink, null));
    ({ title: () => {}, menu: drawMenu, goal: GOAL.start, squad: drawSquad, stand: drawStand,
       match: drawMatch, news: drawNews, club: drawClub })[SCREEN]();
}

(async function boot() {
    rescale();
    drawTitle();
    document.querySelectorAll('.rkl').forEach(c => txt(c, c.dataset.t, 1.4, C.ink, null));

    try { await loadLocal(); } catch (e) { DB.notes.push('DATA.JSON: FOUT'); }
    // live bronnen op de achtergrond; het spel start meteen
    loadSquadLive().catch(() => DB.notes.push('SELECTIE: LOKAAL'))
        .then(() => { if (SCREEN === 'squad') drawSquad(); });
    loadStand().then(() => { if (SCREEN === 'stand') drawStand(); })
        .catch(() => DB.notes.push('STAND: OFFLINE'));
    loadNews().then(() => { if (SCREEN === 'news') drawNews(); })
        .catch(() => DB.notes.push('NIEUWS: OFFLINE'));
})();

let rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(redrawCurrent, 160); });

/* PWA: zelfde service worker als de klassieke site. */
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
