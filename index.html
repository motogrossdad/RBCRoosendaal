<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>RBC Roosendaal</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="RBC Roosendaal — de app voor op de tribune. Wie is welk rugnummer, houd de stand zelf bij en stuur hem door. Werkt zonder bereik.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RBC">
<style>
/* ════════════════════════════════════════════════════════════
   RBC Roosendaal — tribune-app
   Uitgangspunten, uit wat er in het stadion te zien was:
   · het publiek is ouder en kijkt op de telefoon → grote letters,
     veel contrast, ruime knoppen, duim onderaan
   · bereik in het stadion is slecht en een club in de Derde
     Divisie heeft geen live-datavoorziening → alles werkt offline
     en de supporter houdt de stand zélf bij
   · de selectie wisselt sterk → rugnummer opzoeken staat voorop
   ════════════════════════════════════════════════════════════ */
:root {
    --oranje:     #C25E00;
    --oranje-licht:#FFF3E3;
    --grijs:      #5A5A5A;
    --lijn:       #DCDCDC;
    --tab-h:      4.6rem;
    color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { font-size: 20px; -webkit-text-size-adjust: 100%; }

body {
    background: #fff;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    overflow-x: hidden;
}
.wrap { max-width: 34rem; margin: 0 auto; padding: 0 1rem; }

/* ── kop ───────────────────────────────────────────────── */
header {
    display: flex; align-items: center; gap: 0.8rem;
    padding: calc(0.8rem + env(safe-area-inset-top)) 0 0.8rem;
}
header img { width: 2.5rem; height: auto; flex-shrink: 0; }
header .naam { min-width: 0; }
header h1 { font-size: 1.15rem; line-height: 1.15; white-space: nowrap; }
header .sub { color: var(--grijs); font-size: 0.78rem; white-space: nowrap; }
/* Alleen de vlag: met "NL"/"EN" erbij werd de clubnaam over twee
   regels geduwd op een telefoon. */
.talen { margin-left: auto; display: flex; gap: 0.3rem; flex-shrink: 0; }
.talen button {
    font: inherit; font-size: 1.15rem;
    padding: 0; width: 2.5rem; height: 2.5rem;
    background: #fff; border: 2px solid var(--lijn); border-radius: 0.35rem;
    cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
}
.talen button[aria-pressed="true"] { border-color: #000; border-width: 3px; }

/* ── schermen ──────────────────────────────────────────── */
.scherm { display: none; padding-bottom: 2rem; }
.scherm.aan { display: block; }
h2 {
    font-size: 1.15rem; margin: 1.6rem 0 0.7rem;
    padding-bottom: 0.3rem; border-bottom: 2px solid #000;
}
.scherm > .wrap > h2:first-child { margin-top: 0.6rem; }

/* ── scorebord: de supporter houdt zelf bij ────────────── */
.bord {
    border: 3px solid #000; border-radius: 0.6rem;
    padding: 0.9rem; margin-top: 0.4rem;
}
.bord-namen {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem; align-items: center; text-align: center;
}
.bord-namen .club {
    font-size: 0.9rem; font-weight: 700; line-height: 1.2;
    overflow-wrap: anywhere;
}
.bord-namen .club.eigen { color: var(--oranje); }
.bord-cijfers {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 0.5rem; align-items: center; text-align: center;
    margin: 0.1rem 0 0.5rem;
}
.bord-cijfers .n { font-size: 4.2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bord-cijfers .streep { font-size: 2rem; font-weight: 700; color: var(--grijs); }
.bord-knoppen { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.klok {
    text-align: center; font-size: 1.05rem; font-weight: 700;
    font-variant-numeric: tabular-nums; margin-bottom: 0.5rem;
    color: var(--grijs);
}
.klok button {
    font: inherit; font-size: 0.85rem; font-weight: 700;
    background: none; border: 2px solid var(--lijn); border-radius: 0.3rem;
    padding: 0.2rem 0.55rem; margin-left: 0.4rem; cursor: pointer; color: #000;
}

button.groot {
    font: inherit; font-size: 1rem; font-weight: 700;
    min-height: 3.4rem; padding: 0.7rem 0.5rem;
    border: 2px solid #000; border-radius: 0.45rem;
    background: #fff; color: #000; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    width: 100%;
}
button.groot.zwart { background: #000; color: #fff; }
button.groot.oranje { background: var(--oranje); border-color: var(--oranje); color: #fff; }
button.groot:active { filter: brightness(0.85); }
button.groot[disabled] { opacity: 0.4; }
button.klein {
    font: inherit; font-size: 0.85rem; font-weight: 700;
    min-height: 2.6rem; padding: 0.4rem 0.7rem;
    border: 2px solid var(--lijn); border-radius: 0.35rem;
    background: #fff; color: #000; cursor: pointer;
}

/* ── verloop van de wedstrijd ──────────────────────────── */
ul.verloop { list-style: none; margin-top: 1rem; }
ul.verloop li {
    display: flex; align-items: baseline; gap: 0.7rem;
    padding: 0.6rem 0; border-bottom: 1px solid var(--lijn);
}
ul.verloop .min {
    flex: 0 0 3.1rem; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--grijs); font-size: 0.95rem;
}
ul.verloop .wie { flex: 1 1 auto; font-size: 1.05rem; }
ul.verloop li.eigen .wie { font-weight: 700; color: var(--oranje); }
ul.verloop .weg {
    flex: 0 0 auto; background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 1.4rem; line-height: 1; color: var(--grijs);
    padding: 0.15rem 0.4rem;
}
.leegmelding { color: var(--grijs); padding: 0.8rem 0; }

/* ── keuzevenster (wie scoorde) ────────────────────────── */
.venster {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,.45);
    display: none; align-items: flex-end;
}
.venster.aan { display: flex; }
.venster-blad {
    background: #fff; width: 100%; max-height: 86vh;
    border-radius: 0.9rem 0.9rem 0 0;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    overflow-y: auto;
    max-width: 34rem; margin: 0 auto;
}
.venster-kop {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; margin-bottom: 0.7rem;
}
.venster-kop h3 { font-size: 1.1rem; }
.minuutrij {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 0.8rem;
}
.minuutrij label { font-size: 0.9rem; font-weight: 700; }
.minuutrij input {
    width: 5rem; font: inherit; font-size: 1.4rem; font-weight: 700;
    text-align: center; padding: 0.35rem;
    border: 2px solid #000; border-radius: 0.4rem;
}
ul.kieslijst { list-style: none; }
ul.kieslijst li {
    display: flex; align-items: baseline; gap: 0.8rem;
    padding: 0.75rem 0.2rem; border-bottom: 1px solid var(--lijn);
    cursor: pointer; font-size: 1.1rem;
}
ul.kieslijst .rug {
    flex: 0 0 2.2rem; text-align: right; font-weight: 700;
    font-size: 1.3rem; font-variant-numeric: tabular-nums;
}
ul.kieslijst li:active { background: var(--oranje-licht); }

/* ── rugnummer opzoeken ────────────────────────────────── */
label.zoek-label { display: block; font-size: 0.95rem; font-weight: 700; margin-bottom: 0.4rem; }
#nummer {
    width: 100%; font: inherit; font-size: 2.6rem; font-weight: 700;
    text-align: center; padding: 0.5rem;
    border: 3px solid #000; border-radius: 0.45rem; background: #fff; color: #000;
}
#nummer:focus { outline: 4px solid var(--oranje); outline-offset: 2px; }
#gevonden { margin-top: 0.6rem; min-height: 3.2rem; font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
#gevonden .leeg { font-size: 0.95rem; font-weight: 400; color: var(--grijs); }
#gevonden .details {
    display: block; font-size: 0.9rem; font-weight: 400;
    line-height: 1.45; color: var(--grijs); margin-top: 0.25rem;
}
#gevonden .details .van { color: #000; }

ul.spelers { list-style: none; }
ul.spelers li {
    display: flex; align-items: baseline; gap: 0.85rem;
    padding: 0.6rem 0; border-bottom: 1px solid var(--lijn);
    font-size: 1.1rem; cursor: pointer;
}
ul.spelers .rug {
    flex: 0 0 2.3rem; text-align: right;
    font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
ul.spelers .pos { font-size: 0.8rem; color: var(--grijs); }
ul.spelers li.raak { background: var(--oranje-licht); }
ul.spelers li.raak .rug { color: var(--oranje); }

/* ── tabellen en lijsten ───────────────────────────────── */
table { border-collapse: collapse; width: 100%; font-size: 1rem; }
th, td { text-align: left; padding: 0.5rem 0.25rem; border-bottom: 1px solid var(--lijn); }
th { font-size: 0.75rem; color: var(--grijs); font-weight: 400; border-bottom: 2px solid #000; }
td.pos, th.pos { width: 2rem; text-align: right; padding-right: 0.5rem; font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.rbc td { font-weight: 700; color: var(--oranje); }

ul.programma { list-style: none; }
ul.programma li { padding: 0.6rem 0; border-bottom: 1px solid var(--lijn); }
ul.programma .datum { display: block; font-size: 0.8rem; color: var(--grijs); }
ul.programma .duel { font-size: 1.05rem; }
ul.programma li.rbc .duel { font-weight: 700; }

.wacht { color: var(--grijs); }
.bron { font-size: 0.78rem; color: var(--grijs); margin-top: 0.6rem; }
.kaart {
    border: 2px solid var(--lijn); border-radius: 0.5rem;
    padding: 0.8rem; margin-top: 0.8rem;
}
.kaart p + p { margin-top: 0.4rem; }
.rij-knoppen { display: grid; gap: 0.55rem; margin-top: 0.8rem; }

/* ── melding offline / bijgewerkt ──────────────────────── */
#melding {
    display: none;
    background: #000; color: #fff;
    font-size: 0.85rem; text-align: center;
    padding: 0.45rem 1rem;
}
#melding.aan { display: block; }

/* ── tabbalk onderaan: bereikbaar met de duim ──────────── */
#tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: #fff; border-top: 2px solid #000;
    padding-bottom: env(safe-area-inset-bottom);
}
#tabs button {
    font: inherit; font-size: 0.72rem; font-weight: 700;
    background: none; border: 0; cursor: pointer; color: var(--grijs);
    min-height: var(--tab-h);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem;
    padding: 0.3rem 0.1rem;
}
#tabs button .ic { font-size: 1.45rem; line-height: 1; }
#tabs button[aria-current="true"] { color: #000; }
#tabs button[aria-current="true"] .ic { transform: scale(1.06); }

footer { padding: 1.5rem 0 0; border-top: 1px solid var(--lijn); margin-top: 2rem;
         display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; font-size: 0.85rem; }
footer a { color: #000; padding: 0.35rem 0; }

@media (min-width: 700px) { html { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) {
    .scherm.aan { animation: op .16s ease-out; }
    @keyframes op { from { opacity: .4 } to { opacity: 1 } }
}
</style>
</head>
<body>

<div id="melding" role="status"></div>

<div class="wrap">
    <header>
        <img src="/icons/icon-192.png" alt="RBC Roosendaal" width="192" height="192">
        <div class="naam">
            <h1>RBC Roosendaal</h1>
            <div class="sub" data-t="ondertitel"></div>
        </div>
        <div class="talen">
            <button type="button" id="taal-nl" aria-pressed="true" aria-label="Nederlands" title="Nederlands">🇳🇱</button>
            <button type="button" id="taal-en" aria-pressed="false" aria-label="English" title="English">🇬🇧</button>
        </div>
    </header>
</div>

<!-- ══ WEDSTRIJD ══ -->
<section class="scherm aan" id="s-wedstrijd">
    <div class="wrap">
        <h2 data-t="kop_wedstrijd"></h2>
        <div id="tegenstander-kaart"></div>

        <div class="bord">
            <div class="klok" id="klok"></div>
            <div class="bord-namen">
                <div class="club eigen">RBC</div>
                <div></div>
                <div class="club" id="naam-tegen">—</div>
            </div>
            <div class="bord-cijfers">
                <div class="n" id="score-rbc">0</div>
                <div class="streep">–</div>
                <div class="n" id="score-tegen">0</div>
            </div>
            <div class="bord-knoppen">
                <button class="groot oranje" id="goal-rbc" data-t="goal_rbc"></button>
                <button class="groot" id="goal-tegen" data-t="goal_tegen"></button>
            </div>
        </div>

        <ul class="verloop" id="verloop"></ul>

        <div class="rij-knoppen">
            <button class="groot zwart" id="deelknop" data-t="deel_knop"></button>
            <button class="klein" id="nieuwe-wedstrijd" data-t="nieuwe_wedstrijd"></button>
        </div>
        <p class="bron" data-t="bord_uitleg"></p>
    </div>
</section>

<!-- ══ SPELERS ══ -->
<section class="scherm" id="s-spelers">
    <div class="wrap">
        <h2 data-t="kop_spelers"></h2>
        <label class="zoek-label" for="nummer" data-t="tik_nummer"></label>
        <input id="nummer" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="2" autocomplete="off" placeholder="14" aria-describedby="gevonden">
        <div id="gevonden" role="status" aria-live="polite"></div>
        <ul class="spelers" id="spelerslijst"></ul>
        <p class="bron" id="selectie-datum"></p>
    </div>
</section>

<!-- ══ STAND ══ -->
<section class="scherm" id="s-stand">
    <div class="wrap">
        <h2 data-t="kop_stand"></h2>
        <div id="stand-inhoud"><p class="wacht" data-t="laden"></p></div>
    </div>
</section>

<!-- ══ MEER ══ -->
<section class="scherm" id="s-meer">
    <div class="wrap">
        <h2 data-t="kop_programma"></h2>
        <div id="programma-inhoud"><p class="wacht" data-t="laden"></p></div>

        <h2 data-t="kop_club"></h2>
        <div class="kaart">
            <p><strong>Atik Stadion</strong><br>Roosendaal</p>
            <p data-t="club_tekst"></p>
        </div>

        <h2 data-t="kop_app"></h2>
        <div class="kaart">
            <p data-t="app_tekst"></p>
            <div class="rij-knoppen">
                <button class="groot" id="installeer" data-t="installeer" hidden></button>
                <button class="klein" id="ververs" data-t="ververs"></button>
            </div>
            <p class="bron" id="cache-info"></p>
        </div>

        <footer>
            <a href="/klassiek.html" data-t="voet_uitgebreid"></a>
            <a href="/teletekst.html">Teletekst</a>
            <a href="/snes.html">16-bit</a>
        </footer>
    </div>
</section>

<!-- ══ keuzevenster: wie scoorde ══ -->
<div class="venster" id="venster" role="dialog" aria-modal="true" aria-labelledby="venster-titel">
    <div class="venster-blad">
        <div class="venster-kop">
            <h3 id="venster-titel" data-t="wie_scoorde_kop"></h3>
            <button class="klein" id="venster-dicht" data-t="sluiten"></button>
        </div>
        <div class="minuutrij">
            <label for="minuut" data-t="minuut"></label>
            <input id="minuut" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3">
            <button class="klein" id="onbekend" data-t="niet_bekend"></button>
        </div>
        <ul class="kieslijst" id="kieslijst"></ul>
    </div>
</div>

<!-- ══ tabbalk ══ -->
<nav id="tabs">
    <button type="button" data-scherm="wedstrijd" aria-current="true"><span class="ic">⚽</span><span data-t="tab_wedstrijd"></span></button>
    <button type="button" data-scherm="spelers"><span class="ic">👕</span><span data-t="tab_spelers"></span></button>
    <button type="button" data-scherm="stand"><span class="ic">📊</span><span data-t="tab_stand"></span></button>
    <button type="button" data-scherm="meer"><span class="ic">☰</span><span data-t="tab_meer"></span></button>
</nav>

<script>

   1. TAAL
   ════════════════════════════════════════════════════════ */

        geen_wedstrijd: 'No match scheduled yet.',
        th_club: 'Club', th_wed: 'P', th_ptn: 'Pts',
        geen_duels: 'No matches found.',
        stuk: w => w + ' could not be loaded right now.',
        w_stand: 'The table', w_programma: 'The fixtures',
        offline: 'No connection — showing the data last downloaded.',
        bijgewerkt: 'Data updated.',
        club_tekst: 'Founded in 1912. Orange and white.',
        app_tekst: 'This app works without a signal. Add it to your home screen and it is always there in the stand.',
        installeer: 'Add to home screen', ververs: 'Refresh data',
        cache: d => 'Last downloaded: ' + d, cache_nooit: 'Nothing downloaded yet.',
        voet_uitgebreid: 'Full site',
        nieuwe_versie: 'New version — tap to refresh',
        posities: {}, landen: {},
        maanden: ['January','February','March','April','May','June','July',
                  'August','September','October','November','December']
    }
};
let TAAL = 'nl';
try { const v = localStorage.getItem('rbc-taal'); if (v === 'en' || v === 'nl') TAAL = v; } catch (e) {}
const t = k => TEKST[TAAL][k];

const $ = id => document.getElementById(id);
const veilig = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const isRBC = n => /^rbc\b/i.test(String(n || '').trim());

function zetTaal(nieuw) {
    TAAL = nieuw;
    try { localStorage.setItem('rbc-taal', nieuw); } catch (e) {}
    document.documentElement.lang = nieuw;
    $('taal-nl').setAttribute('aria-pressed', String(nieuw === 'nl'));
    $('taal-en').setAttribute('aria-pressed', String(nieuw === 'en'));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    tekenAlles();
}

/* ════════════════════════════════════════════════════════
   2. OPSLAG
   Alles lokaal. De app moet het doen zonder bereik.
   ════════════════════════════════════════════════════════ */
const OPSLAG = {
    lees(sleutel, standaard) {
        try { const v = localStorage.getItem(sleutel); return v ? JSON.parse(v) : standaard; }
        catch (e) { return standaard; }
    },
    schrijf(sleutel, waarde) {
        try { localStorage.setItem(sleutel, JSON.stringify(waarde)); } catch (e) {}
    }
};

const D = { squad: [], bijgewerkt: null, volgende: null,
            stand: null, programma: null, opgehaald: null, fout: {} };

/* wedstrijd die de supporter bijhoudt */
let W = OPSLAG.lees('rbc-wedstrijd', null);
function nieuweWedstrijd(tegen) {
    W = { tegen: tegen || '', rbc: 0, hen: 0, doelpunten: [],
          start: null, gestopt: 0, begonnen: Date.now() };
    OPSLAG.schrijf('rbc-wedstrijd', W);
}
function bewaar() { OPSLAG.schrijf('rbc-wedstrijd', W); }

/* ════════════════════════════════════════════════════════
   3. SCORE BIJHOUDEN
   Geen live feed: in de Derde Divisie is die er niet. De
   supporter op de tribune is de bron, en dat is meteen wat
   hij toch al deed — de stand doorappen naar het thuisfront.
   ════════════════════════════════════════════════════════ */
/* Voetbal telt vanaf de 1e minuut: de eerste zestig seconden zijn
   minuut 1, niet minuut 0. */
function klokTekst() {
    if (!W || (!W.start && !W.gestopt)) return '—';
    return verstrekenMinuut() + "'";
}
function verstrekenMinuut() {
    if (!W) return 1;
    const ms = W.gestopt + (W.start ? Date.now() - W.start : 0);
    return Math.floor(ms / 60000) + 1;
}
function huidigeMinuut() {
    if (!W || (!W.start && !W.gestopt)) return '';
    return String(verstrekenMinuut());
}

function tekenKlok() {
    const el = $('klok');
    if (!W) { el.textContent = ''; return; }
    const loopt = !!W.start;
    el.innerHTML = veilig(klokTekst()) +
        '<button type="button" id="klok-knop">' + (loopt ? '❚❚' : '▶') + '</button>' +
        (W.start || W.gestopt ? '<button type="button" id="klok-nul">↺</button>' : '');
    const k = $('klok-knop');
    if (k) k.addEventListener('click', () => {
        if (W.start) { W.gestopt += Date.now() - W.start; W.start = null; }
        else { W.start = Date.now(); }
        bewaar(); tekenKlok();
    });
    const n = $('klok-nul');
    if (n) n.addEventListener('click', () => { W.start = null; W.gestopt = 0; bewaar(); tekenKlok(); });
}
setInterval(() => { if (W && W.start && $('s-wedstrijd').classList.contains('aan')) tekenKlok(); }, 15000);

function tekenBord() {
    if (!W) nieuweWedstrijd(D.volgende ? tegenstanderVan(D.volgende) : '');
    $('score-rbc').textContent = W.rbc;
    $('score-tegen').textContent = W.hen;
    $('naam-tegen').textContent = W.tegen || '—';
    tekenKlok();

    // eerstvolgende wedstrijd erboven, zolang die bekend is
    const kaart = $('tegenstander-kaart');
    if (D.volgende && D.volgende.home_team) {
        kaart.innerHTML = '<div class="kaart"><p><strong>' + veilig(t('volgende_wedstrijd')) + '</strong></p>' +
            '<p>' + veilig(D.volgende.home_team) + ' – ' + veilig(D.volgende.away_team) + '<br>' +
            veilig(D.volgende.status || '') + '</p></div>';
    } else { kaart.innerHTML = ''; }

    const lijst = $('verloop');
    if (!W.doelpunten.length) {
        lijst.innerHTML = '<li class="leegmelding">' + veilig(t('verloop_leeg')) + '</li>';
    } else {
        lijst.innerHTML = W.doelpunten.map(function (d, i) {
            const wie = d.eigen ? (d.naam || t('onbekende_speler')) : (W.tegen || t('goal_tegen'));
            return '<li' + (d.eigen ? ' class="eigen"' : '') + '>' +
                   '<span class="min">' + (d.minuut ? veilig(d.minuut) + "'" : '—') + '</span>' +
                   '<span class="wie">' + veilig(wie) + '</span>' +
                   '<button class="weg" data-i="' + i + '" aria-label="verwijderen">×</button></li>';
        }).join('');
        lijst.querySelectorAll('.weg').forEach(function (b) {
            b.addEventListener('click', function () {
                const d = W.doelpunten[+b.dataset.i];
                if (d.eigen) W.rbc = Math.max(0, W.rbc - 1); else W.hen = Math.max(0, W.hen - 1);
                W.doelpunten.splice(+b.dataset.i, 1);
                bewaar(); tekenBord();
            });
        });
    }
}

function tegenstanderVan(m) {
    if (!m || !m.home_team) return '';
    return isRBC(m.home_team) ? m.away_team : m.home_team;
}

/* keuzevenster voor de doelpuntenmaker */
let wachtOpKeuze = false;
function openVenster() {
    wachtOpKeuze = true;
    $('minuut').value = huidigeMinuut();
    $('kieslijst').innerHTML = D.squad.map(function (p) {
        return '<li data-naam="' + veilig(p.name) + '">' +
               '<span class="rug">' + veilig(p.number) + '</span>' +
               '<span>' + veilig(p.name) + '</span></li>';
    }).join('');
    $('kieslijst').querySelectorAll('li').forEach(function (li) {
        li.addEventListener('click', function () { legVast(li.dataset.naam); });
    });
    $('venster').classList.add('aan');
}
function sluitVenster() { $('venster').classList.remove('aan'); wachtOpKeuze = false; }
function legVast(naam) {
    const m = $('minuut').value.replace(/\D/g, '');
    W.rbc += 1;
    W.doelpunten.push({ eigen: true, naam: naam || '', minuut: m });
    bewaar(); sluitVenster(); tekenBord();
}

$('goal-rbc').addEventListener('click', function () {
    if (!D.squad.length) { W.rbc += 1; W.doelpunten.push({ eigen: true, naam: '', minuut: huidigeMinuut() }); bewaar(); tekenBord(); return; }
    openVenster();
});
$('goal-tegen').addEventListener('click', function () {
    W.hen += 1;
    W.doelpunten.push({ eigen: false, naam: '', minuut: huidigeMinuut() });
    bewaar(); tekenBord();
});
$('venster-dicht').addEventListener('click', sluitVenster);
$('onbekend').addEventListener('click', function () { legVast(''); });
$('venster').addEventListener('click', function (e) { if (e.target === $('venster')) sluitVenster(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && wachtOpKeuze) sluitVenster(); });

$('nieuwe-wedstrijd').addEventListener('click', function () {
    nieuweWedstrijd(D.volgende ? tegenstanderVan(D.volgende) : '');
    tekenBord();
});

/* ── doorsturen ── */
function deelTekst() {
    const tegen = W.tegen || '';
    const regels = ['RBC ' + W.rbc + ' - ' + W.hen + (tegen ? ' ' + tegen : '')];
    if (W.doelpunten.length) {
        regels.push('');
        W.doelpunten.forEach(function (d) {
            const wie = d.eigen ? (d.naam || 'RBC') : (tegen || '—');
            regels.push((d.minuut ? d.minuut + "'" : '') + '  ' + wie);
        });
    }
    regels.push('', 'rbcroosendaal.com');
    return regels.join('\n');
}
$('deelknop').addEventListener('click', async function () {
    const tekst = deelTekst();
    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
});

/* ════════════════════════════════════════════════════════
   4. SPELERS
   ════════════════════════════════════════════════════════ */
function tekenSpelers() {
    const datumEl = $('selectie-datum');
    if (!D.squad.length) {
        $('spelerslijst').innerHTML = '<li class="wacht">' + t('laden') + '</li>';
        return;
    }
    const posities = t('posities');
    $('spelerslijst').innerHTML = D.squad.map(function (p) {
        const pos = p.positie ? (posities[p.positie] || p.positie) : '';
        return '<li data-nr="' + veilig(p.number) + '">' +
               '<span class="rug">' + veilig(p.number) + '</span>' +
               '<span><span class="naam">' + veilig(p.name) + '</span>' +
               (pos ? '<br><span class="pos">' + veilig(pos) + '</span>' : '') + '</span></li>';
    }).join('');
    $('spelerslijst').querySelectorAll('li[data-nr]').forEach(function (li) {
        li.addEventListener('click', function () {
            $('nummer').value = li.dataset.nr;
            zoek();
            $('gevonden').scrollIntoView({ block: 'center' });
        });
    });

    if (D.bijgewerkt) {
        const d = new Date(D.bijgewerkt + 'T00:00:00');
        const datum = TAAL === 'nl'
            ? d.getDate() + ' ' + t('maanden')[d.getMonth()] + ' ' + d.getFullYear()
            : t('maanden')[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        datumEl.textContent = t('nummers_bijgewerkt')(datum);
    }
    zoek();
}

function zoek() {
    const veld = $('nummer');
    const nr = veld.value.replace(/\D/g, '');
    veld.value = nr;
    const uit = $('gevonden');
    document.querySelectorAll('#spelerslijst li').forEach(function (li) { li.classList.remove('raak'); });

    if (!nr) { uit.innerHTML = '<span class="leeg">' + veilig(t('zoek_hint')) + '</span>'; return; }
    const speler = D.squad.find(function (p) { return String(p.number) === String(+nr); });
    if (!speler) { uit.innerHTML = '<span class="leeg">' + veilig(t('niet_gevonden')(nr)) + '</span>'; return; }

    const posities = t('posities'), landen = t('landen');
    const regel = [];
    if (speler.positie) regel.push(posities[speler.positie] || speler.positie);
    if (speler.leeftijd) regel.push(speler.leeftijd + ' ' + t('jaar'));
    if (speler.nationaliteiten && speler.nationaliteiten.length) {
        regel.push(speler.nationaliteiten.map(function (n) { return landen[n] || n; }).join('/'));
    }
    let details = regel.length ? veilig(regel.join(' · ')) : '';
    if (speler.vorige_club) {
        details += (details ? '<br>' : '') + veilig(t('eerder_bij')) +
                   ' <span class="van">' + veilig(speler.vorige_club) + '</span>';
    }
    uit.innerHTML = veilig(speler.name) + (details ? '<span class="details">' + details + '</span>' : '');
    const li = document.querySelector('#spelerslijst li[data-nr="' + speler.number + '"]');
    if (li) li.classList.add('raak');
}
$('nummer').addEventListener('input', zoek);

/* ════════════════════════════════════════════════════════
   5. STAND EN PROGRAMMA
   Opgehaald zolang er bereik is, daarna uit de opslag.
   ════════════════════════════════════════════════════════ */
const SEASON = '2026-2027';
const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://api.cors.lol/?url='
];
const STAND_URL = 'https://www.hollandsevelden.nl/competities/' + SEASON + '/landelijk/derde-divisie-b/';
const PROGRAMMA_URL = STAND_URL + 'programma/';

async function haal(url) {
    for (const p of PROXIES) {
        try {
            const r = await fetch(p + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
            if (r.ok) return await r.text();
        } catch (e) {}
    }
    throw new Error('bron onbereikbaar');
}
const dom = h => new DOMParser().parseFromString(h, 'text/html');

function tekenStand() {
    const el = $('stand-inhoud');
    if (!D.stand) {
        el.innerHTML = '<p class="wacht">' + veilig(D.fout.stand ? t('stuk')(t('w_stand')) : t('laden')) + '</p>';
        return;
    }
    el.innerHTML = '<table><thead><tr><th class="pos">#</th><th>' + veilig(t('th_club')) + '</th>' +
        '<th class="n">' + veilig(t('th_wed')) + '</th><th class="n">' + veilig(t('th_ptn')) +
        '</th></tr></thead><tbody>' +
        D.stand.map(function (r) {
            return '<tr' + (isRBC(r.club) ? ' class="rbc"' : '') + '>' +
                   '<td class="pos">' + veilig(r.pos) + '</td><td>' + veilig(r.club) + '</td>' +
                   '<td class="n">' + veilig(r.wed) + '</td><td class="n">' + veilig(r.pnt) + '</td></tr>';
        }).join('') + '</tbody></table>';
}

function tekenProgramma() {
    const el = $('programma-inhoud');
    if (!D.programma) {
        el.innerHTML = '<p class="wacht">' + veilig(D.fout.programma ? t('stuk')(t('w_programma')) : t('laden')) + '</p>';
        return;
    }
    if (!D.programma.length) { el.innerHTML = '<p class="wacht">' + veilig(t('geen_duels')) + '</p>'; return; }
    el.innerHTML = '<ul class="programma">' + D.programma.map(function (w) {
        return '<li' + (isRBC(w.thuis) || isRBC(w.uit) ? ' class="rbc"' : '') + '>' +
               '<span class="datum">' + veilig(w.datum) + ' · ' + veilig(w.tijd) + '</span>' +
               '<span class="duel">' + veilig(w.thuis) + ' – ' + veilig(w.uit) + '</span></li>';
    }).join('') + '</ul>';
}

function standTabel(doc) {
    const koppen = doc.querySelectorAll('h2');
    for (let i = 0; i < koppen.length; i++) {
        const h2 = koppen[i];
        if (!h2.textContent.includes('Stand')) continue;
        let el = h2.nextElementSibling;
        while (el) {
            const tb = el.querySelector('table') || (el.tagName === 'TABLE' ? el : null);
            if (tb) return tb;
            if (el.matches('h2,h3')) break;
            el = el.nextElementSibling;
        }
        let p = h2.parentElement;
        while (p) { const tb = p.querySelector('table'); if (tb) return tb; p = p.parentElement; if (!p || p.tagName === 'BODY') break; }
        break;
    }
    return null;
}

async function haalStand() {
    const tb = standTabel(dom(await haal(STAND_URL)));
    if (!tb) throw new Error('geen tabel');
    const rijen = [];
    tb.querySelectorAll('tbody tr').forEach(function (r) {
        const c = [];
        r.querySelectorAll('th,td').forEach(function (e) { c.push(e.textContent.trim().replace(/\s+/g, ' ')); });
        if (c.length < 5) return;
        rijen.push(c.length >= 9
            ? { pos: c[0], club: c[1], wed: c[2], pnt: c[4] }
            : { pos: c[0], club: c[1], wed: c[2], pnt: c[9] || '' });
    });
    if (!rijen.length) throw new Error('leeg');
    D.stand = rijen;
    OPSLAG.schrijf('rbc-stand', rijen);
    tekenStand();
}

async function haalProgramma() {
    const doc = dom(await haal(PROGRAMMA_URL));
    const uit = [];
    doc.querySelectorAll('table.match,table[class*="match"]').forEach(function (tb) {
        const cap = tb.querySelector('caption time,caption');
        const datum = cap ? cap.textContent.trim().replace(/\s+/g, ' ')
            .replace(/^wedstrijden op\s*/i, '').replace(/\s*20\d\d$/, '') : '';
        tb.querySelectorAll('tbody tr').forEach(function (row) {
            const c = row.querySelectorAll('td');
            if (c.length < 4) return;
            uit.push({ datum: datum,
                thuis: c[0].textContent.trim().replace(/\s+/g, ' '),
                uit: c[2].textContent.trim().replace(/\s+/g, ' '),
                tijd: c[3].textContent.trim().replace(/\s+/g, ' ') });
        });
    });
    const eigen = uit.filter(function (w) { return isRBC(w.thuis) || isRBC(w.uit); });
    D.programma = (eigen.length ? eigen : uit).slice(0, 10);
    OPSLAG.schrijf('rbc-programma', D.programma);
    tekenProgramma();
}

/* ════════════════════════════════════════════════════════
   6. SCHERMEN
   ════════════════════════════════════════════════════════ */
function toon(naam) {
    document.querySelectorAll('.scherm').forEach(function (s) { s.classList.remove('aan'); });
    $('s-' + naam).classList.add('aan');
    document.querySelectorAll('#tabs button').forEach(function (b) {
        b.setAttribute('aria-current', String(b.dataset.scherm === naam));
    });
    window.scrollTo(0, 0);
    try { localStorage.setItem('rbc-scherm', naam); } catch (e) {}
    if (naam === 'spelers') setTimeout(function () { $('nummer').focus({ preventScroll: true }); }, 60);
}
document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () { toon(b.dataset.scherm); });
});

function tekenAlles() { tekenBord(); tekenSpelers(); tekenStand(); tekenProgramma(); tekenCacheInfo(); }

/* ════════════════════════════════════════════════════════
   7. MELDINGEN, INSTALLEREN, VERVERSEN
   ════════════════════════════════════════════════════════ */
let meldTimer = null;
function meld(tekst, blijf) {
    const el = $('melding');
    el.textContent = tekst;
    el.classList.add('aan');
    clearTimeout(meldTimer);
    if (!blijf) meldTimer = setTimeout(function () { el.classList.remove('aan'); }, 2600);
}
function tekenCacheInfo() {
    const el = $('cache-info');
    if (!el) return;
    el.textContent = D.opgehaald
        ? t('cache')(new Date(D.opgehaald).toLocaleString(TAAL === 'nl' ? 'nl-NL' : 'en-GB'))
        : t('cache_nooit');
}

let installatie = null;
window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); installatie = e; $('installeer').hidden = false;
});
$('installeer').addEventListener('click', async function () {
    if (!installatie) return;
    installatie.prompt();
    await installatie.userChoice;
    installatie = null; $('installeer').hidden = true;
});

async function verversAlles(metMelding) {
    if (!navigator.onLine) { meld(t('offline')); return; }
    D.fout = {};
    const klaar = await Promise.allSettled([haalStand(), haalProgramma()]);
    if (klaar[0].status === 'rejected') { D.fout.stand = true; tekenStand(); }
    if (klaar[1].status === 'rejected') { D.fout.programma = true; tekenProgramma(); }
    if (klaar.some(function (k) { return k.status === 'fulfilled'; })) {
        D.opgehaald = Date.now();
        OPSLAG.schrijf('rbc-opgehaald', D.opgehaald);
        tekenCacheInfo();
        if (metMelding) meld(t('bijgewerkt'));
    }
}
$('ververs').addEventListener('click', function () { verversAlles(true); });
window.addEventListener('online', function () { verversAlles(false); });
window.addEventListener('offline', function () { meld(t('offline')); });

/* ════════════════════════════════════════════════════════
   8. START
   Eerst uit de opslag tekenen, daarna pas het net op. Zo
   staat er meteen iets op het scherm, ook zonder bereik.
   ════════════════════════════════════════════════════════ */
(async function () {
    D.stand = OPSLAG.lees('rbc-stand', null);
    D.programma = OPSLAG.lees('rbc-programma', null);
    D.opgehaald = OPSLAG.lees('rbc-opgehaald', null);
    const bewaardeSquad = OPSLAG.lees('rbc-squad', null);
    if (bewaardeSquad) {
        D.squad = bewaardeSquad.squad; D.bijgewerkt = bewaardeSquad.bijgewerkt;
        D.volgende = bewaardeSquad.volgende;
    }

    let start = 'wedstrijd';
    try { const s = localStorage.getItem('rbc-scherm'); if (s) start = s; } catch (e) {}
    if (!$('s-' + start)) start = 'wedstrijd';

    zetTaal(TAAL);
    toon(start);

    try {
        const m = await (await fetch('data.json?v=' + Date.now())).json();
        D.squad = (m.squad || []).slice().sort(function (a, b) { return a.number - b.number; });
        D.bijgewerkt = m.squad_bijgewerkt || null;
        D.volgende = m.match || null;
        OPSLAG.schrijf('rbc-squad', { squad: D.squad, bijgewerkt: D.bijgewerkt, volgende: D.volgende });
        if (W && !W.tegen && D.volgende) { W.tegen = tegenstanderVan(D.volgende); bewaar(); }
        tekenSpelers(); tekenBord();
    } catch (e) { /* dan blijft wat er in de opslag stond */ }

    if (!navigator.onLine) meld(t('offline'));
    verversAlles(false);
})();

/* De app komt uit de cache, dus een nieuwe versie zou pas de
   volgende keer verschijnen. Zodra er een klaarstaat: melden en
   op één tik overschakelen. */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
                const nieuw = reg.installing;
                if (!nieuw) return;
                nieuw.addEventListener('statechange', function () {
                    if (nieuw.state === 'installed' && navigator.serviceWorker.controller) {
                        meld(t('nieuwe_versie'), true);
                        $('melding').style.cursor = 'pointer';
                        $('melding').addEventListener('click', function () { location.reload(); });
                    }
                });
            });
        }).catch(function () {});
    });
}
</script>
</body>
</html>
