<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a13">
<meta name="description" content="RBC Roosendaal voor op de tribune: tik een rugnummer in en zie wie het is. Plus de selectie, de stand en het clubnieuws. Werkt zonder bereik.">
<title>RBC Roosendaal</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/rbc-klein.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   RBC ROOSENDAAL — het wedstrijdprogramma
   Eén vraag staat bovenaan: wie is nummer …? Daarna de selectie,
   de stand en het nieuws, zoals in een programmaboekje.
   ══════════════════════════════════════════════════════════════ */
:root{
    --oranje:#ff6a13; --oranje-d:#d94f06; --oranje-zacht:#fff0e6;
    --papier:#faf6f1; --vlak:#ffffff; --inkt:#16120f; --dim:#6f655c;
    --lijn:#e7ded4; --groen:#1f8a4c; --rood:#c8352b; --grijs:#a79c91;
    --kop:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    --tekst:Barlow, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --r:14px;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --papier:#12100e; --vlak:#1c1916; --inkt:#f4ece1; --dim:#a39888;
        --lijn:#2e2925; --oranje-zacht:#2a1a10; --groen:#3fbf74; --rood:#ef6a5e; --grijs:#6f655c;
    }
}
:root[data-theme="dark"]{
    --papier:#12100e; --vlak:#1c1916; --inkt:#f4ece1; --dim:#a39888;
    --lijn:#2e2925; --oranje-zacht:#2a1a10; --groen:#3fbf74; --rood:#ef6a5e; --grijs:#6f655c;
}

*{ box-sizing:border-box; margin:0; padding:0 }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:64px }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto } *{ transition:none!important; animation:none!important } }
body{ background:var(--papier); color:var(--inkt); font:500 16px/1.5 var(--tekst);
      -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation }
a{ color:inherit }
img{ display:block; max-width:100% }
.wrap{ max-width:1080px; margin:0 auto; padding:0 16px }

/* ── balk ─────────────────────────────────────────────────── */
.balk{ position:sticky; top:0; z-index:20; background:var(--oranje); color:#fff;
       padding-top:env(safe-area-inset-top) }
.balk .wrap{ display:flex; align-items:center; gap:12px; height:56px }
.merk{ display:flex; align-items:center; gap:10px; text-decoration:none; flex:none }
.merk img{ width:34px; height:34px; object-fit:contain }
.merk b{ font:900 22px/1 var(--kop); letter-spacing:.02em; text-transform:uppercase }
.balk nav{ margin-left:auto; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none }
.balk nav::-webkit-scrollbar{ display:none }
.balk nav a{ font:800 15px/1 var(--kop); text-transform:uppercase; letter-spacing:.06em;
             text-decoration:none; padding:10px 10px; border-radius:8px; white-space:nowrap }
.balk nav a:hover{ background:rgba(0,0,0,.12) }
@media (max-width:520px){ .merk b{ display:none } .balk nav a{ padding:10px 8px; font-size:14px } }

/* ── koppen ───────────────────────────────────────────────── */
section{ padding:40px 0 8px }
.kop{ display:flex; align-items:baseline; gap:12px; margin-bottom:18px }
.kop h2{ font:900 clamp(34px,7vw,52px)/.9 var(--kop); text-transform:uppercase; letter-spacing:.01em }
.kop h2 em{ font-style:normal; color:var(--oranje) }
.kop small{ color:var(--dim); font-size:14px; margin-left:auto; text-align:right }

/* ── wie is nummer ────────────────────────────────────────── */
.wie{ background:var(--oranje); color:#fff; padding:28px 0 36px; position:relative; overflow:hidden }
.wie::before{ content:""; position:absolute; inset:0; opacity:.10; pointer-events:none;
    background:repeating-linear-gradient(90deg,#fff 0 36px,transparent 36px 108px) }
.wie .wrap{ position:relative; display:grid; gap:24px; grid-template-columns:1fr; align-items:start }
@media (min-width:860px){ .wie .wrap{ grid-template-columns:1.1fr .9fr; gap:48px; align-items:center } }
.wie h1{ font:900 clamp(44px,11vw,88px)/.85 var(--kop); text-transform:uppercase; letter-spacing:.005em }
.wie h1 span{ color:var(--inkt-op-oranje,#1b0f06) }
.wie .uitleg{ font-weight:600; opacity:.92; margin-top:8px; max-width:34ch }

.onthul{ display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:center; margin-top:22px }
.shirt{ width:150px; aspect-ratio:1/1.05; position:relative; flex:none }
.shirt svg{ width:100%; height:100%; display:block; overflow:visible }
.shirt .romp{ fill:#fff }
.shirt .rand{ fill:var(--inkt-op-oranje,#1b0f06) }
.shirt .nr{ font:900 88px/1 var(--kop); fill:var(--oranje) }
.shirt .rugnaam{ font:800 20px/1 var(--kop); fill:#1b0f06; letter-spacing:.06em }
.shirt.leeg .nr{ fill:#e8d9cc }
.shirt.mis .romp{ fill:rgba(255,255,255,.35) }
.shirt.mis .nr{ fill:#fff }
.shirt.pop{ animation:pop .28s cubic-bezier(.3,1.6,.5,1) }
@keyframes pop{ from{ transform:scale(.9) rotate(-3deg) } to{ transform:none } }

.antwoord{ min-height:150px }
.antwoord .naam{ font:900 clamp(34px,6.5vw,52px)/.92 var(--kop); text-transform:uppercase }
.antwoord .rol{ font-weight:700; margin-top:6px }
.antwoord .extra{ font-size:14px; font-weight:600; opacity:.9; margin-top:6px; display:flex; flex-wrap:wrap; gap:4px 12px }
.antwoord .hint{ font:800 22px/1.15 var(--kop); text-transform:uppercase; opacity:.9 }
.antwoord .foto{ width:64px; height:84px; border-radius:10px; object-fit:cover; margin-bottom:10px;
                 box-shadow:0 0 0 3px #fff }

.toetsen{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px; width:100%; justify-self:center }
@media (min-width:860px){ .toetsen{ justify-self:end } }
.toets{ height:64px; border-radius:var(--r); background:#fff; color:var(--oranje-d);
        font:900 34px/1 var(--kop); box-shadow:0 3px 0 rgba(0,0,0,.18);
        transition:transform .06s, box-shadow .06s }
.toets:active{ transform:translateY(3px); box-shadow:none }
.toets.stil{ background:rgba(255,255,255,.18); color:#fff; font-size:22px; box-shadow:none }
.toets:focus-visible{ outline:3px solid var(--inkt); outline-offset:2px }

/* ── selectie ─────────────────────────────────────────────── */
.linie{ margin-bottom:22px }
.linie h3{ font:800 15px/1 var(--kop); text-transform:uppercase; letter-spacing:.12em; color:var(--dim);
           margin-bottom:10px; display:flex; align-items:center; gap:10px }
.linie h3::after{ content:""; flex:1; height:1px; background:var(--lijn) }
.spelers{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr)); gap:10px }
.speler{ display:flex; align-items:center; gap:12px; background:var(--vlak); border:1px solid var(--lijn);
         border-radius:var(--r); padding:10px 12px; text-align:left; transition:border-color .15s, transform .15s }
.speler:hover{ border-color:var(--oranje); transform:translateY(-2px) }
.speler:focus-visible{ outline:3px solid var(--oranje); outline-offset:2px }
.speler .n{ font:900 30px/1 var(--kop); color:var(--oranje); min-width:34px; text-align:center }
.speler .t{ min-width:0 }
.speler b{ display:block; font-weight:700; font-size:15px; line-height:1.2; overflow-wrap:anywhere }
@media (min-width:700px){ .spelers{ grid-template-columns:repeat(auto-fill,minmax(220px,1fr)) } }
@media (max-width:420px){ .speler{ padding:10px; gap:8px } .speler .n{ font-size:26px; min-width:28px } .speler b{ font-size:14px } }
.speler span{ display:block; font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }

/* ── competitie ───────────────────────────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px }
@media (max-width:560px){ .stats{ grid-template-columns:repeat(2,1fr) } }
.stat{ background:var(--vlak); border:1px solid var(--lijn); border-radius:var(--r); padding:14px 16px }
.stat .w{ font:900 44px/1 var(--kop); font-variant-numeric:tabular-nums }
.stat .w.o{ color:var(--oranje) }
.stat .l{ font-size:13px; color:var(--dim); font-weight:600; margin-top:4px }

.vorm{ background:var(--vlak); border:1px solid var(--lijn); border-radius:var(--r); padding:14px 16px; margin-bottom:26px }
.vorm h3{ font:800 15px/1 var(--kop); text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin-bottom:10px }
.duels{ display:grid; gap:6px }
.duel{ display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; font-size:15px }
.chip{ width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
       font:900 16px/1 var(--kop); color:#fff }
.chip.w{ background:var(--groen) } .chip.g{ background:var(--grijs) } .chip.v{ background:var(--rood) }
.duel .s{ font:800 20px/1 var(--kop); font-variant-numeric:tabular-nums }
.duel .d{ color:var(--dim); font-size:13px }

.twee{ display:grid; gap:26px; grid-template-columns:1fr }
@media (min-width:860px){ .twee{ grid-template-columns:1.25fr 1fr } }

.tabel{ width:100%; border-collapse:collapse; background:var(--vlak); border:1px solid var(--lijn);
        border-radius:var(--r); overflow:hidden; font-variant-numeric:tabular-nums }
.tabel th{ font:800 13px/1 var(--kop); text-transform:uppercase; letter-spacing:.1em; color:var(--dim);
           text-align:right; padding:12px 8px; border-bottom:1px solid var(--lijn) }
.tabel th:nth-child(2){ text-align:left }
.tabel td{ padding:9px 8px; text-align:right; border-bottom:1px solid var(--lijn); font-size:15px }
.tabel tr:last-child td{ border-bottom:0 }
.tabel td:first-child{ width:36px; text-align:center; font-weight:700; color:var(--dim); position:relative }
.tabel td:nth-child(2){ text-align:left; font-weight:600 }
.tabel td.p{ font-weight:800 }
.tabel tr.zone-p td:first-child{ box-shadow:inset 4px 0 var(--groen) }
.tabel tr.zone-n td:first-child{ box-shadow:inset 4px 0 #3a7bd5 }
.tabel tr.zone-d td:first-child{ box-shadow:inset 4px 0 var(--rood) }
.tabel tr.rbc td{ background:var(--oranje-zacht); font-weight:800 }
.tabel tr.rbc td:nth-child(2){ color:var(--oranje-d) }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabel tr.rbc td:nth-child(2){ color:var(--oranje) } }
.tabel .smal{ }
@media (max-width:480px){ .tabel .breed{ display:none } }
.legenda{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--dim); margin-top:10px }
.legenda i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px }

.ronde{ background:var(--vlak); border:1px solid var(--lijn); border-radius:var(--r); padding:6px 16px; margin-bottom:14px }
.ronde h3{ font:800 15px/1 var(--kop); text-transform:uppercase; letter-spacing:.12em; color:var(--dim); padding:12px 0 6px }
.wed{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; padding:9px 0;
      border-top:1px solid var(--lijn); font-size:14px }
.wed:first-of-type{ border-top:0 }
.wed .h{ text-align:right } .wed .a{ text-align:left }
.wed .u{ font:800 18px/1 var(--kop); min-width:52px; text-align:center; font-variant-numeric:tabular-nums }
.wed.rbc{ font-weight:800 }
.wed .dag{ grid-column:1/-1; font-size:12px; color:var(--dim); margin-bottom:-6px; text-align:center }

/* ── nieuws ───────────────────────────────────────────────── */
.berichten{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)) }
.bericht{ display:flex; flex-direction:column; background:var(--vlak); border:1px solid var(--lijn); border-radius:var(--r);
          padding:16px 18px; text-decoration:none; transition:border-color .15s, transform .15s }
.bericht:hover{ border-color:var(--oranje); transform:translateY(-2px) }
.bericht time{ font:800 14px/1 var(--kop); color:var(--oranje); letter-spacing:.08em; text-transform:uppercase }
.bericht h3{ font:800 23px/1.05 var(--kop); text-transform:uppercase; margin:8px 0 8px }
.bericht p{ color:var(--dim); font-size:14px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden }
.bericht .verder{ margin-top:auto; padding-top:10px; font-weight:700; font-size:14px; color:var(--oranje-d) }
.bericht.eerste{ grid-column:1/-1; background:var(--inkt); color:var(--papier); border-color:var(--inkt) }
.bericht.eerste h3{ font-size:clamp(28px,5vw,40px) }
.bericht.eerste p{ color:inherit; opacity:.75; -webkit-line-clamp:4 }
.bericht.eerste .verder{ color:var(--oranje) }

/* ── voet ─────────────────────────────────────────────────── */
footer{ margin-top:48px; padding:28px 0 calc(28px + env(safe-area-inset-bottom)); border-top:1px solid var(--lijn);
        color:var(--dim); font-size:13px }
footer .wrap{ display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center }
footer b{ font:900 20px/1 var(--kop); color:var(--inkt); text-transform:uppercase }
footer .thema{ margin-left:auto; border:1px solid var(--lijn); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600 }
.leeg{ color:var(--dim); font-size:14px; padding:12px 0 }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0) }
</style>
</head>
<body>

<header class="balk">
    <div class="wrap">
        <a class="merk" href="#wie"><img src="rbc-klein.png" alt=""><b>RBC Roosendaal</b></a>
        <nav aria-label="Onderdelen">
            <a href="#wie">Wie is</a>
            <a href="#selectie">Selectie</a>
            <a href="#stand">Stand</a>
            <a href="#nieuws">Nieuws</a>
        </nav>
    </div>
</header>

<main>
<!-- ═══ wie is nummer ═══════════════════════════════════════ -->
<section class="wie" id="wie" aria-labelledby="wie-kop">
    <div class="wrap">
        <div>
            <h1 id="wie-kop">Wie is<br><span>nummer</span>&nbsp;…?</h1>
            <p class="uitleg">Tik het rugnummer in dat je op het veld ziet.</p>
            <div class="onthul">
                <div class="shirt leeg" id="shirt">
                    <svg viewBox="0 0 200 210" aria-hidden="true">
                        <path class="romp" d="M62 8 Q100 26 138 8 L192 36 L176 84 L154 76 L154 204 L46 204 L46 76 L24 84 L8 36 Z"/>
                        <path class="rand" d="M62 8 Q100 26 138 8 L133 5 Q100 20 67 5 Z"/>
                        <path id="boog" d="M56 70 Q100 50 144 70" fill="none"/>
                        <text class="rugnaam" id="rugnaam" text-anchor="middle"><textPath href="#boog" startOffset="50%"></textPath></text>
                        <text class="nr" id="rugnr" x="100" y="160" text-anchor="middle">?</text>
                    </svg>
                </div>
                <div class="antwoord" id="antwoord" aria-live="polite"></div>
            </div>
        </div>
        <div class="toetsen" id="toetsen" role="group" aria-label="Rugnummer intikken"></div>
    </div>
</section>

<!-- ═══ selectie ════════════════════════════════════════════ -->
<section id="selectie" aria-labelledby="sel-kop">
    <div class="wrap">
        <div class="kop"><h2 id="sel-kop">De <em>selectie</em></h2><small id="sel-meta"></small></div>
        <div id="linies"><p class="leeg">Selectie laden…</p></div>
    </div>
</section>

<!-- ═══ competitie ══════════════════════════════════════════ -->
<section id="stand" aria-labelledby="stand-kop">
    <div class="wrap">
        <div class="kop"><h2 id="stand-kop">Waar <em>staan</em> we</h2><small id="comp-meta"></small></div>
        <div class="stats" id="stats"></div>
        <div class="vorm" id="vorm" hidden></div>
        <div class="twee">
            <div>
                <div id="tabel"><p class="leeg">Stand laden…</p></div>
                <div class="legenda" id="legenda"></div>
            </div>
            <div id="rondes"></div>
        </div>
    </div>
</section>

<!-- ═══ nieuws ══════════════════════════════════════════════ -->
<section id="nieuws" aria-labelledby="nieuws-kop">
    <div class="wrap">
        <div class="kop"><h2 id="nieuws-kop">Van de <em>club</em></h2><small>rbcvoetbal.nl</small></div>
        <div class="berichten" id="berichten"><p class="leeg">Nieuws laden…</p></div>
    </div>
</section>
</main>

<footer>
    <div class="wrap">
        <b>RBC</b>
        <span id="bijgewerkt"></span>
        <span>Stand: <a href="https://www.hollandsevelden.nl/" rel="noopener">Hollandse Velden</a> · Selectie: Transfermarkt</span>
        <button class="thema" id="thema" type="button">Thema: auto</button>
    </div>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const isRBC = n => /^rbc\b/i.test(String(n || '').trim());

/* Opslag kan in een privévenster of preview gewoon weigeren. */
const OPSLAG = {
    lees(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    schrijf(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const POSITIE = {
    'Goalkeeper':        ['Keeper', 'K'],
    'Defender':          ['Verdediger', 'V'],
    'Centre-Back':       ['Centrale verdediger', 'V'],
    'Left-Back':         ['Linksback', 'V'],
    'Right-Back':        ['Rechtsback', 'V'],
    'Midfielder':        ['Middenvelder', 'M'],
    'Central Midfield':  ['Centrale middenvelder', 'M'],
    'Attacking Midfield':['Aanvallende middenvelder', 'M'],
    'Left Winger':       ['Linksbuiten', 'A'],
    'Right Winger':      ['Rechtsbuiten', 'A'],
    'Striker':           ['Spits', 'A'],
    'Centre-Forward':    ['Spits', 'A']
};
const LINIES = [['K', 'Keepers'], ['V', 'Verdedigers'], ['M', 'Middenvelders'], ['A', 'Aanvallers'], ['?', 'Overig']];
const LAND = {
    'Netherlands': ['🇳🇱', 'Nederland'], 'Belgium': ['🇧🇪', 'België'], 'Morocco': ['🇲🇦', 'Marokko'],
    'Ghana': ['🇬🇭', 'Ghana'], 'Curacao': ['🇨🇼', 'Curaçao'], 'Cape Verde': ['🇨🇻', 'Kaapverdië']
};
const positie = p => (POSITIE[p.positie] || [p.positie || 'Speler'])[0];
const linie   = p => (POSITIE[p.positie] || [null, '?'])[1];

/* Achternaam zoals op een rug: tussenvoegsels horen erbij. */
function rugNaam(naam) {
    const d = String(naam || '').trim().split(/\s+/);
    if (d.length < 2) return d[0] || '';
    const i = d.findIndex((w, k) => k > 0 && /^(van|de|der|den|da|dos|del|ter|ten)$/.test(w));
    return (i > 0 ? d.slice(i) : d.slice(-1)).join(' ')
        .normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
}

let SQUAD = [];
const vind = nr => SQUAD.find(p => String(p.number) === String(+nr));
const START = (/^#nr-(\d{1,2})$/.exec(location.hash) || [])[1] || '';

/* ═══ wie is nummer ═════════════════════════════════════════ */
let getikt = '';

function toon(nr, animeer) {
    getikt = nr;
    const p = nr ? vind(nr) : null;
    const shirt = $('shirt'), uit = $('antwoord');
    $('rugnr').textContent = nr || '?';
    shirt.classList.toggle('leeg', !nr);
    shirt.classList.toggle('mis', !!nr && !p);

    const tp = $('rugnaam').querySelector('textPath');
    tp.textContent = p ? rugNaam(p.name) : '';
    /* Lange namen kleiner, zodat ze tussen de mouwen blijven. */
    let fs = 20; $('rugnaam').style.fontSize = fs + 'px';
    try {
        const max = $('boog').getTotalLength() * 1.05, nu = tp.getComputedTextLength();
        if (nu > max) $('rugnaam').style.fontSize = Math.max(10, fs * max / nu) + 'px';
    } catch (e) {}

    if (animeer && p) { shirt.classList.remove('pop'); void shirt.offsetWidth; shirt.classList.add('pop'); }

    if (!nr) {
        uit.innerHTML = '<p class="hint">Tik een nummer<br>hieronder in</p>';
    } else if (!p) {
        uit.innerHTML = '<p class="hint">Geen speler met<br>nummer ' + esc(nr) + '</p>';
    } else {
        const landen = (p.nationaliteiten || []).map(l => LAND[l] ? LAND[l].join(' ') : l);
        const extra = [];
        if (p.leeftijd) extra.push(p.leeftijd + ' jaar');
        if (landen.length) extra.push(landen.join(' · '));
        if (p.vorige_club) extra.push('Kwam van ' + p.vorige_club);
        uit.innerHTML =
            (p.photo ? '<img class="foto" src="' + esc(p.photo) + '" alt="">' : '') +
            '<div class="naam">' + esc(p.name) + '</div>' +
            '<div class="rol">#' + esc(p.number) + ' · ' + esc(positie(p)) + '</div>' +
            (extra.length ? '<div class="extra">' + extra.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '');
    }
    /* Het nummer in de link, zodat je "wie is 14" kunt doorsturen. */
    if (SQUAD.length) {
        const hash = nr && p ? '#nr-' + p.number : '';
        if (location.hash !== hash && (hash || /^#nr-/.test(location.hash)))
            history.replaceState(null, '', hash || location.pathname);
    }
}

function tik(c) {
    if (c === 'wis') toon(getikt.slice(0, -1));
    else if (c === 'leeg') toon('');
    else toon(getikt.length < 2 ? (getikt === '0' ? c : getikt + c) : c, true);
}

(function toetsen() {
    const k = $('toetsen');
    ['1','2','3','4','5','6','7','8','9','leeg','0','wis'].forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'toets' + (c.length > 1 ? ' stil' : '');
        b.textContent = c === 'wis' ? '⌫' : c === 'leeg' ? 'C' : c;
        b.setAttribute('aria-label', c === 'wis' ? 'Laatste cijfer wissen' : c === 'leeg' ? 'Leegmaken' : c);
        b.addEventListener('click', () => tik(c));
        k.appendChild(b);
    });
})();

document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
    if (/^[0-9]$/.test(e.key)) { tik(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { tik('wis'); e.preventDefault(); }
    else if (e.key === 'Escape') tik('leeg');
});

/* ═══ selectie ══════════════════════════════════════════════ */
function tekenSelectie(D) {
    const per = {};
    SQUAD.slice().sort((a, b) => a.number - b.number).forEach(p => (per[linie(p)] = per[linie(p)] || []).push(p));
    $('linies').innerHTML = LINIES.filter(([k]) => per[k]).map(([k, titel]) =>
        '<div class="linie"><h3>' + titel + '</h3><div class="spelers">' +
        per[k].map(p =>
            '<button type="button" class="speler" data-nr="' + p.number + '">' +
                '<span class="n">' + p.number + '</span>' +
                '<span class="t"><b>' + esc(p.name) + '</b><span>' + esc(positie(p)) + '</span></span>' +
            '</button>').join('') +
        '</div></div>').join('');
    if (D.squad_bijgewerkt) $('sel-meta').textContent = SQUAD.length + ' spelers · ' + D.squad_bijgewerkt.split('-').reverse().join('-');
}
$('linies').addEventListener('click', e => {
    const b = e.target.closest('.speler');
    if (!b) return;
    toon(b.dataset.nr, true);
    $('wie').scrollIntoView();
});

/* ═══ competitie ════════════════════════════════════════════ */
function zone(C, pos, n) {
    const z = C.zones || {};
    if (pos <= (z.promotie || 0)) return 'zone-p';
    if (pos <= (z.promotie || 0) + (z.nacompetitie || 0)) return 'zone-n';
    if (pos > n - (z.degradatie || 0)) return 'zone-d';
    return '';
}

function tekenCompetitie(C) {
    const stand = C.stand || [];
    const rbc = stand.find(r => isRBC(r.club));
    $('comp-meta').textContent = [C.competitie, C.seizoen, C.speelronde ? 'na ronde ' + C.speelronde : ''].filter(Boolean).join(' · ');

    if (rbc) {
        const [w, g, v] = String(rbc.wgv || '0-0-0').split('-');
        const ds = rbc.ds > 0 ? '+' + rbc.ds : String(rbc.ds);
        $('stats').innerHTML = [
            [rbc.pos + 'e', 'plek van ' + stand.length, true],
            [rbc.pnt, 'punten uit ' + rbc.wed],
            [w + '-' + g + '-' + v, 'winst · gelijk · verlies'],
            [ds, 'doelsaldo (' + rbc.dv + '–' + rbc.dt + ')']
        ].map(([a, b, o]) => '<div class="stat"><div class="w' + (o ? ' o' : '') + '">' + esc(a) + '</div><div class="l">' + esc(b) + '</div></div>').join('');

        const vorm = (rbc.vorm || []).slice().reverse();
        if (vorm.length) {
            $('vorm').hidden = false;
            $('vorm').innerHTML = '<h3>Laatste wedstrijden</h3><div class="duels">' + vorm.map(d => {
                /* "26-09-2026: RBC - VVSB: 3 - 1" */
                const m = /^(\d\d)-(\d\d)-\d{4}:\s*(.+?)\s+-\s+(.+?):\s*(\d+)\s*-\s*(\d+)/.exec(d.wat || '');
                if (!m) return '';
                const thuis = isRBC(m[3]);
                const tegen = thuis ? m[4] : m[3];
                return '<div class="duel"><span class="chip ' + esc(d.uitslag) + '">' + esc(String(d.uitslag).toUpperCase()) + '</span>' +
                    '<span>' + (thuis ? 'thuis tegen ' : 'uit bij ') + '<b>' + esc(tegen) + '</b> <span class="d">' + m[1] + '/' + m[2] + '</span></span>' +
                    '<span class="s">' + m[5] + '–' + m[6] + '</span></div>';
            }).join('') + '</div>';
        }
    }

    if (stand.length) {
        $('tabel').innerHTML = '<table class="tabel"><thead><tr><th>#</th><th>Club</th><th>Wed</th><th class="breed">W-G-V</th><th>DS</th><th>Pnt</th></tr></thead><tbody>' +
            stand.map(r => '<tr class="' + zone(C, r.pos, stand.length) + (isRBC(r.club) ? ' rbc' : '') + '">' +
                '<td>' + r.pos + '</td><td>' + esc(r.club) + '</td><td>' + r.wed + '</td>' +
                '<td class="breed">' + esc(r.wgv) + '</td><td>' + (r.ds > 0 ? '+' : '') + r.ds + '</td><td class="p">' + r.pnt + '</td></tr>').join('') +
            '</tbody></table>';
        $('legenda').innerHTML =
            '<span><i style="background:var(--groen)"></i>kampioen</span>' +
            '<span><i style="background:#3a7bd5"></i>nacompetitie</span>' +
            '<span><i style="background:var(--rood)"></i>degradatie</span>';
    } else {
        $('tabel').innerHTML = '<p class="leeg">Nog geen stand beschikbaar.</p>';
    }

    const blok = (titel, lijst, gespeeld) => {
        if (!lijst || !lijst.length) return '';
        let dag = '';
        return '<div class="ronde"><h3>' + titel + '</h3>' + lijst.map(w => {
            const kop = w.datum !== dag ? '<span class="dag">' + esc(dag = w.datum) + '</span>' : '';
            const mid = gespeeld ? w.thuis_doelpunten + ' – ' + w.uit_doelpunten : esc(w.tijd || 'vs');
            return '<div class="wed' + (isRBC(w.thuis) || isRBC(w.uit) ? ' rbc' : '') + '">' + kop +
                '<span class="h">' + esc(w.thuis) + '</span><span class="u">' + mid + '</span><span class="a">' + esc(w.uit) + '</span></div>';
        }).join('') + '</div>';
    };
    const recent = (C.uitslagen || []).slice(-9).reverse();
    $('rondes').innerHTML = blok('Nog te spelen', C.programma, false) + blok('Laatste uitslagen', recent, true);

    if (C.bijgewerkt) {
        const d = new Date(C.bijgewerkt);
        $('bijgewerkt').textContent = 'Stand bijgewerkt ' + d.toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    }

    const nieuws = C.nieuws || [];
    $('berichten').innerHTML = nieuws.length ? nieuws.slice(0, 7).map((n, i) =>
        '<a class="bericht' + (i === 0 ? ' eerste' : '') + '" href="' + esc(n.url) + '" rel="noopener" target="_blank">' +
            '<time>' + esc(n.datum) + '</time><h3>' + esc(n.titel) + '</h3>' +
            '<p>' + esc(n.tekst) + '</p><span class="verder">Lees verder →</span></a>').join('')
        : '<p class="leeg">Nog geen nieuws.</p>';
}

/* ═══ laden ═════════════════════════════════════════════════ */
const haal = u => fetch(u).then(r => { if (!r.ok) throw new Error(u); return r.json(); });

haal('data.json').then(D => {
    SQUAD = (D.squad || []).filter(p => p.number != null);
    tekenSelectie(D);
    toon(getikt || START, !!START);
}).catch(() => { $('linies').innerHTML = '<p class="leeg">De selectie kon niet geladen worden.</p>'; toon(''); });

/* Een link naar #stand of #nieuws: pas na het laden staat alles op zijn plek. */
const naarAnker = () => { const el = /^#[a-z]+$/.test(location.hash) && document.querySelector(location.hash); if (el) el.scrollIntoView(); };

haal('competitie.json').then(C => { tekenCompetitie(C); naarAnker(); }).catch(() => {
    $('tabel').innerHTML = '<p class="leeg">De stand kon niet geladen worden.</p>';
    $('berichten').innerHTML = '<p class="leeg">Het nieuws kon niet geladen worden.</p>';
});

toon('');

/* ═══ thema ═════════════════════════════════════════════════ */
const THEMAS = ['auto', 'light', 'dark'], NAAM = { auto: 'auto', light: 'licht', dark: 'donker' };
function zetThema(t) {
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('thema').textContent = 'Thema: ' + NAAM[t];
}
let thema = THEMAS.includes(OPSLAG.lees('rbc-thema')) ? OPSLAG.lees('rbc-thema') : 'auto';
zetThema(thema);
$('thema').addEventListener('click', () => {
    thema = THEMAS[(THEMAS.indexOf(thema) + 1) % THEMAS.length];
    OPSLAG.schrijf('rbc-thema', thema); zetThema(thema);
});

if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
