<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="description" content="Het bord van RBC Roosendaal. Houd de stand zelf bij, stuur hem door, en zoek elke speler op rugnummer. Werkt zonder bereik.">
<title>RBC Roosendaal — Het Bord</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ══════════════════════════════════════════════════════════════
   HET BORD
   Geen website met een scorebord erop: het scorebord ís de site.
   Alles wat verandert, klapt om — zoals op een echt vluchtbord.
   Twee knoppen onderaan, verder niets. De rest is bord.
   ══════════════════════════════════════════════════════════════ */

:root{
    --oranje:      #ff6a13;
    --oranje-diep: #d94f06;
    --been:        #f4ece1;   /* gebroken wit van de lamellen */
    --bord:        #14110f;
    --kast:        #0a0908;
    --lamel-b:     #2b2724;   /* bovenhelft */
    --lamel-o:     #232019;   /* onderhelft, iets donkerder */
    --naad:        rgba(0,0,0,.72);
    --dim:         #8b8178;
    --lijn:        rgba(244,236,225,.10);
    --klap:        110ms;     /* duur van één omslag */
    --schrift: ui-sans-serif, system-ui, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-reduced-motion: reduce){ :root{ --klap: 1ms } }

*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100%; overflow:hidden }
html{ background:var(--kast); -webkit-text-size-adjust:100% }
body{
    background:
        radial-gradient(120% 80% at 50% -10%, #23201d 0%, transparent 60%),
        radial-gradient(90% 60% at 50% 110%, #1d1a17 0%, transparent 55%),
        var(--kast);
    color:var(--been);
    font-family:var(--schrift);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation }
img{ display:block; max-width:100% }

/* ── de kast waar het bord in hangt ───────────────────────── */
.kamer{
    /* Op de telefoon schuift de browserbalk onderaan over de pagina
       heen. dvh houdt daar niet altijd rekening mee, svh wel, en
       --app-h (uit visualViewport) is het nauwkeurigst. Alle drie,
       in oplopende betrouwbaarheid. */
    height:100vh; height:100svh; height:var(--app-h, 100svh);
    display:flex; flex-direction:column;
    padding:max(10px, env(safe-area-inset-top)) 10px 0;
    max-width:1180px; margin:0 auto; width:100%;
}
.bord{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column;
    background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #1a1714, #100e0c);
    border:1px solid rgba(244,236,225,.09);
    border-radius:16px;
    box-shadow:
        0 0 0 1px rgba(0,0,0,.6),
        0 30px 70px -20px rgba(0,0,0,.9),
        inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    position:relative;
    min-height:0;
}
/* vier schroeven, zodat het bord een ding is en geen kaartje */
.bord::before,.bord::after{
    content:""; position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a443d, #16130f 70%);
    box-shadow:0 1px 0 rgba(255,255,255,.06); pointer-events:none; z-index:4;
}
.bord::before{ top:9px; left:9px } .bord::after{ top:9px; right:9px }

/* ── kop ──────────────────────────────────────────────────── */
.kop{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--lijn);
    background:linear-gradient(180deg, rgba(255,255,255,.035), transparent);
}
.lamp{
    width:9px; height:9px; border-radius:50%; flex:none;
    background:#3a332c; box-shadow:inset 0 0 3px rgba(0,0,0,.8);
}
.lamp.aan{ background:var(--oranje); box-shadow:0 0 10px 1px rgba(255,106,19,.8); animation:pols 1.6s infinite }
@keyframes pols{ 50%{ opacity:.45 } }
.kop-tekst{ flex:1 1 auto; min-width:0 }
.kop-tekst b{
    display:block; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--oranje); font-weight:800;
}
.kop-tekst span{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    font-size:11px; line-height:1.45; letter-spacing:.13em; text-transform:uppercase;
    color:var(--dim); margin-top:3px;
}
.kop-knoppen{ display:flex; gap:6px; flex:none }
.pil{
    border:1px solid var(--lijn); border-radius:999px; padding:6px 11px;
    font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--dim);
    background:rgba(255,255,255,.03); line-height:1;
}
.pil:hover{ color:var(--been); border-color:rgba(244,236,225,.28) }
.pil[aria-pressed="true"]{ color:var(--bord); background:var(--oranje); border-color:var(--oranje) }

/* ── lamellen ─────────────────────────────────────────────── */
.regel{
    container-type:inline-size;
    display:grid; grid-template-columns:repeat(var(--n,6), 1fr);
    gap:var(--gat,2px); width:100%;
}
.flap{
    --cw: calc((100cqw - (var(--n) - 1) * var(--gat,2px)) / var(--n));
    --ch: calc(var(--cw) / .70);
    position:relative; aspect-ratio:.70; border-radius:3px;
    perspective:calc(var(--ch) * 3);
    background:var(--lamel-o);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.03);
    overflow:hidden;
}
.flap .h,.flap .k{
    position:absolute; left:0; right:0; height:50%; overflow:hidden;
    backface-visibility:hidden;
}
.flap .b,.flap .kb{ top:0; background:linear-gradient(180deg,#322d28,var(--lamel-b)); border-bottom:1px solid var(--naad) }
.flap .o,.flap .ko{ bottom:0; background:linear-gradient(180deg,var(--lamel-o),#1b1815) }
.flap .kb{ transform-origin:bottom; z-index:3 }
.flap .ko{ transform-origin:top; transform:rotateX(90deg); z-index:2 }
.flap i{
    display:block; height:var(--ch); line-height:var(--ch);
    font-size:calc(var(--ch) * .70); font-style:normal; font-weight:800;
    letter-spacing:-.02em; text-align:center; color:var(--been);
    font-variant-numeric:tabular-nums;
}
.flap .o i,.flap .ko i{ transform:translateY(-50%) }
.flap.draait .kb{ animation:valweg var(--klap) ease-in forwards }
.flap.draait .ko{ animation:valaan var(--klap) ease-out forwards }
@keyframes valweg{ 0%{transform:rotateX(0)} 50%,100%{transform:rotateX(-90deg)} }
@keyframes valaan{ 0%,50%{transform:rotateX(90deg)} 100%{transform:rotateX(0)} }
.regel.oranje .flap i{ color:var(--oranje) }
.regel.klein .flap i{ font-size:calc(var(--ch) * .62) }

/* ── scorebord ────────────────────────────────────────────── */
/* Een echt bord heeft meer dan één pagina: je veegt hem door.
   Geen derde knop dus — de twee onderaan blijven wat ze zijn. */
.bladen{
    flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain;
}
.bladen::-webkit-scrollbar{ display:none }
.scherm{
    flex:0 0 100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
    min-height:0; overflow-y:auto; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
}
.stippen{
    flex:none; display:flex; justify-content:center; gap:7px; padding:9px 0 11px;
    border-top:1px solid var(--lijn);
}
.stip{
    width:7px; height:7px; border-radius:50%; background:#3a332c; padding:0;
    transition:background .2s, width .2s; border:0;
}
.stip[aria-current="true"]{ background:var(--oranje); width:20px; border-radius:4px }
.zij{ padding:16px clamp(12px,3vw,26px) 24px }
.scherm[data-blad="opstelling"] .zij{ padding-top:12px }

/* ── ranglijst ─────────────────────────────────────────── */
.rang{ width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums }
.rang th{
    font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:#6c635b;
    font-weight:800; text-align:right; padding:0 4px 8px;
}
.rang th.l{ text-align:left }
.rang td{ padding:8px 4px; font-size:13px; text-align:right; border-top:1px solid rgba(244,236,225,.05) }
.rang td.club{ text-align:left; font-weight:700; letter-spacing:.02em;
               max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:99% }
.rang td.pos{ color:#6c635b; font-weight:800; width:26px; position:relative; padding-left:9px }
.rang td.pnt{ font-weight:900 }
.rang tr.rbc td{ background:rgba(255,106,19,.12); color:var(--been) }
.rang tr.rbc td.club{ color:var(--oranje) }
.rang tr.rbc td.pos{ color:var(--oranje) }
/* de zones komen uit de bron: promotie, nacompetitie, degradatie */
.rang td.pos::before{
    content:""; position:absolute; left:0; top:2px; bottom:2px; width:3px; border-radius:2px;
    background:transparent;
}
tr.zone-p td.pos::before{ background:#39c07a }
tr.zone-n td.pos::before{ background:var(--oranje) }
tr.zone-d td.pos::before{ background:#d1453c }
.vorm{ display:inline-flex; gap:2px; vertical-align:middle }
.vorm i{ width:7px; height:7px; border-radius:2px; background:#3a332c; display:block }
.vorm i.w{ background:#39c07a } .vorm i.g{ background:#8b8178 } .vorm i.v{ background:#d1453c }
.uitleg{
    display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px;
    font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:#6c635b; font-weight:700;
}
.uitleg span{ display:flex; align-items:center; gap:5px }
.uitleg b{ width:8px; height:8px; border-radius:2px; display:block }
.bron{ margin-top:14px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#5c554e }

/* ── programma ─────────────────────────────────────────── */
.duels{ list-style:none; display:flex; flex-direction:column; gap:1px }
.duels li{
    display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.022); font-size:13px;
}
.duels li.rbc{ background:rgba(255,106,19,.10) }
.duels .duel{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; letter-spacing:.02em }
.duels li.rbc .duel{ color:var(--oranje); font-weight:700 }
.duels .wanneer{ color:var(--dim); font-size:12px; font-weight:800; white-space:nowrap }
.duels .dag{
    padding:14px 2px 4px; font-size:9px; letter-spacing:.2em; text-transform:uppercase;
    color:#5c554e; font-weight:800; background:none;
}

/* ── wedstrijd: aftellen, heenweg, uitslagen ───────────── */
.aftrap{
    border:1px solid var(--lijn); border-radius:14px; padding:16px;
    background:linear-gradient(180deg, rgba(255,106,19,.10), rgba(255,255,255,.02));
    margin-bottom:12px;
}
.aftrap .wanneer-kop{
    font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--oranje); font-weight:800;
}
.aftrap .duel-groot{
    font-size:clamp(17px,4.6vw,23px); font-weight:900; letter-spacing:.01em;
    text-transform:uppercase; margin-top:8px; line-height:1.25;
}
.aftrap .onder{ font-size:11.5px; color:var(--dim); margin-top:6px; letter-spacing:.06em }
.klokjes{ display:flex; gap:7px; margin-top:14px }
.klokje{ flex:1 1 0; background:rgba(0,0,0,.32); border-radius:9px; padding:9px 4px; text-align:center }
.klokje b{ display:block; font-size:clamp(18px,5vw,25px); font-weight:900; font-variant-numeric:tabular-nums }
.klokje span{ display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:#6c635b;
              font-weight:800; margin-top:3px }
.nu-bezig{ color:var(--oranje); font-weight:900; letter-spacing:.1em; text-transform:uppercase; font-size:13px }
.doen{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px }
.doen a,.doen button{
    display:flex; align-items:center; justify-content:center; gap:7px; text-decoration:none;
    border:1px solid var(--lijn); border-radius:11px; padding:12px 8px; color:var(--been);
    font-size:11.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
    background:rgba(255,255,255,.03);
}
.doen a:hover,.doen button:hover{ border-color:rgba(255,106,19,.5); color:var(--oranje) }
.seizoen{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; border-radius:12px; overflow:hidden }
.seizoen div{ background:rgba(255,255,255,.03); padding:13px 10px; text-align:center }
.seizoen b{ display:block; font-size:23px; font-weight:900; font-variant-numeric:tabular-nums }
.seizoen span{ display:block; font-size:9px; letter-spacing:.16em; text-transform:uppercase;
               color:#6c635b; font-weight:800; margin-top:4px }
.schutters{ list-style:none; margin-top:12px; display:flex; flex-direction:column; gap:1px }
.schutters li{
    display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center;
    padding:9px 12px; border-radius:8px; background:rgba(255,255,255,.022); font-size:13px;
}
.schutters .nr{ font-weight:900; color:var(--oranje); font-variant-numeric:tabular-nums; min-width:18px }
.schutters .aantal{ font-weight:900; font-variant-numeric:tabular-nums }

/* ── opstelling ────────────────────────────────────────── */
.opst-kop{ display:flex; align-items:center; gap:6px; margin-bottom:10px }
.opst-kop .mini{ flex:none; padding:6px 10px }
.formaties{ display:flex; gap:5px; flex:1 1 auto; overflow-x:auto; scrollbar-width:none }
.formaties::-webkit-scrollbar{ display:none }
.form-knop{
    flex:none; border:1px solid var(--lijn); border-radius:999px; padding:6px 9px;
    font-size:10.5px; font-weight:800; letter-spacing:.08em; color:var(--dim);
    background:rgba(255,255,255,.03); font-variant-numeric:tabular-nums;
}
.form-knop[aria-pressed="true"]{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.vol-mini{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.vol-mini:hover{ color:#160e06; border-color:var(--oranje) }
/* Het hele elftal moet in één blik passen, keeper incluis: anders
   moet je scrollen om je eigen opstelling te zien. */
.veld-vak{ container-type:inline-size; display:flex; justify-content:center }
.veld{
    position:relative; aspect-ratio:.72;
    height:min(calc(var(--app-h, 100svh) - 292px), 134vw); width:auto; max-width:100%; border-radius:12px; overflow:hidden;
    background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 8.33%, transparent 8.33% 16.66%),
        linear-gradient(180deg, #1d3524, #16281b);
    border:1px solid rgba(244,236,225,.10);
}
/* lijnen: middencirkel, middenlijn, strafschopgebieden */
.veld::before{
    content:""; position:absolute; left:6px; right:6px; top:6px; bottom:6px;
    border:2px solid rgba(244,236,225,.18); border-radius:4px;
}
.veld::after{
    content:""; position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1;
    transform:translate(-50%,-50%); border:2px solid rgba(244,236,225,.18); border-radius:50%;
}
.middenlijn{ position:absolute; left:6px; right:6px; top:50%; height:2px; background:rgba(244,236,225,.18) }
.zestien{ position:absolute; left:22%; right:22%; height:12%; border:2px solid rgba(244,236,225,.18) }
.zestien.boven{ top:6px; border-top:0 } .zestien.onder{ bottom:6px; border-bottom:0 }
.plek{
    position:absolute; transform:translate(-50%,-50%); width:19%; max-width:88px;
    display:flex; flex-direction:column; align-items:center; gap:3px; padding:0;
}
.plek .romp{
    position:relative; width:100%; aspect-ratio:.9;
    background:repeating-linear-gradient(90deg, var(--oranje) 0 22%, #f7f3ee 22% 44%);
    clip-path:polygon(30% 0,70% 0,100% 14%,88% 32%,82% 26%,86% 100%,14% 100%,18% 26%,12% 32%,0 14%);
    display:grid; place-items:center;
}
.plek.leeg .romp{ background:rgba(244,236,225,.13) }
.plek .rugnr{
    font-size:clamp(11px, 4.6cqw, 20px); font-weight:900; color:#17130f; font-variant-numeric:tabular-nums;
    line-height:1; margin-top:12%;
}
.plek.leeg .rugnr{ color:rgba(244,236,225,.45); font-size:clamp(13px,5cqw,22px) }
.plek .wie{
    font-size:clamp(7.5px, 2.5cqw, 11px); font-weight:800; letter-spacing:.02em; text-transform:uppercase;
    color:var(--been); text-shadow:0 1px 3px rgba(0,0,0,.9); max-width:118%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.plek.leeg .wie{ color:#7e9a86 }
.plek:active .romp{ filter:brightness(1.25) }
.opst-onder{ display:flex; gap:8px; margin-top:14px }
.opst-onder .mini{ flex:1 1 0; text-align:center; padding:11px 6px; letter-spacing:.1em }

/* ── periodes ──────────────────────────────────────────── */
.periode-kop{ padding:2px 0 14px }
.periode-kop b{
    display:block; font-size:clamp(21px,6vw,30px); font-weight:900; letter-spacing:.01em;
    text-transform:uppercase; color:var(--oranje);
}
.periode-kop span{
    display:block; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dim); margin-top:5px;
}
.periode-kop em{
    display:block; font-style:normal; font-size:11.5px; color:#6c635b; margin-top:9px;
    letter-spacing:.03em; line-height:1.5;
}
.periode{ margin-bottom:22px }
.periode.later{ opacity:.5 }
.periode > h3{
    font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#6c635b;
    font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:8px;
}
.periode > h3 .nu{
    color:#160e06; background:var(--oranje); border-radius:999px; padding:3px 8px;
    font-size:9px; letter-spacing:.12em;
}
.stand{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:start;
    gap:clamp(8px,3vw,26px); padding:clamp(10px,3vw,26px) clamp(12px,3vw,26px) 6px;
}
.zijde{ display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0 }
.zijde .naam{ width:100%; max-width:210px }
.tel{
    width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:8px 4px 6px; border-radius:14px; border:1px solid transparent;
    transition:background .12s, border-color .12s;
}
.tel:active{ background:rgba(255,106,19,.10); border-color:rgba(255,106,19,.35) }
.tel .cijfer{ width:100%; max-width:min(26vw, 128px) }
/* Eén knop, groot genoeg om zonder bril te raken. Wie er scoorde
   vraagt hij daarna; hoe laat het ongeveer is rekent hij zelf uit. */
.doelpunt-vak{ padding:6px clamp(12px,3vw,26px) 2px }
.doelpunt{
    width:100%; display:flex; align-items:center; justify-content:center; gap:12px;
    padding:20px 16px; border-radius:16px; border:0;
    background:var(--oranje); color:#160e06;
    font-size:clamp(17px,4.8vw,21px); font-weight:900; letter-spacing:.1em; text-transform:uppercase;
    box-shadow:0 12px 30px -12px rgba(255,106,19,.9);
    min-height:68px; line-height:1;
}
.doelpunt:active{ background:var(--oranje-diep); transform:translateY(1px) }
.doelpunt .bal{ font-size:24px; line-height:1 }
.klok-uitleg{
    font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#6c635b;
    font-weight:800; text-align:center; margin-top:6px; min-height:12px;
}
.min{
    font-size:11px; letter-spacing:.12em; font-weight:700; color:#6c635b;
    padding:6px 15px; border-radius:999px; border:1px solid var(--lijn);
}
.min:hover{ color:var(--been) }
/* de klok hangt op de hoogte van de cijfers, de knopjes eronder */
.midden{ display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:clamp(44px,14vw,92px) }
.klok{ width:clamp(50px,14vw,88px); position:relative }
.klok::after{
    content:"'"; position:absolute; left:calc(100% + 3px); top:2px;
    font-size:clamp(13px,3.4vw,18px); font-weight:900; color:var(--oranje);
    opacity:0; transition:opacity .3s;
}
.klok.loopt-al::after{ opacity:.75 }
.klok-knoppen{ display:flex; gap:6px }
.rond{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--lijn);
    display:grid; place-items:center; font-size:13px; color:var(--dim);
    background:rgba(255,255,255,.03);
}
.rond:hover{ color:var(--been); border-color:rgba(244,236,225,.3) }
.rond.speelt{ color:var(--oranje); border-color:rgba(255,106,19,.5) }

/* ── log ──────────────────────────────────────────────────── */
.log{ padding:4px clamp(12px,3vw,26px) 22px }
.streep{
    display:flex; align-items:center; gap:10px; margin:18px 0 12px;
    font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#6c635b; font-weight:800;
}
.streep::after{ content:""; flex:1 1 auto; height:1px; background:var(--lijn) }
.doelpunten{ list-style:none; display:flex; flex-direction:column; gap:1px }
.doelpunten li{
    display:grid; grid-template-columns:minmax(52px,auto) 1fr auto; align-items:center; gap:12px;
    padding:11px 12px; border-radius:8px; background:rgba(255,255,255,.022);
    border-left:2px solid #3a332c;
}
.doelpunten li.eigen{ border-left-color:var(--oranje); background:rgba(255,106,19,.07) }
.doelpunten .m{
    font-size:13px; font-weight:800; color:var(--dim); font-variant-numeric:tabular-nums;
    text-align:left; padding:4px 0; border-bottom:1px dashed rgba(244,236,225,.22);
}
.doelpunten .m:active{ color:var(--oranje) }
.doelpunten li.eigen .m{ color:var(--oranje) }
.doelpunten .w{
    font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.doelpunten li:not(.eigen) .w{ color:var(--dim) }
.weg{ font-size:17px; color:#5c554e; padding:2px 8px; line-height:1 }
.weg:hover{ color:var(--oranje) }
.leeg{ font-size:13px; color:#6c635b; padding:14px 2px; letter-spacing:.03em }
.doelpunten li.leeg,.eerder li.leeg{ display:block; background:none; border-left:0; padding:14px 2px }
.eerder{ list-style:none; display:flex; flex-direction:column; gap:1px }
.eerder li{
    display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
    padding:11px 12px; border-radius:8px; background:rgba(255,255,255,.022);
    font-size:13px; letter-spacing:.04em;
}
.eerder .u{ font-weight:800; font-variant-numeric:tabular-nums; color:var(--been) }
.eerder .t{ color:var(--dim); text-transform:uppercase; font-size:12px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mini{
    font-size:10px; font-weight:800; letter-spacing:.14em; color:var(--dim);
    border:1px solid var(--lijn); border-radius:999px; padding:6px 12px; text-transform:uppercase;
}
.mini:hover{ color:var(--oranje); border-color:rgba(255,106,19,.45) }
.nieuw{ margin-top:16px; width:100%; justify-content:center; display:flex }

/* ── de twee knoppen ──────────────────────────────────────── */
.balk{
    flex:none; display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:12px 0 calc(12px + env(safe-area-inset-bottom));
    padding-bottom:calc(12px + env(safe-area-inset-bottom) + var(--balk-extra, 0px));
}
.groot{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:16px 10px; border-radius:14px; min-height:66px;
    font-size:clamp(13px,3.6vw,15px); font-weight:900; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid transparent; line-height:1;
}
.groot small{ font-size:10px; font-weight:700; letter-spacing:.1em; opacity:.62; text-transform:none }
.groot.vol{ background:var(--oranje); color:#160e06; box-shadow:0 10px 26px -12px rgba(255,106,19,.85) }
.groot.vol:active{ background:var(--oranje-diep) }
.groot.leeg{ background:rgba(255,255,255,.04); border-color:var(--lijn); color:var(--been) }
.groot.leeg:active{ background:rgba(255,255,255,.09) }

/* ── lagen (rugnummer + wie scoorde) ──────────────────────── */
.laag{
    position:fixed; left:0; top:0; right:0; z-index:40; display:none;
    height:100vh; height:100svh; height:var(--app-h, 100svh);
    background:rgba(8,7,6,.86); backdrop-filter:blur(14px);
    padding:max(10px, env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
}
.laag.aan{ display:flex; flex-direction:column; animation:opkomen .22s ease-out }
@keyframes opkomen{ from{ opacity:0; transform:translateY(12px) } }
.blad{
    flex:1 1 auto; display:flex; flex-direction:column; min-height:0; width:100%;
    max-width:560px; margin:0 auto;
    background:linear-gradient(180deg,#1a1714,#100e0c);
    border:1px solid rgba(244,236,225,.09); border-radius:16px; overflow:hidden;
}
.blad-kop{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-bottom:1px solid var(--lijn); flex:none;
}
.blad-kop b{ flex:1 1 auto; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--oranje) }
.sluit{ font-size:22px; line-height:1; color:var(--dim); padding:2px 6px }
.sluit:hover{ color:var(--been) }
.blad-lijf{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:14px }

/* ── het shirt ────────────────────────────────────────────── */
.shirt-vak{ display:flex; justify-content:center; padding:2px 0 8px }
.shirt{
    position:relative; width:min(58%, 218px); aspect-ratio:.86;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));
}
.doek{
    position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,
        var(--oranje) 0 11.5%, #f7f3ee 11.5% 23%);
    clip-path:polygon(
        32% 0%, 68% 0%,
        79% 3%, 100% 15%,
        90% 33%, 80% 27%,
        84% 100%, 16% 100%,
        20% 27%, 10% 33%,
        0% 15%, 21% 3%);
}
.kraag{
    position:absolute; left:50%; top:-2%; width:26%; height:11%;
    transform:translateX(-50%); border-radius:0 0 60% 60%;
    background:#14110f;
}
.rug-naam{ position:absolute; left:0; right:0; top:11%; height:26% }
.rug-naam text{ font-family:var(--schrift); font-weight:900; letter-spacing:.02em; fill:#17130f }
.rug-nr{
    position:absolute; left:0; right:0; top:32%; text-align:center;
    font-size:min(30cqw, 132px); font-weight:900; letter-spacing:-.04em; color:#17130f;
    line-height:1; font-variant-numeric:tabular-nums;
}
.shirt-vak{ container-type:inline-size }
.geen-shirt .doek{ background:repeating-linear-gradient(90deg,#2b2724 0 11.5%,#232019 11.5% 23%) }
.geen-shirt .rug-nr{ color:#4a443d }

/* ── spelerskaart ─────────────────────────────────────────── */
.kaart{ display:flex; gap:12px; align-items:center; padding:11px; border-radius:12px;
        background:rgba(255,255,255,.03); border:1px solid var(--lijn); margin-bottom:12px }
.kaart img{ width:58px; height:58px; border-radius:10px; object-fit:cover; flex:none;
            background:#221f1c; object-position:top center }
.kaart .wie{ min-width:0 }
.kaart .wie b{ display:block; font-size:16px; font-weight:900; letter-spacing:.02em;
               text-transform:uppercase; overflow:hidden; text-overflow:ellipsis }
.kaart .wie span{ display:block; font-size:12px; color:var(--dim); margin-top:3px; letter-spacing:.05em }
.feiten{ display:grid; grid-template-columns:1fr 1fr; gap:1px; border-radius:12px; overflow:hidden }
.feit{ background:rgba(255,255,255,.03); padding:12px 13px; min-height:60px }
.feit dt{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#6c635b; font-weight:800 }
.feit dd{ font-size:14px; font-weight:700; margin-top:5px; letter-spacing:.02em }
.feit.breed{ grid-column:1 / -1 }

/* ── toetsen ──────────────────────────────────────────────── */
.toetsen{
    flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--lijn); background:rgba(0,0,0,.25);
}
.toets{
    padding:13px 0; border-radius:11px; font-size:21px; font-weight:800;
    background:rgba(255,255,255,.05); border:1px solid var(--lijn);
    font-variant-numeric:tabular-nums;
}
.toets:active{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.toets.stil{ font-size:12px; letter-spacing:.12em; font-weight:800; color:var(--dim) }

/* ── wie scoorde ──────────────────────────────────────────── */
/* Zelf een minuut intikken: dezelfde toetsen als bij het rugnummer,
   want die kent iedereen dan al. */
.minuut-toon{
    display:flex; align-items:baseline; justify-content:center; gap:4px;
    padding:22px 0 6px;
}
.minuut-toon span{
    font-size:clamp(58px,20vw,96px); font-weight:900; line-height:1;
    color:var(--oranje); font-variant-numeric:tabular-nums; letter-spacing:-.03em;
}
.minuut-toon i{ font-style:normal; font-size:clamp(26px,8vw,42px); font-weight:900; color:var(--oranje) }
.minuut-hint{
    text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#6c635b; font-weight:800; min-height:14px;
}
.toets.klaar{ background:var(--oranje); color:#160e06; border-color:var(--oranje);
              font-size:13px; letter-spacing:.12em; font-weight:900 }

/* Wanneer ongeveer: grote, duidelijke keuzes. Niemand hoeft een
   minuut in te typen — "eerste helft" is voor het thuisfront net zo
   bruikbaar als "38e". */
.wanneer-keuze{ display:flex; flex-direction:column; gap:9px }
.wanneer-keuze button{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:18px 16px; border-radius:13px; border:1px solid var(--lijn);
    background:rgba(255,255,255,.045); min-height:64px;
}
.wanneer-keuze button:active{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.wanneer-keuze b{
    font-size:17px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; flex:1 1 auto;
}
.wanneer-keuze .hint{ font-size:11.5px; color:var(--dim); font-weight:700; letter-spacing:.05em }
.wanneer-keuze button:active .hint{ color:rgba(22,14,6,.7) }
.wanneer-keuze .nu-tip{ background:rgba(255,106,19,.14); border-color:rgba(255,106,19,.5) }

.rooster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:9px }
.speler{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:15px 6px;
    border-radius:12px; background:rgba(255,255,255,.045); border:1px solid var(--lijn);
    text-align:center; min-height:78px; justify-content:center;
}
.speler:active{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.speler b{ font-size:25px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1 }
.speler span{ font-size:11px; letter-spacing:.03em; text-transform:uppercase; opacity:.8;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100% }
/* de tegenpartij is geen speler maar wel een keuze: over de volle breedte */
.speler.breed{
    grid-column:1 / -1; flex-direction:row; gap:12px; min-height:66px; padding:14px;
    background:rgba(255,255,255,.06);
}
.speler.breed b{ font-size:22px }
.speler.breed span{ font-size:13px; font-weight:800; letter-spacing:.06em; opacity:1 }
.speler.breed .kant{
    font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
    display:block; margin-top:3px; font-weight:800;
}
.speler.breed:active .kant{ color:rgba(22,14,6,.75) }
.rooster-kop{
    font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; color:#6c635b;
    font-weight:800; grid-column:1 / -1; padding:8px 2px 0;
}

/* ── melding ──────────────────────────────────────────────── */
#melding{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px); z-index:60; opacity:0; pointer-events:none;
    background:#f4ece1; color:#14110f; border-radius:999px; padding:10px 18px;
    font-size:12.5px; font-weight:800; letter-spacing:.04em; white-space:nowrap;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.8); transition:opacity .2s, transform .2s;
}
#melding.aan{ opacity:1; transform:translate(-50%,0) }

/* ── groot scherm ─────────────────────────────────────────── */
@media (min-width:820px){
    .kamer{ padding:22px 22px 0; justify-content:center }
    .bord{ flex:0 1 auto; max-height:calc(var(--app-h, 100svh) - 44px) }
    .stand{ padding:34px 40px 16px; gap:40px }
    .zijde .naam{ max-width:260px }
    .tel .cijfer{ max-width:180px }
    .log{ padding:0 40px 30px; display:grid; grid-template-columns:1fr 1fr; gap:0 34px; align-items:start }
    /* Een ranglijst die over de volle breedte uitwaaiert leest slecht:
       de club staat dan meters van zijn eigen punten. */
    .zij{ padding:22px 40px 30px; max-width:760px; margin:0 auto; width:100% }
    .rang td{ padding:9px 6px }
    .log .kolom-a{ grid-column:1 } .log .kolom-b{ grid-column:2 }
    .balk{ max-width:520px; margin:0 auto }
    .groot{ min-height:74px }
}
@media (min-width:820px) and (max-height:760px){
    .stand{ padding:22px 40px 10px }
    .tel .cijfer{ max-width:140px }
}
</style>
</head>
<body>

<div class="kamer">
    <main class="bord">
        <div class="kop">
            <span class="lamp" id="lamp" aria-hidden="true"></span>
            <div class="kop-tekst">
                <b id="kop-titel">RBC ROOSENDAAL</b>
                <span id="kop-sub"></span>
            </div>
            <div class="kop-knoppen">
                <button class="pil" id="knop-geluid" aria-pressed="true" title="geluid">♪</button>
                <button class="pil" id="knop-taal">EN</button>
            </div>
        </div>

        <div class="bladen" id="bladen">
        <div class="scherm" data-blad="bord">
            <section class="stand">
                <div class="zijde">
                    <div class="regel naam" id="naam-rbc" style="--n:3"></div>
                    <button class="tel" id="tel-rbc" aria-label="doelpunt RBC">
                        <span class="regel cijfer oranje" id="score-rbc" style="--n:1"></span>
                    </button>
                    <button class="min" id="min-rbc">−1</button>
                </div>

                <div class="midden">
                    <div class="regel klok klein" id="klok" style="--n:2"></div>
                    <p class="klok-uitleg" id="klok-uitleg"></p>
                </div>

                <div class="zijde">
                    <div class="regel naam" id="naam-tegen" style="--n:3"></div>
                    <button class="tel" id="tel-tegen" aria-label="doelpunt tegenpartij">
                        <span class="regel cijfer" id="score-tegen" style="--n:1"></span>
                    </button>
                    <button class="min" id="min-tegen">−1</button>
                </div>
            </section>
            <div class="doelpunt-vak">
                <button class="doelpunt" id="knop-doelpunt">
                    <span class="bal">⚽</span>
                    <span id="lab-doelpunt">er is gescoord</span>
                </button>
            </div>

            <section class="log">
                <div class="kolom-a">
                    <h2 class="streep" id="kop-verloop">verloop</h2>
                    <ul class="doelpunten" id="verloop"></ul>
                </div>
                <div class="kolom-b">
                    <h2 class="streep" id="kop-eerder">eerder</h2>
                    <ul class="eerder" id="eerder"></ul>
                    <div class="nieuw"><button class="mini" id="knop-nieuw">nieuwe wedstrijd</button></div>
                </div>
            </section>
        </div>

        <div class="scherm" data-blad="wedstrijd">
            <section class="zij">
                <div class="aftrap" id="aftrap"></div>
                <div class="doen" id="doen"></div>
                <h2 class="streep" id="kop-uitslagen">uitslagen</h2>
                <ul class="duels" id="uitslagen-uit"></ul>
                <h2 class="streep" id="kop-seizoen">mijn seizoen</h2>
                <div id="seizoen-uit"></div>
            </section>
        </div>

        <div class="scherm" data-blad="opstelling">
            <section class="zij">
                <div class="opst-kop">
                    <div class="formaties" id="formaties"></div>
                    <button class="mini" id="knop-elftal">elftal</button>
                </div>
                <div class="veld-vak"><div class="veld" id="veld"></div></div>
                <div class="opst-onder">
                    <button class="mini" id="knop-opst-leeg">leegmaken</button>
                    <button class="mini vol-mini" id="knop-opst-deel">opstelling sturen</button>
                </div>
            </section>
        </div>

        <div class="scherm" data-blad="tabel">
            <section class="zij">
                <h2 class="streep" id="kop-tabel">stand</h2>
                <div id="tabel-uit"><p class="leeg">…</p></div>
                <h2 class="streep" id="kop-programma">programma</h2>
                <ul class="duels" id="programma-uit"></ul>
            </section>
        </div>

        <div class="scherm" data-blad="periodes">
            <section class="zij">
                <div class="periode-kop" id="periode-kop"></div>
                <div id="periodes-uit"><p class="leeg">…</p></div>
            </section>
        </div>
        </div>

        <div class="stippen" id="stippen"></div>
    </main>

    <nav class="balk">
        <button class="groot vol" id="knop-stuur">
            <span id="lab-stuur">stuur stand</span>
            <small id="sub-stuur">als bord‑plaatje</small>
        </button>
        <button class="groot leeg" id="knop-nummer">
            <span id="lab-nummer">rugnummer</span>
            <small id="sub-nummer">wie is nummer …</small>
        </button>
    </nav>
</div>

<!-- ═══ laag: rugnummer ═══════════════════════════════════ -->
<div class="laag" id="laag-nummer" role="dialog" aria-modal="true">
    <div class="blad">
        <div class="blad-kop">
            <b id="kop-nummer">wie is nummer</b>
            <button class="sluit" data-sluit="laag-nummer" aria-label="sluiten">×</button>
        </div>
        <div class="blad-lijf">
            <div class="shirt-vak">
                <div class="shirt" id="shirt">
                    <div class="doek"></div>
                    <div class="kraag"></div>
                    <svg class="rug-naam" viewBox="0 0 300 88" aria-hidden="true">
                        <path id="boog" d="M56,76 Q150,16 244,76" fill="none"></path>
                        <text id="boog-tekst" text-anchor="middle" font-size="30">
                            <textPath href="#boog" startOffset="50%"></textPath>
                        </text>
                    </svg>
                    <div class="rug-nr" id="rug-nr">—</div>
                </div>
            </div>
            <div id="speler-uit"></div>
        </div>
        <div class="toetsen" id="toetsen"></div>
    </div>
</div>

<!-- ═══ laag: wie scoorde ═════════════════════════════════ -->
<div class="laag" id="laag-scorer" role="dialog" aria-modal="true">
    <div class="blad">
        <div class="blad-kop">
            <b id="kop-scorer">wie scoorde</b>
            <button class="sluit" data-sluit="laag-scorer" aria-label="sluiten">×</button>
        </div>
        <div class="blad-lijf">
            <div class="rooster" id="scorer-rooster"></div>
        </div>
        <div class="toetsen" style="grid-template-columns:1fr">
            <button class="toets stil" id="scorer-onbekend">onbekend — sla over</button>
        </div>
    </div>
</div>

<!-- ═══ laag: wanneer ongeveer ════════════════════════════ -->
<div class="laag" id="laag-wanneer" role="dialog" aria-modal="true">
    <div class="blad">
        <div class="blad-kop">
            <b id="kop-wanneer">wanneer ongeveer?</b>
            <button class="sluit" data-sluit="laag-wanneer" aria-label="sluiten">×</button>
        </div>
        <div class="blad-lijf">
            <div class="wanneer-keuze" id="wanneer-keuze"></div>
        </div>
    </div>
</div>

<!-- ═══ laag: zelf de minuut kiezen ═══════════════════════ -->
<div class="laag" id="laag-minuut" role="dialog" aria-modal="true">
    <div class="blad">
        <div class="blad-kop">
            <b id="kop-minuut">welke minuut?</b>
            <button class="sluit" data-sluit="laag-minuut" aria-label="sluiten">×</button>
        </div>
        <div class="blad-lijf">
            <div class="minuut-toon"><span id="minuut-cijfer">—</span><i>'</i></div>
            <p class="minuut-hint" id="minuut-hint"></p>
        </div>
        <div class="toetsen" id="minuut-toetsen"></div>
    </div>
</div>

<div id="melding" role="status" aria-live="polite"></div>

<!-- Reservekopie van data.json, zodat het bord ook bij de eerste

/* ════════════════════════════════════════════════════════
   2. DE LAMEL
   Twee statische helften en twee kleppen. De bovenklep valt weg
   en laat de nieuwe bovenhelft zien, de onderklep valt erop.
   Eén omslag is één letter verder op de rol — precies zoals een
   echt bord, alleen springt hij bij een grote afstand vooruit
   zodat je niet het hele alfabet hoeft af te wachten.
   ════════════════════════════════════════════════════════ */
const ROL_TEKST = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-'&/:";
const ROL_CIJFER = " 0123456789";
const MAX_STAPPEN = 5;

function route(van, naar, rol) {
    const n = rol.length;
    let i = rol.indexOf(van); const j = rol.indexOf(naar);
    if (i < 0) i = 0;
    if (j < 0) return [];
    let d = (j - i + n) % n;
    const pad = [];
    if (d > MAX_STAPPEN) { i = (j - MAX_STAPPEN + n) % n; d = MAX_STAPPEN; pad.push(rol[i]); }
    for (let k = 1; k <= d; k++) pad.push(rol[(i + k) % n]);
    return pad;
}

function maakLamel(rol) {
    const el = document.createElement('span');
    el.className = 'flap';
    el.innerHTML = '<span class="h b"><i></i></span><span class="h o"><i></i></span>' +
                   '<span class="k kb"><i></i></span><span class="k ko"><i></i></span>';
    const i = el.querySelectorAll('i');
    const [boven, onder, klepB, klepO] = i;
    let huidig = ' ', beurt = 0, klok = null;

    function vast(c) { boven.textContent = onder.textContent = klepB.textContent = klepO.textContent = c; huidig = c; }
    vast(' ');

    function omslag(volgende, klaar) {
        boven.textContent = volgende;   /* komt tevoorschijn onder de vallende klep */
        onder.textContent = huidig;     /* blijft staan tot de onderklep landt */
        klepB.textContent = huidig;
        klepO.textContent = volgende;
        el.classList.remove('draait'); void el.offsetWidth; el.classList.add('draait');
        klik();
        klok = setTimeout(function () {
            el.classList.remove('draait');
            vast(volgende);
            klaar && klaar();
        }, RUSTIG ? 1 : 110);
    }

    function zet(doel, wacht) {
        doel = (doel == null || doel === '') ? ' ' : String(doel).charAt(0);
        if (rol.indexOf(doel) < 0) doel = ' ';
        if (doel === huidig) return;
        const mijn = ++beurt;
        clearTimeout(klok);
        if (RUSTIG) { vast(doel); return; }
        const pad = route(huidig, doel, rol);
        setTimeout(function volgende() {
            if (mijn !== beurt) return;
            const v = pad.shift();
            if (v === undefined) return;
            omslag(v, function () { if (mijn === beurt) volgende(); });
        }, wacht || 0);
    }
    return { el, zet };
}

/* Een rij lamellen die samen een woord tonen. */
function maakRegel(houder, aantal, rol) {
    houder.style.setProperty('--n', aantal);
    houder.innerHTML = '';
    const cellen = [];
    for (let k = 0; k < aantal; k++) {
        const c = maakLamel(rol || ROL_TEKST);
        houder.appendChild(c.el);
        cellen.push(c);
    }
    return {
        zet(tekst, midden) {
            let s = plat(tekst);
            if (s.length > aantal) s = s.slice(0, aantal);
            if (midden) {
                const links = Math.floor((aantal - s.length) / 2);
                s = ' '.repeat(links) + s;
            }
            s = s.padEnd(aantal, ' ');
            for (let k = 0; k < aantal; k++) cellen[k].zet(s[k], k * 35);
        }
    };
}

/* ════════════════════════════════════════════════════════
   3. HET GELUID
   Een lamellenbord klinkt. Ruis door een smalle band, heel kort:
   dat is de klik. Geen bestandje nodig, dus ook offline.
   ════════════════════════════════════════════════════════ */
let GELUID = OPSLAG.lees('rbc-geluid', true);
let ac = null, laatsteKlik = 0, klikkenDitSeconde = 0, seconde = 0;
function klik() {
    if (!GELUID || RUSTIG) return;
    const nu = Date.now();
    const s = Math.floor(nu / 1000);
    if (s !== seconde) { seconde = s; klikkenDitSeconde = 0; }
    if (klikkenDitSeconde > 9 || nu - laatsteKlik < 22) return;
    klikkenDitSeconde++; laatsteKlik = nu;
    try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        const n = 0.035, sr = ac.sampleRate, buf = ac.createBuffer(1, sr * n, sr);
        const d = buf.getChannelData(0);
        for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 5);
        const bron = ac.createBufferSource(); bron.buffer = buf;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 1500 + Math.random() * 500; bp.Q.value = 1.4;
        const g = ac.createGain(); g.gain.value = 0.10;
        bron.connect(bp); bp.connect(g); g.connect(ac.destination);
        bron.start();
    } catch (e) { GELUID = false; }
}

/* ════════════════════════════════════════════════════════
   4. GEGEVENS
   ════════════════════════════════════════════════════════ */
const D = { squad: [], bijgewerkt: null, volgende: null };

function afkorting(naam) {
    /* Drie lamellen, dus drie letters. Voorvoegsels als RKSV zeggen
       niets, die vallen af; daarna telt het eerste echte woord.
       RKSV GROENE STER wordt GRO, NAC BREDA wordt NAC. */
    const s = plat(naam).replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean)
        .filter(w => !['SC', 'VV', 'FC', 'RKSV', 'SV', 'AFC', 'RKVV', 'VVV', 'DE', 'VAN'].includes(w));
    if (!s.length) return '???';
    if (s[0].length >= 3) return s[0].slice(0, 3);
    return (s.join('') + '  ').slice(0, 3);
}
function tegenstanderVan(m) {
    if (!m) return '';

    return (thuis ? m.away_team : m.home_team) || '';
