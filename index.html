<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBC Roosendaal</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="RBC Roosendaal — welke speler heeft welk rugnummer, de stand, de uitslagen en het programma. Derde Divisie B.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/rbc.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RBC">
<style>
/* ════════════════════════════════════════════════════════════
   RBC Roosendaal — voor op de tribune
   Gemaakt voor oudere supporters met een telefoon in de hand:
   grote letters, veel contrast, ruime knoppen, één kolom.
   Zwart op wit; oranje alleen om RBC aan te wijzen.
   ════════════════════════════════════════════════════════════ */
:root {
    --oranje: #C25E00;      /* donker genoeg voor contrast op wit */
    --grijs:  #5A5A5A;
    --lijn:   #D6D6D6;
    color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 20px; -webkit-text-size-adjust: 100%; }

body {
    background: #fff;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    max-width: 34rem;
    margin: 0 auto;
    padding: 0 1rem 4rem;
}

/* ── kop ───────────────────────────────────────────────── */
header {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 1.4rem 0 0.9rem;
}
/* Aparte kleine versie van het logo: het origineel is 267 kB en de
   hele pagina weegt minder dan een tiende daarvan. */
header img { width: 3.1rem; height: auto; flex-shrink: 0; }
h1 { font-size: 1.6rem; line-height: 1.2; }
header p { color: var(--grijs); font-size: 0.9rem; }

/* ── snelmenu ───────────────────────────────────────────
   Twee rijen van twee: op een telefoon paste "Programma"
   niet in een rij van vier, en zo worden de knoppen meteen
   een stuk groter om aan te tikken. */
nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    padding-bottom: 1.1rem;
    margin-bottom: 1.4rem;
    border-bottom: 2px solid #000;
}
nav a {
    text-align: center;
    padding: 0.8rem 0.3rem;
    font-size: 1rem;
    font-weight: 700;
    color: #000;
    text-decoration: none;
    border: 2px solid #000;
    border-radius: 0.35rem;
    min-height: 3.2rem;
    display: flex; align-items: center; justify-content: center;
}
@media (min-width: 560px) { nav { grid-template-columns: repeat(4, 1fr); } }
nav a:active { background: #000; color: #fff; }

h2 {
    font-size: 1.3rem;
    margin: 2.2rem 0 0.8rem;
    padding-bottom: 0.35rem;
    border-bottom: 2px solid #000;
}
section:first-of-type h2 { margin-top: 0; }

/* ── wedstrijd / stand van zaken ───────────────────────── */
.wedstrijd { font-size: 1.15rem; }
.wedstrijd strong { font-size: 1.25rem; }
.score {
    font-size: 3.2rem; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.02em;
}
.live {
    display: inline-block;
    background: #000; color: #fff;
    font-size: 0.8rem; font-weight: 700;
    padding: 0.15rem 0.5rem; border-radius: 0.25rem;
    margin-bottom: 0.4rem;
}

/* ── rugnummer opzoeken: het belangrijkste op deze site ── */
.zoek { margin-bottom: 1.2rem; }
label.zoek-label {
    display: block;
    font-size: 1rem; font-weight: 700;
    margin-bottom: 0.45rem;
}
#nummer {
    width: 100%;
    font: inherit;
    font-size: 2.6rem;
    font-weight: 700;
    text-align: center;
    padding: 0.55rem;
    border: 3px solid #000;
    border-radius: 0.4rem;
    background: #fff; color: #000;
}
#nummer:focus { outline: 4px solid var(--oranje); outline-offset: 2px; }
#gevonden {
    margin-top: 0.7rem;
    min-height: 3.4rem;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.25;
}
#gevonden .leeg { font-size: 1rem; font-weight: 400; color: var(--grijs); }

/* ── spelerslijst ──────────────────────────────────────── */
ul.spelers { list-style: none; }
ul.spelers li {
    display: flex; align-items: baseline; gap: 0.9rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--lijn);
    font-size: 1.15rem;
}
ul.spelers .rug {
    flex: 0 0 2.4rem;
    text-align: right;
    font-size: 1.5rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
}
ul.spelers li.raak { background: #FFF3E3; }
ul.spelers li.raak .rug { color: var(--oranje); }

/* ── tabellen ──────────────────────────────────────────── */
table { border-collapse: collapse; width: 100%; font-size: 1.05rem; }
th, td { text-align: left; padding: 0.5rem 0.3rem; border-bottom: 1px solid var(--lijn); }
th { font-size: 0.8rem; color: var(--grijs); font-weight: 400; border-bottom: 2px solid #000; }
td.pos, th.pos { width: 2.2rem; text-align: right; padding-right: 0.6rem; font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.rbc td { font-weight: 700; color: var(--oranje); }

/* ── uitslagen ─────────────────────────────────────────── */
ul.uitslagen { list-style: none; }
ul.uitslagen li {
    display: flex; justify-content: space-between; gap: 0.8rem;
    padding: 0.55rem 0; border-bottom: 1px solid var(--lijn);
    font-size: 1.05rem;
}
ul.uitslagen .uitslag { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
ul.uitslagen li.rbc { color: var(--oranje); font-weight: 700; }

/* ── programma ─────────────────────────────────────────── */
ul.programma { list-style: none; }
ul.programma li { padding: 0.6rem 0; border-bottom: 1px solid var(--lijn); }
ul.programma .datum { display: block; font-size: 0.85rem; color: var(--grijs); }
ul.programma .duel { font-size: 1.1rem; }
ul.programma li.rbc .duel { font-weight: 700; }

/* ── doorsturen naar wie niet mee kon ──────────────────── */
.deel { margin-top: 1.1rem; }
.deel select, .deel button {
    width: 100%; font: inherit; font-size: 1.05rem;
    padding: 0.7rem; border: 2px solid #000; border-radius: 0.4rem;
    background: #fff; color: #000; min-height: 3.2rem;
}
.deel select { margin-bottom: 0.6rem; }
.deel button { font-weight: 700; background: #000; color: #fff; cursor: pointer; }
.deel button:active { background: #444; }
.deel .uitleg { font-size: 0.85rem; color: var(--grijs); margin-bottom: 0.45rem; }

.wacht { color: var(--grijs); }
.bron { font-size: 0.8rem; color: var(--grijs); margin-top: 0.6rem; }

footer {
    margin-top: 3rem; padding-top: 1.2rem;
    border-top: 1px solid var(--lijn);
    font-size: 0.9rem;
    /* Wikkelen met gap: met margin-right liep de laatste link
       op een smal scherm buiten beeld. */
    display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem;
}
footer a { color: #000; padding: 0.4rem 0; }

/* Iets ruimer op grote schermen, maar mobiel blijft leidend. */
@media (min-width: 700px) { html { font-size: 21px; } }
</style>
</head>
<body>

<header>
    <img src="/rbc-klein.png" alt="Clublogo RBC Roosendaal" width="143" height="192">
    <div>
        <h1>RBC Roosendaal</h1>
        <p>Derde Divisie B &middot; 2026/2027</p>
    </div>
</header>

<nav>
    <a href="#spelers">Spelers</a>
    <a href="#stand">Stand</a>
    <a href="#uitslagen">Uitslagen</a>
    <a href="#programma">Programma</a>
</nav>

<section id="wedstrijd">
    <h2>Wedstrijd</h2>
    <div id="wedstrijd-inhoud"><p class="wacht">Laden&hellip;</p></div>
    <div class="deel" id="deel"></div>
</section>

<section id="spelers">
    <h2>Welke speler is dit?</h2>
    <div class="zoek">
        <label class="zoek-label" for="nummer">Tik het rugnummer in</label>
        <input id="nummer" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="2" autocomplete="off" placeholder="14"
               aria-describedby="gevonden">
        <div id="gevonden" role="status" aria-live="polite">
            <span class="leeg">Of zoek het nummer op in de lijst hieronder.</span>
        </div>
    </div>
    <ul class="spelers" id="spelerslijst"><li class="wacht">Laden&hellip;</li></ul>
    <p class="bron" id="selectie-datum"></p>
</section>

<section id="stand">
    <h2>Stand</h2>
    <div id="stand-inhoud"><p class="wacht">Laden&hellip;</p></div>
</section>

<section id="uitslagen">
    <h2>Uitslagen</h2>
    <div id="uitslagen-inhoud"><p class="wacht">Laden&hellip;</p></div>
</section>

<section id="programma">
    <h2>Programma</h2>
    <div id="programma-inhoud"><p class="wacht">Laden&hellip;</p></div>
</section>

<footer>
    <a href="/klassiek.html">Uitgebreide site</a>
    <a href="/teletekst.html">Teletekst</a>
    <a href="/snes.html">16-bit</a>
</footer>

<script>
/* ── bronnen: dezelfde als voorheen ─────────────────────── */
const SEASON = '2026-2027';
const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://api.cors.lol/?url='
];
const STAND_URL = `https://www.hollandsevelden.nl/competities/${SEASON}/landelijk/derde-divisie-b/`;
const PROGRAMMA_URL = STAND_URL + 'programma/';
const NOS_URL = 'https://nos.nl/teletekst/835';

let SQUAD = [];

async function haal(url) {
    for (const p of PROXIES) {
        try {
            const r = await fetch(p + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
            if (r.ok) return await r.text();
        } catch (e) { /* volgende proxy */ }
    }
    throw new Error('bron onbereikbaar');
}
const dom = h => new DOMParser().parseFromString(h, 'text/html');
const zet = (id, html) => { document.getElementById(id).innerHTML = html; };
const stuk = (id, wat) => zet(id, `<p class="wacht">${wat} is nu niet op te halen.</p>`);
const veilig = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const isRBC = n => /^rbc\b/i.test(String(n || '').trim());

/* ════════════════════════════════════════════════════════
   RUGNUMMER OPZOEKEN
   De ploeg is flink gewijzigd, dus op de tribune is dit de
   eerste vraag: wie is nummer zoveel?
   ════════════════════════════════════════════════════════ */
function toonSpelers() {
    zet('spelerslijst', SQUAD.map(p =>
        `<li data-nr="${veilig(p.number)}">` +
        `<span class="rug">${veilig(p.number)}</span>` +
        `<span class="naam">${veilig(p.name)}</span></li>`).join(''));
}

function zoek() {
    const veld = document.getElementById('nummer');
    const nr = veld.value.replace(/\D/g, '');
    veld.value = nr;
    const uit = document.getElementById('gevonden');

    document.querySelectorAll('#spelerslijst li').forEach(li => li.classList.remove('raak'));

    if (!nr) {
        uit.innerHTML = '<span class="leeg">Of zoek het nummer op in de lijst hieronder.</span>';
        return;
    }
    const speler = SQUAD.find(p => String(p.number) === String(+nr));
    if (!speler) {
        uit.innerHTML = `<span class="leeg">Nummer ${veilig(nr)} staat niet in de selectie.</span>`;
        return;
    }
    uit.textContent = speler.name;
    const li = document.querySelector(`#spelerslijst li[data-nr="${speler.number}"]`);
    if (li) li.classList.add('raak');
}
document.getElementById('nummer').addEventListener('input', zoek);

/* ════════════════════════════════════════════════════════
   WEDSTRIJD + LIVE STAND
   ════════════════════════════════════════════════════════ */
let volgende = null;

function toonWedstrijd(live) {
    LIVE = live || null;
    if (live) {
        zet('wedstrijd-inhoud',
            `<span class="live">NU BEZIG</span>` +
            `<div class="wedstrijd"><strong>${veilig(live.home)}</strong> &ndash; <strong>${veilig(live.away)}</strong></div>` +
            `<div class="score">${live.homeScore} &ndash; ${live.awayScore}</div>` +
            `<p class="bron">Bron: NOS Teletekst 835</p>`);
        toonDelen();
        return;
    }
    if (volgende && volgende.home_team) {
        zet('wedstrijd-inhoud',
            `<div class="wedstrijd"><strong>${veilig(volgende.home_team)}</strong> &ndash; ` +
            `<strong>${veilig(volgende.away_team)}</strong></div>` +
            `<p>${veilig(volgende.status || '')}</p>`);
    } else {
        zet('wedstrijd-inhoud', '<p class="wacht">Nog geen wedstrijd bekend.</p>');
    }
    toonDelen();
}

/* ════════════════════════════════════════════════════════
   DOORSTUREN
   Op de tribune appen supporters de stand door aan wie niet
   mee kon, en zetten er de doelpuntenmaker bij als ze die
   weten. Daarom een knop die de tekst al klaarzet, met de
   selectie als keuzelijst voor de naam.
   ════════════════════════════════════════════════════════ */
let LIVE = null;

function toonDelen() {
    const el = document.getElementById('deel');
    if (!LIVE && !volgende) { el.innerHTML = ''; return; }

    const opties = SQUAD.map(p =>
        `<option value="${veilig(p.name)}">${veilig(p.number)} &ndash; ${veilig(p.name)}</option>`).join('');

    el.innerHTML =
        `<p class="uitleg">Stuur de stand door aan wie er niet bij is.</p>` +
        (LIVE && SQUAD.length
            ? `<select id="scorer" aria-label="Wie scoorde? Niet verplicht">
                   <option value="">Wie scoorde? (niet verplicht)</option>${opties}
               </select>`
            : '') +
        `<button type="button" id="deelknop">Stuur de stand door</button>`;

    document.getElementById('deelknop').addEventListener('click', deel);
}

function deelTekst() {
    const sel = document.getElementById('scorer');
    const naam = sel ? sel.value : '';
    if (LIVE) {
        let t = `${LIVE.home} ${LIVE.homeScore}-${LIVE.awayScore} ${LIVE.away}`;
        if (naam) t += `\nDoelpunt: ${naam}`;
        return t + `\nrbcroosendaal.com`;
    }
    return `${volgende.home_team} - ${volgende.away_team}\n${volgende.status || ''}\nrbcroosendaal.com`;
}

async function deel() {
    const tekst = deelTekst();
    // Het deelvenster van de telefoon zelf: dan kan het naar
    // WhatsApp, sms of wat de supporter ook gebruikt.
    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
}

/* NOS Teletekst levert de regels als gekleurde stukjes:
   geel = clubnaam, groen = doelpunten. */
function leesNOS(html) {
    const eindTag = '<' + '/script>';
    const m = html.match(new RegExp('__NEXT_DATA__[^{]*(\\{[\\s\\S]*?\\})\\s*' + eindTag));
    if (!m) return null;
    let data;
    try { data = JSON.parse(m[1]); } catch (e) { return null; }
    const inhoud = data && data.props && data.props.pageProps && data.props.pageProps.content;
    if (!inhoud) return null;

    const uit = [];
    inhoud.split('\n').forEach(regel => {
        const delen = [];
        const re = /<span class="(yellow|green)\s*">\s*(.*?)<\/span>/g;
        let s;
        while ((s = re.exec(regel)) !== null) {
            delen.push({ k: s[1], t: s[2].replace(/&nbsp;/g, ' ').replace(/<[^>]*>/g, '').trim() });
        }
        for (let i = 0; i <= delen.length - 4; i++) {
            if (delen[i].k === 'yellow' && delen[i+1].k === 'green' &&
                delen[i+2].k === 'yellow' && delen[i+3].k === 'green') {
                const [h, hs, a, as] = [delen[i].t, delen[i+1].t, delen[i+2].t, delen[i+3].t];
                if (h && a && /^\d+$/.test(hs) && /^\d+$/.test(as)) {
                    uit.push({ home: h, away: a, homeScore: +hs, awayScore: +as });
                }
            }
        }
    });
    return uit.length ? uit : null;
}

async function uitslagen() {
    const html = await haal(NOS_URL);
    const lijst = leesNOS(html);
    if (!lijst) { zet('uitslagen-inhoud', '<p class="wacht">Nu geen uitslagen.</p>'); return; }

    const eigen = lijst.find(w => isRBC(w.home) || isRBC(w.away));
    if (eigen) toonWedstrijd(eigen);

    zet('uitslagen-inhoud',
        '<ul class="uitslagen">' + lijst.map(w => {
            const mij = isRBC(w.home) || isRBC(w.away);
            return `<li${mij ? ' class="rbc"' : ''}>` +
                   `<span>${veilig(w.home)} &ndash; ${veilig(w.away)}</span>` +
                   `<span class="uitslag">${w.homeScore}&ndash;${w.awayScore}</span></li>`;
        }).join('') + '</ul>' +
        '<p class="bron">Bron: NOS Teletekst 835 &middot; ververst elke 30 seconden</p>');
}

/* ════════════════════════════════════════════════════════
   STAND
   ════════════════════════════════════════════════════════ */
function standTabel(doc) {
    for (const h2 of doc.querySelectorAll('h2')) {
        if (!h2.textContent.includes('Stand')) continue;
        let el = h2.nextElementSibling;
        while (el) {
            const t = el.querySelector('table') || (el.tagName === 'TABLE' ? el : null);
            if (t) return t;
            if (el.matches('h2,h3')) break;
            el = el.nextElementSibling;
        }
        let p = h2.parentElement;
        while (p) { const t = p.querySelector('table'); if (t) return t; p = p.parentElement; if (!p || p.tagName === 'BODY') break; }
        break;
    }
    return null;
}
async function stand() {
    const t = standTabel(dom(await haal(STAND_URL)));
    if (!t) throw new Error('geen tabel');
    const rijen = [...t.querySelectorAll('tbody tr')].map(r => {
        const c = [...r.querySelectorAll('th,td')].map(e => e.textContent.trim().replace(/\s+/g, ' '));
        if (c.length < 5) return null;
        // er komen twee kolomindelingen voor
        return c.length >= 9
            ? { pos: c[0], club: c[1], wed: c[2], pnt: c[4] }
            : { pos: c[0], club: c[1], wed: c[2], pnt: c[9] || '' };
    }).filter(Boolean);
    if (!rijen.length) throw new Error('leeg');

    zet('stand-inhoud',
        '<table><thead><tr><th class="pos">#</th><th>Club</th>' +
        '<th class="n">Wed</th><th class="n">Ptn</th></tr></thead><tbody>' +
        rijen.map(r =>
            `<tr${isRBC(r.club) ? ' class="rbc"' : ''}>` +
            `<td class="pos">${veilig(r.pos)}</td>` +
            `<td>${veilig(r.club)}</td>` +
            `<td class="n">${veilig(r.wed)}</td>` +
            `<td class="n">${veilig(r.pnt)}</td></tr>`).join('') +
        '</tbody></table>');
}

/* ════════════════════════════════════════════════════════
   PROGRAMMA
   ════════════════════════════════════════════════════════ */
async function programma() {
    const doc = dom(await haal(PROGRAMMA_URL));
    const uit = [];
    doc.querySelectorAll('table.match,table[class*="match"]').forEach(t => {
        const cap = t.querySelector('caption time,caption');
        // "Wedstrijden op zondag 16 augustus 2026" -> "zondag 16 augustus"
        const datum = cap
            ? cap.textContent.trim().replace(/\s+/g, ' ')
                 .replace(/^wedstrijden op\s*/i, '')
                 .replace(/\s*20\d\d$/, '')
            : '';
        t.querySelectorAll('tbody tr').forEach(row => {
            const c = row.querySelectorAll('td');
            if (c.length < 4) return;
            uit.push({
                datum,
                thuis: c[0].textContent.trim().replace(/\s+/g, ' '),
                uit: c[2].textContent.trim().replace(/\s+/g, ' '),
                tijd: c[3].textContent.trim().replace(/\s+/g, ' ')
            });
        });
    });
    const eigen = uit.filter(w => isRBC(w.thuis) || isRBC(w.uit));
    const lijst = (eigen.length ? eigen : uit).slice(0, 8);
    if (!lijst.length) { zet('programma-inhoud', '<p class="wacht">Geen wedstrijden gevonden.</p>'); return; }

    zet('programma-inhoud', '<ul class="programma">' + lijst.map(w =>
        `<li${isRBC(w.thuis) || isRBC(w.uit) ? ' class="rbc"' : ''}>` +
        `<span class="datum">${veilig(w.datum)} &middot; ${veilig(w.tijd)}</span>` +
        `<span class="duel">${veilig(w.thuis)} &ndash; ${veilig(w.uit)}</span></li>`).join('') + '</ul>');
}

/* ════════════════════════════════════════════════════════
   START — elke bron apart, zodat een storing de rest
   niet meesleept
   ════════════════════════════════════════════════════════ */
(async function () {
    try {
        const m = await (await fetch('data.json?v=' + Date.now())).json();
        SQUAD = (m.squad || []).slice().sort((a, b) => a.number - b.number);
        volgende = m.match || null;
        toonSpelers();
        // Laat zien hoe oud de rugnummers zijn: ze komen uit een eigen
        // bestand, niet live binnen, en de selectie wijzigt.
        if (m.squad_bijgewerkt) {
            const d = new Date(m.squad_bijgewerkt + 'T00:00:00');
            const mnd = ['januari','februari','maart','april','mei','juni','juli',
                         'augustus','september','oktober','november','december'];
            document.getElementById('selectie-datum').textContent =
                'Rugnummers bijgewerkt op ' + d.getDate() + ' ' + mnd[d.getMonth()] + ' ' + d.getFullYear() + '.';
        }
        toonWedstrijd(null);
    } catch (e) {
        zet('spelerslijst', '<li class="wacht">Selectie is nu niet op te halen.</li>');
        zet('wedstrijd-inhoud', '<p class="wacht">Wedstrijd is nu niet op te halen.</p>');
    }
})();

stand().catch(() => stuk('stand-inhoud', 'De stand'));
programma().catch(() => stuk('programma-inhoud', 'Het programma'));
uitslagen().catch(() => stuk('uitslagen-inhoud', 'De uitslagen'));
setInterval(() => { uitslagen().catch(() => {}); }, 30000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
