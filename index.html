<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RBC Roosendaal</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="RBC Roosendaal — welke speler heeft welk rugnummer, de stand, de uitslagen en het programma. Derde Divisie B.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/rbc.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RBC">
<style>
/* ════════════════════════════════════════════════════════════
   RBC Roosendaal — voor op de tribune
   Gemaakt voor oudere supporters met een telefoon in de hand:
   grote letters, veel contrast, ruime knoppen, één kolom.
   Zwart op wit; oranje alleen om RBC aan te wijzen.
   ════════════════════════════════════════════════════════════ */
:root {
    --oranje: #C25E00;      /* donker genoeg voor contrast op wit */
    --grijs:  #5A5A5A;
    --lijn:   #D6D6D6;
    color-scheme: light;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 20px; -webkit-text-size-adjust: 100%; }

body {
    background: #fff;
    color: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    max-width: 34rem;
    margin: 0 auto;
    padding: 0 1rem 4rem;
}

/* ── taalkeuze ─────────────────────────────────────────── */
.talen {
    display: flex; justify-content: flex-end; gap: 0.4rem;
    padding-top: 0.7rem;
}
.talen button {
    font: inherit; font-size: 0.95rem; font-weight: 700;
    padding: 0.5rem 0.7rem;
    min-height: 2.8rem;
    background: #fff; color: #000;
    border: 2px solid var(--lijn);
    border-radius: 0.35rem;
    cursor: pointer;
    line-height: 1;
}
.talen button[aria-pressed="true"] { border-color: #000; }
.talen .vlag { font-size: 1.15rem; margin-right: 0.3rem; }

/* ── kop ───────────────────────────────────────────────── */
header {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.6rem 0 0.9rem;
}
/* Aparte kleine versie van het logo: het origineel is 267 kB en de
   hele pagina weegt minder dan een tiende daarvan. */
header img { width: 3.1rem; height: auto; flex-shrink: 0; }
h1 { font-size: 1.6rem; line-height: 1.2; }
header p { color: var(--grijs); font-size: 0.9rem; }

/* ── snelmenu ───────────────────────────────────────────
   Twee rijen van twee: op een telefoon paste "Programma"
   niet in een rij van vier, en zo worden de knoppen meteen
   een stuk groter om aan te tikken. */
nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    padding-bottom: 1.1rem;
    margin-bottom: 1.4rem;
    border-bottom: 2px solid #000;
}
nav a {
    text-align: center;
    padding: 0.8rem 0.3rem;
    font-size: 1rem;
    font-weight: 700;
    color: #000;
    text-decoration: none;
    border: 2px solid #000;
    border-radius: 0.35rem;
    min-height: 3.2rem;
    display: flex; align-items: center; justify-content: center;
}
@media (min-width: 560px) { nav { grid-template-columns: repeat(4, 1fr); } }

h2 {
    font-size: 1.3rem;
    margin: 2.2rem 0 0.8rem;
    padding-bottom: 0.35rem;
    border-bottom: 2px solid #000;
}
section:first-of-type h2 { margin-top: 0; }

/* ── wedstrijd ─────────────────────────────────────────── */
.wedstrijd { font-size: 1.15rem; }
.wedstrijd strong { font-size: 1.25rem; }
.score {
    font-size: 3.2rem; font-weight: 700; line-height: 1.1;
    letter-spacing: -0.02em;
}
.live {
    display: inline-block;
    background: #000; color: #fff;
    font-size: 0.8rem; font-weight: 700;
    padding: 0.15rem 0.5rem; border-radius: 0.25rem;
    margin-bottom: 0.4rem;
}

/* ── rugnummer opzoeken: het belangrijkste op deze site ── */
.zoek { margin-bottom: 1.2rem; }
label.zoek-label {
    display: block;
    font-size: 1rem; font-weight: 700;
    margin-bottom: 0.45rem;
}
#nummer {
    width: 100%;
    font: inherit;
    font-size: 2.6rem;
    font-weight: 700;
    text-align: center;
    padding: 0.55rem;
    border: 3px solid #000;
    border-radius: 0.4rem;
    background: #fff; color: #000;
}
#nummer:focus { outline: 4px solid var(--oranje); outline-offset: 2px; }
#gevonden {
    margin-top: 0.7rem;
    min-height: 3.4rem;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.25;
}
#gevonden .leeg { font-size: 1rem; font-weight: 400; color: var(--grijs); }
#gevonden .details {
    display: block;
    font-size: 0.95rem; font-weight: 400; line-height: 1.45;
    color: var(--grijs); margin-top: 0.3rem;
}
#gevonden .details .van { color: #000; }
/* rijen in de lijst zijn aan te tikken: niet iedereen typt */
ul.spelers li { cursor: pointer; }

/* ── spelerslijst ──────────────────────────────────────── */
ul.spelers { list-style: none; }
ul.spelers li {
    display: flex; align-items: baseline; gap: 0.9rem;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--lijn);
    font-size: 1.15rem;
}
ul.spelers .rug {
    flex: 0 0 2.4rem;
    text-align: right;
    font-size: 1.5rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
}
ul.spelers li.raak { background: #FFF3E3; }
ul.spelers li.raak .rug { color: var(--oranje); }

/* ── tabellen ──────────────────────────────────────────── */
table { border-collapse: collapse; width: 100%; font-size: 1.05rem; }
th, td { text-align: left; padding: 0.5rem 0.3rem; border-bottom: 1px solid var(--lijn); }
th { font-size: 0.8rem; color: var(--grijs); font-weight: 400; border-bottom: 2px solid #000; }
td.pos, th.pos { width: 2.2rem; text-align: right; padding-right: 0.6rem; font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.rbc td { font-weight: 700; color: var(--oranje); }

/* ── uitslagen ─────────────────────────────────────────── */
ul.uitslagen { list-style: none; }
ul.uitslagen li {
    display: flex; justify-content: space-between; gap: 0.8rem;
    padding: 0.55rem 0; border-bottom: 1px solid var(--lijn);
    font-size: 1.05rem;
}
ul.uitslagen .uitslag { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
ul.uitslagen li.rbc { color: var(--oranje); font-weight: 700; }

/* ── programma ─────────────────────────────────────────── */
ul.programma { list-style: none; }
ul.programma li { padding: 0.6rem 0; border-bottom: 1px solid var(--lijn); }
ul.programma .datum { display: block; font-size: 0.85rem; color: var(--grijs); }
ul.programma .duel { font-size: 1.1rem; }
ul.programma li.rbc .duel { font-weight: 700; }

/* ── doorsturen naar wie niet mee kon ──────────────────── */
.deel { margin-top: 1.2rem; }
.deel .uitleg { font-size: 0.9rem; color: var(--grijs); margin-bottom: 0.6rem; }
.deel-score {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: end; gap: 0.6rem;
    margin-bottom: 0.7rem;
}
.deel-score .team {
    display: block; font-size: 0.85rem; font-weight: 700;
    margin-bottom: 0.25rem;
    overflow-wrap: anywhere;
}
.deel-score input {
    width: 100%; font: inherit; font-size: 1.9rem; font-weight: 700;
    text-align: center; padding: 0.35rem;
    border: 2px solid #000; border-radius: 0.4rem;
    background: #fff; color: #000;
}
.deel-score .streep { font-size: 1.5rem; font-weight: 700; padding-bottom: 0.5rem; }
.deel select, .deel button {
    width: 100%; font: inherit; font-size: 1.05rem;
    padding: 0.7rem; border: 2px solid #000; border-radius: 0.4rem;
    background: #fff; color: #000; min-height: 3.2rem;
}
.deel select { margin-bottom: 0.6rem; }
.deel button { font-weight: 700; background: #000; color: #fff; cursor: pointer; }
.deel button:active { background: #444; }

.wacht { color: var(--grijs); }
.bron { font-size: 0.8rem; color: var(--grijs); margin-top: 0.6rem; }

footer {
    margin-top: 3rem; padding-top: 1.2rem;
    border-top: 1px solid var(--lijn);
    font-size: 0.9rem;
    /* Wikkelen met gap: met margin-right liep de laatste link
       op een smal scherm buiten beeld. */
    display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem;
}
footer a { color: #000; padding: 0.4rem 0; }

/* Iets ruimer op grote schermen, maar mobiel blijft leidend. */
@media (min-width: 700px) { html { font-size: 21px; } }
</style>
</head>
<body>

<div class="talen">
    <button type="button" id="taal-nl" aria-pressed="true"><span class="vlag">🇳🇱</span>NL</button>
    <button type="button" id="taal-en" aria-pressed="false"><span class="vlag">🇬🇧</span>EN</button>
</div>

<header>
    <img src="/rbc-klein.png" alt="RBC Roosendaal" width="143" height="192">
    <div>
        <h1>RBC Roosendaal</h1>
        <p data-t="ondertitel"></p>
    </div>
</header>

<nav>
    <a href="#spelers" data-t="nav_spelers"></a>
    <a href="#stand" data-t="nav_stand"></a>
    <a href="#uitslagen" data-t="nav_uitslagen"></a>
    <a href="#programma" data-t="nav_programma"></a>
</nav>

<section id="wedstrijd">
    <h2 data-t="kop_wedstrijd"></h2>
    <div id="wedstrijd-inhoud"><p class="wacht" data-t="laden"></p></div>
    <div class="deel" id="deel"></div>
</section>

<section id="spelers">
    <h2 data-t="kop_spelers"></h2>
    <div class="zoek">
        <label class="zoek-label" for="nummer" data-t="tik_nummer"></label>
        <input id="nummer" type="text" inputmode="numeric" pattern="[0-9]*"
               maxlength="2" autocomplete="off" placeholder="14"
               aria-describedby="gevonden">
        <div id="gevonden" role="status" aria-live="polite"></div>
    </div>
    <ul class="spelers" id="spelerslijst"><li class="wacht" data-t="laden"></li></ul>
    <p class="bron" id="selectie-datum"></p>
</section>

<section id="stand">
    <h2 data-t="kop_stand"></h2>
    <div id="stand-inhoud"><p class="wacht" data-t="laden"></p></div>
</section>

<section id="uitslagen">
    <h2 data-t="kop_uitslagen"></h2>
    <div id="uitslagen-inhoud"><p class="wacht" data-t="laden"></p></div>
</section>

<section id="programma">
    <h2 data-t="kop_programma"></h2>
    <div id="programma-inhoud"><p class="wacht" data-t="laden"></p></div>
</section>

<footer>
    <a href="/klassiek.html" data-t="voet_uitgebreid"></a>
    <a href="/teletekst.html">Teletekst</a>
    <a href="/snes.html">16-bit</a>
</footer>

<script>
/* ════════════════════════════════════════════════════════
   TAAL
   ════════════════════════════════════════════════════════ */
const TEKST = {
    nl: {
        ondertitel: 'Derde Divisie B · 2026/2027',
        nav_spelers: 'Spelers', nav_stand: 'Stand',
        nav_uitslagen: 'Uitslagen', nav_programma: 'Programma',
        kop_wedstrijd: 'Wedstrijd', kop_spelers: 'Welke speler is dit?',
        kop_stand: 'Stand', kop_uitslagen: 'Uitslagen', kop_programma: 'Programma',
        laden: 'Laden…',
        tik_nummer: 'Tik het rugnummer in',
        zoek_hint: 'Of zoek het nummer op in de lijst hieronder.',
        niet_gevonden: n => 'Nummer ' + n + ' staat niet in de selectie.',
        nummers_bijgewerkt: d => 'Rugnummers bijgewerkt op ' + d + '.',
        nu_bezig: 'NU BEZIG',
        geen_wedstrijd: 'Nog geen wedstrijd bekend.',
        deel_uitleg: 'Stuur de stand door aan wie er niet bij is.',
        wie_scoorde: 'Wie scoorde? (niet verplicht)',
        deel_knop: 'Stuur de stand door',
        doelpunt: 'Doelpunt',
        th_club: 'Club', th_wed: 'Wed', th_ptn: 'Ptn',
        bron_nos: 'Bron: NOS Teletekst 835 · ververst elke 30 seconden',
        bron_nos_kort: 'Bron: NOS Teletekst 835',
        geen_uitslagen: 'Nu geen uitslagen.',
        geen_duels: 'Geen wedstrijden gevonden.',
        stuk: w => w + ' is nu niet op te halen.',
        w_stand: 'De stand', w_programma: 'Het programma',
        w_uitslagen: 'De uitslagen', w_selectie: 'De selectie',
        w_wedstrijd: 'De wedstrijd',
        voet_uitgebreid: 'Uitgebreide site',
        jaar: 'jaar', eerder_bij: 'Kwam van',
        posities: {
            'Goalkeeper':'Keeper', 'Defender':'Verdediger',
            'Centre-Back':'Centrale verdediger', 'Left-Back':'Linksback',
            'Right-Back':'Rechtsback', 'Midfielder':'Middenvelder',
            'Central Midfield':'Centrale middenvelder',
            'Attacking Midfield':'Aanvallende middenvelder',
            'Left Winger':'Linksbuiten', 'Right Winger':'Rechtsbuiten',
            'Centre-Forward':'Spits', 'Striker':'Spits'
        },
        landen: {
            'Netherlands':'Nederland', 'Morocco':'Marokko', 'Belgium':'België',
            'Ghana':'Ghana', 'Curacao':'Curaçao', 'Cape Verde':'Kaapverdië'
        },
        maanden: ['januari','februari','maart','april','mei','juni','juli',
                  'augustus','september','oktober','november','december']
    },
    en: {
        ondertitel: 'Dutch Third Division B · 2026/2027',
        nav_spelers: 'Players', nav_stand: 'Table',
        nav_uitslagen: 'Results', nav_programma: 'Fixtures',
        kop_wedstrijd: 'Match', kop_spelers: 'Which player is this?',
        kop_stand: 'Table', kop_uitslagen: 'Results', kop_programma: 'Fixtures',
        laden: 'Loading…',
        tik_nummer: 'Enter the shirt number',
        zoek_hint: 'Or find the number in the list below.',
        niet_gevonden: n => 'Number ' + n + ' is not in the squad.',
        nummers_bijgewerkt: d => 'Shirt numbers updated on ' + d + '.',
        nu_bezig: 'LIVE',
        geen_wedstrijd: 'No match scheduled yet.',
        deel_uitleg: 'Send the score to someone who could not make it.',
        wie_scoorde: 'Who scored? (optional)',
        deel_knop: 'Send the score',
        doelpunt: 'Goal',
        th_club: 'Club', th_wed: 'P', th_ptn: 'Pts',
        bron_nos: 'Source: NOS Teletekst 835 · updates every 30 seconds',
        bron_nos_kort: 'Source: NOS Teletekst 835',
        geen_uitslagen: 'No results right now.',
        geen_duels: 'No matches found.',
        stuk: w => w + ' could not be loaded right now.',
        w_stand: 'The table', w_programma: 'The fixtures',
        w_uitslagen: 'The results', w_selectie: 'The squad',
        w_wedstrijd: 'The match',
        voet_uitgebreid: 'Full site',
        jaar: 'years old', eerder_bij: 'Joined from',
        posities: {},
        landen: {},
        maanden: ['January','February','March','April','May','June','July',
                  'August','September','October','November','December']
    }
};
let TAAL = 'nl';
try { const v = localStorage.getItem('rbc-taal'); if (v === 'en' || v === 'nl') TAAL = v; } catch (e) {}
const t = k => TEKST[TAAL][k];

function zetTaal(nieuw) {
    TAAL = nieuw;
    try { localStorage.setItem('rbc-taal', nieuw); } catch (e) {}
    document.documentElement.lang = nieuw;
    document.getElementById('taal-nl').setAttribute('aria-pressed', String(nieuw === 'nl'));
    document.getElementById('taal-en').setAttribute('aria-pressed', String(nieuw === 'en'));
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    tekenAlles();
}
document.getElementById('taal-nl').addEventListener('click', () => zetTaal('nl'));
document.getElementById('taal-en').addEventListener('click', () => zetTaal('en'));

/* ════════════════════════════════════════════════════════
   BRONNEN
   ════════════════════════════════════════════════════════ */
const SEASON = '2026-2027';
const PROXIES = [
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    'https://api.cors.lol/?url='
];
const STAND_URL = 'https://www.hollandsevelden.nl/competities/' + SEASON + '/landelijk/derde-divisie-b/';
const PROGRAMMA_URL = STAND_URL + 'programma/';
const NOS_URL = 'https://nos.nl/teletekst/835';

/* Alles wat binnenkomt blijft bewaard, zodat een taalwissel
   opnieuw kan tekenen zonder de bronnen nog eens te bevragen. */
const D = { squad: [], bijgewerkt: null, volgende: null, live: null,
            stand: null, programma: null, uitslagen: null, fout: {} };

async function haal(url) {
    for (const p of PROXIES) {
        try {
            const r = await fetch(p + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
            if (r.ok) return await r.text();
        } catch (e) { /* volgende proxy */ }
    }
    throw new Error('bron onbereikbaar');
}
const dom = h => new DOMParser().parseFromString(h, 'text/html');
const zet = (id, html) => { document.getElementById(id).innerHTML = html; };
const veilig = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const isRBC = n => /^rbc\b/i.test(String(n || '').trim());

/* ════════════════════════════════════════════════════════
   RUGNUMMER OPZOEKEN
   De ploeg is flink gewijzigd, dus op de tribune is dit de
   eerste vraag: wie is nummer zoveel?
   ════════════════════════════════════════════════════════ */
function tekenSpelers() {
    const datumEl = document.getElementById('selectie-datum');
    if (D.fout.squad) {
        zet('spelerslijst', '<li class="wacht">' + veilig(t('stuk')(t('w_selectie'))) + '</li>');
        datumEl.textContent = '';
        return;
    }
    if (!D.squad.length) {
        zet('spelerslijst', '<li class="wacht">' + t('laden') + '</li>');
        return;
    }
    zet('spelerslijst', D.squad.map(function (p) {
        return '<li data-nr="' + veilig(p.number) + '">' +
               '<span class="rug">' + veilig(p.number) + '</span>' +
               '<span class="naam">' + veilig(p.name) + '</span></li>';
    }).join(''));

    document.querySelectorAll('#spelerslijst li[data-nr]').forEach(function (li) {
        li.addEventListener('click', function () {
            document.getElementById('nummer').value = li.dataset.nr;
            zoek();
            document.getElementById('gevonden').scrollIntoView({ block: 'center' });
        });
    });

    if (D.bijgewerkt) {
        const d = new Date(D.bijgewerkt + 'T00:00:00');
        const datum = TAAL === 'nl'
            ? d.getDate() + ' ' + t('maanden')[d.getMonth()] + ' ' + d.getFullYear()
            : t('maanden')[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        datumEl.textContent = t('nummers_bijgewerkt')(datum);
    } else { datumEl.textContent = ''; }
    zoek();
}

function zoek() {
    const veld = document.getElementById('nummer');
    const nr = veld.value.replace(/\D/g, '');
    veld.value = nr;
    const uit = document.getElementById('gevonden');

    document.querySelectorAll('#spelerslijst li').forEach(function (li) { li.classList.remove('raak'); });

    if (!nr) { uit.innerHTML = '<span class="leeg">' + veilig(t('zoek_hint')) + '</span>'; return; }
    const speler = D.squad.find(function (p) { return String(p.number) === String(+nr); });
    if (!speler) {
        uit.innerHTML = '<span class="leeg">' + veilig(t('niet_gevonden')(nr)) + '</span>';
        return;
    }
    // naam groot, daaronder wat we van deze speler weten
    const posities = t('posities'), landen = t('landen');
    const regel = [];
    if (speler.positie) regel.push(posities[speler.positie] || speler.positie);
    if (speler.leeftijd) regel.push(speler.leeftijd + ' ' + t('jaar'));
    if (speler.nationaliteiten && speler.nationaliteiten.length) {
        regel.push(speler.nationaliteiten.map(function (n) { return landen[n] || n; }).join('/'));
    }
    let details = regel.length ? veilig(regel.join(' · ')) : '';
    if (speler.vorige_club) {
        details += (details ? '<br>' : '') +
                   veilig(t('eerder_bij')) + ' <span class="van">' + veilig(speler.vorige_club) + '</span>';
    }
    uit.innerHTML = veilig(speler.name) + (details ? '<span class="details">' + details + '</span>' : '');

    const li = document.querySelector('#spelerslijst li[data-nr="' + speler.number + '"]');
    if (li) li.classList.add('raak');
}
document.getElementById('nummer').addEventListener('input', zoek);

/* ════════════════════════════════════════════════════════
   WEDSTRIJD
   ════════════════════════════════════════════════════════ */
function tekenWedstrijd() {
    if (D.live) {
        zet('wedstrijd-inhoud',
            '<span class="live">' + veilig(t('nu_bezig')) + '</span>' +
            '<div class="wedstrijd"><strong>' + veilig(D.live.home) + '</strong> &ndash; <strong>' +
            veilig(D.live.away) + '</strong></div>' +
            '<div class="score">' + D.live.homeScore + ' &ndash; ' + D.live.awayScore + '</div>' +
            '<p class="bron">' + veilig(t('bron_nos_kort')) + '</p>');
    } else if (D.volgende && D.volgende.home_team) {
        zet('wedstrijd-inhoud',
            '<div class="wedstrijd"><strong>' + veilig(D.volgende.home_team) + '</strong> &ndash; <strong>' +
            veilig(D.volgende.away_team) + '</strong></div>' +
            '<p>' + veilig(D.volgende.status || '') + '</p>');
    } else if (D.fout.lokaal) {
        zet('wedstrijd-inhoud', '<p class="wacht">' + veilig(t('stuk')(t('w_wedstrijd'))) + '</p>');
    } else {
        zet('wedstrijd-inhoud', '<p class="wacht">' + veilig(t('geen_wedstrijd')) + '</p>');
    }
    tekenDelen();
}

/* ════════════════════════════════════════════════════════
   DOORSTUREN
   Supporters appen de stand naar wie niet mee kon en zetten
   de doelpuntenmaker erbij. Dat moet op elk moment kunnen,
   ook zonder live wedstrijd: de stand is met de hand in te
   vullen en de selectie staat altijd als keuzelijst klaar.
   ════════════════════════════════════════════════════════ */
function tekenDelen() {
    const el = document.getElementById('deel');
    const thuis = D.live ? D.live.home : (D.volgende && D.volgende.home_team) || 'RBC';
    const uitTeam = D.live ? D.live.away : (D.volgende && D.volgende.away_team) || '';

    // Wat de supporter al had ingevuld blijft staan bij hertekenen
    // (taalwissel, nieuwe uitslag binnen).
    const oudT = document.getElementById('score-thuis');
    const oudU = document.getElementById('score-uit');
    const oudS = document.getElementById('scorer');
    const vT = oudT ? oudT.value : (D.live ? String(D.live.homeScore) : '0');
    const vU = oudU ? oudU.value : (D.live ? String(D.live.awayScore) : '0');
    const vS = oudS ? oudS.value : '';

    const opties = D.squad.map(function (p) {
        return '<option value="' + veilig(p.name) + '"' + (p.name === vS ? ' selected' : '') + '>' +
               veilig(p.number) + ' &ndash; ' + veilig(p.name) + '</option>';
    }).join('');

    el.innerHTML =
        '<p class="uitleg">' + veilig(t('deel_uitleg')) + '</p>' +
        '<div class="deel-score">' +
            '<div><span class="team">' + veilig(thuis) + '</span>' +
            '<input id="score-thuis" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="' +
            veilig(vT) + '" aria-label="' + veilig(thuis) + '"></div>' +
            '<span class="streep">&ndash;</span>' +
            '<div><span class="team">' + veilig(uitTeam) + '</span>' +
            '<input id="score-uit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="' +
            veilig(vU) + '" aria-label="' + veilig(uitTeam) + '"></div>' +
        '</div>' +
        (D.squad.length
            ? '<select id="scorer" aria-label="' + veilig(t('wie_scoorde')) + '">' +
              '<option value="">' + veilig(t('wie_scoorde')) + '</option>' + opties + '</select>'
            : '') +
        '<button type="button" id="deelknop">' + veilig(t('deel_knop')) + '</button>';

    ['score-thuis', 'score-uit'].forEach(function (id) {
        const i = document.getElementById(id);
        i.addEventListener('input', function () { i.value = i.value.replace(/\D/g, ''); });
    });
    document.getElementById('deelknop').addEventListener('click', deel);
}

function deelTekst() {
    const thuis = D.live ? D.live.home : (D.volgende && D.volgende.home_team) || 'RBC';
    const uitTeam = D.live ? D.live.away : (D.volgende && D.volgende.away_team) || '';
    const a = (document.getElementById('score-thuis') || {}).value || '0';
    const b = (document.getElementById('score-uit') || {}).value || '0';
    const sel = document.getElementById('scorer');
    const naam = sel ? sel.value : '';
    let tekst = (thuis + ' ' + a + '-' + b + ' ' + uitTeam).trim();
    if (naam) tekst += '\n' + t('doelpunt') + ': ' + naam;
    return tekst + '\nrbcroosendaal.com';
}

async function deel() {
    const tekst = deelTekst();
    // Het deelvenster van de telefoon zelf: dan kan het naar
    // WhatsApp, sms of wat de supporter ook gebruikt.
    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
}

/* ════════════════════════════════════════════════════════
   UITSLAGEN — NOS Teletekst 835
   ════════════════════════════════════════════════════════ */
function leesNOS(html) {
    const eindTag = '<' + '/script>';
    const m = html.match(new RegExp('__NEXT_DATA__[^{]*(\\{[\\s\\S]*?\\})\\s*' + eindTag));
    if (!m) return null;
    let data;
    try { data = JSON.parse(m[1]); } catch (e) { return null; }
    const inhoud = data && data.props && data.props.pageProps && data.props.pageProps.content;
    if (!inhoud) return null;

    const uit = [];
    inhoud.split('\n').forEach(function (regel) {
        const delen = [];
        const re = /<span class="(yellow|green)\s*">\s*(.*?)<\/span>/g;
        let s;
        while ((s = re.exec(regel)) !== null) {
            delen.push({ k: s[1], t: s[2].replace(/&nbsp;/g, ' ').replace(/<[^>]*>/g, '').trim() });
        }
        for (let i = 0; i <= delen.length - 4; i++) {
            if (delen[i].k === 'yellow' && delen[i+1].k === 'green' &&
                delen[i+2].k === 'yellow' && delen[i+3].k === 'green') {
                const h = delen[i].t, hs = delen[i+1].t, a = delen[i+2].t, as = delen[i+3].t;
                if (h && a && /^\d+$/.test(hs) && /^\d+$/.test(as)) {
                    uit.push({ home: h, away: a, homeScore: +hs, awayScore: +as });
                }
            }
        }
    });
    return uit.length ? uit : null;
}

function tekenUitslagen() {
    if (D.fout.uitslagen) {
        zet('uitslagen-inhoud', '<p class="wacht">' + veilig(t('stuk')(t('w_uitslagen'))) + '</p>');
        return;
    }
    if (!D.uitslagen) {
        zet('uitslagen-inhoud', '<p class="wacht">' + veilig(t('geen_uitslagen')) + '</p>');
        return;
    }
    zet('uitslagen-inhoud',
        '<ul class="uitslagen">' + D.uitslagen.map(function (w) {
            const mij = isRBC(w.home) || isRBC(w.away);
            return '<li' + (mij ? ' class="rbc"' : '') + '>' +
                   '<span>' + veilig(w.home) + ' &ndash; ' + veilig(w.away) + '</span>' +
                   '<span class="uitslag">' + w.homeScore + '&ndash;' + w.awayScore + '</span></li>';
        }).join('') + '</ul>' +
        '<p class="bron">' + veilig(t('bron_nos')) + '</p>');
}

async function uitslagen() {
    const lijst = leesNOS(await haal(NOS_URL));
    D.uitslagen = lijst;
    D.live = lijst ? (lijst.find(function (w) { return isRBC(w.home) || isRBC(w.away); }) || null) : null;
    tekenUitslagen();
    tekenWedstrijd();
}

/* ════════════════════════════════════════════════════════
   STAND
   ════════════════════════════════════════════════════════ */
function standTabel(doc) {
    const koppen = doc.querySelectorAll('h2');
    for (let i = 0; i < koppen.length; i++) {
        const h2 = koppen[i];
        if (!h2.textContent.includes('Stand')) continue;
        let el = h2.nextElementSibling;
        while (el) {
            const tb = el.querySelector('table') || (el.tagName === 'TABLE' ? el : null);
            if (tb) return tb;
            if (el.matches('h2,h3')) break;
            el = el.nextElementSibling;
        }
        let p = h2.parentElement;
        while (p) {
            const tb = p.querySelector('table');
            if (tb) return tb;
            p = p.parentElement;
            if (!p || p.tagName === 'BODY') break;
        }
        break;
    }
    return null;
}
function tekenStand() {
    if (D.fout.stand) {
        zet('stand-inhoud', '<p class="wacht">' + veilig(t('stuk')(t('w_stand'))) + '</p>'); return;
    }
    if (!D.stand) { zet('stand-inhoud', '<p class="wacht">' + t('laden') + '</p>'); return; }
    zet('stand-inhoud',
        '<table><thead><tr><th class="pos">#</th><th>' + veilig(t('th_club')) + '</th>' +
        '<th class="n">' + veilig(t('th_wed')) + '</th><th class="n">' + veilig(t('th_ptn')) +
        '</th></tr></thead><tbody>' +
        D.stand.map(function (r) {
            return '<tr' + (isRBC(r.club) ? ' class="rbc"' : '') + '>' +
                   '<td class="pos">' + veilig(r.pos) + '</td>' +
                   '<td>' + veilig(r.club) + '</td>' +
                   '<td class="n">' + veilig(r.wed) + '</td>' +
                   '<td class="n">' + veilig(r.pnt) + '</td></tr>';
        }).join('') + '</tbody></table>');
}
async function stand() {
    const tb = standTabel(dom(await haal(STAND_URL)));
    if (!tb) throw new Error('geen tabel');
    const rijen = [];
    tb.querySelectorAll('tbody tr').forEach(function (r) {
        const c = [];
        r.querySelectorAll('th,td').forEach(function (e) {
            c.push(e.textContent.trim().replace(/\s+/g, ' '));
        });
        if (c.length < 5) return;
        // er komen twee kolomindelingen voor
        rijen.push(c.length >= 9
            ? { pos: c[0], club: c[1], wed: c[2], pnt: c[4] }
            : { pos: c[0], club: c[1], wed: c[2], pnt: c[9] || '' });
    });
    if (!rijen.length) throw new Error('leeg');
    D.stand = rijen;
    tekenStand();
}

/* ════════════════════════════════════════════════════════
   PROGRAMMA
   ════════════════════════════════════════════════════════ */
function tekenProgramma() {
    if (D.fout.programma) {
        zet('programma-inhoud', '<p class="wacht">' + veilig(t('stuk')(t('w_programma'))) + '</p>'); return;
    }
    if (!D.programma) { zet('programma-inhoud', '<p class="wacht">' + t('laden') + '</p>'); return; }
    if (!D.programma.length) {
        zet('programma-inhoud', '<p class="wacht">' + veilig(t('geen_duels')) + '</p>'); return;
    }
    zet('programma-inhoud', '<ul class="programma">' + D.programma.map(function (w) {
        return '<li' + (isRBC(w.thuis) || isRBC(w.uit) ? ' class="rbc"' : '') + '>' +
               '<span class="datum">' + veilig(w.datum) + ' &middot; ' + veilig(w.tijd) + '</span>' +
               '<span class="duel">' + veilig(w.thuis) + ' &ndash; ' + veilig(w.uit) + '</span></li>';
    }).join('') + '</ul>');
}
async function programma() {
    const doc = dom(await haal(PROGRAMMA_URL));
    const uit = [];
    doc.querySelectorAll('table.match,table[class*="match"]').forEach(function (tb) {
        const cap = tb.querySelector('caption time,caption');
        // "Wedstrijden op zondag 16 augustus 2026" -> "zondag 16 augustus"
        const datum = cap
            ? cap.textContent.trim().replace(/\s+/g, ' ')
                 .replace(/^wedstrijden op\s*/i, '')
                 .replace(/\s*20\d\d$/, '')
            : '';
        tb.querySelectorAll('tbody tr').forEach(function (row) {
            const c = row.querySelectorAll('td');
            if (c.length < 4) return;
            uit.push({
                datum: datum,
                thuis: c[0].textContent.trim().replace(/\s+/g, ' '),
                uit: c[2].textContent.trim().replace(/\s+/g, ' '),
                tijd: c[3].textContent.trim().replace(/\s+/g, ' ')
            });
        });
    });
    const eigen = uit.filter(function (w) { return isRBC(w.thuis) || isRBC(w.uit); });
    D.programma = (eigen.length ? eigen : uit).slice(0, 8);
    tekenProgramma();
}

/* ════════════════════════════════════════════════════════
   START
   ════════════════════════════════════════════════════════ */
function tekenAlles() {
    tekenSpelers(); tekenWedstrijd(); tekenStand();
    tekenUitslagen(); tekenProgramma();
}

})();

stand().catch(function () { D.fout.stand = true; tekenStand(); });
programma().catch(function () { D.fout.programma = true; tekenProgramma(); });
uitslagen().catch(function () { D.fout.uitslagen = true; tekenUitslagen(); });
