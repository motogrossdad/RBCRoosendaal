<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<meta name="description" content="Het bord van RBC Roosendaal. Houd de stand zelf bij, stuur hem door, en zoek elke speler op rugnummer. Werkt zonder bereik.">
<title>RBC Roosendaal — Het Bord</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ══════════════════════════════════════════════════════════════
   HET BORD
   Geen website met een scorebord erop: het scorebord ís de site.
   Alles wat verandert, klapt om — zoals op een echt vluchtbord.
   Twee knoppen onderaan, verder niets. De rest is bord.
   ══════════════════════════════════════════════════════════════ */

:root{
    --oranje:      #ff6a13;
    --oranje-diep: #d94f06;
    --been:        #f4ece1;   /* gebroken wit van de lamellen */
    --bord:        #14110f;
    --kast:        #0a0908;
    --lamel-b:     #2b2724;   /* bovenhelft */
    --lamel-o:     #232019;   /* onderhelft, iets donkerder */
    --naad:        rgba(0,0,0,.72);
    --dim:         #8b8178;
    --lijn:        rgba(244,236,225,.10);
    --klap:        110ms;     /* duur van één omslag */
    --schrift: ui-sans-serif, system-ui, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-reduced-motion: reduce){ :root{ --klap: 1ms } }

*{ box-sizing:border-box; margin:0; padding:0 }
html,body{ height:100%; overflow:hidden }
html{ background:var(--kast); -webkit-text-size-adjust:100% }
body{
    background:
        radial-gradient(120% 80% at 50% -10%, #23201d 0%, transparent 60%),
        radial-gradient(90% 60% at 50% 110%, #1d1a17 0%, transparent 55%),
        var(--kast);
    color:var(--been);
    font-family:var(--schrift);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
}
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation }
img{ display:block; max-width:100% }

/* ── de kast waar het bord in hangt ───────────────────────── */
.kamer{
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    padding:max(10px, env(safe-area-inset-top)) 10px 0;
    max-width:1180px; margin:0 auto; width:100%;
}
.bord{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column;
    background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px),
        linear-gradient(180deg, #1a1714, #100e0c);
    border:1px solid rgba(244,236,225,.09);
    border-radius:16px;
    box-shadow:
        0 0 0 1px rgba(0,0,0,.6),
        0 30px 70px -20px rgba(0,0,0,.9),
        inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;
    position:relative;
    min-height:0;
}
/* vier schroeven, zodat het bord een ding is en geen kaartje */
.bord::before,.bord::after{
    content:""; position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #4a443d, #16130f 70%);
    box-shadow:0 1px 0 rgba(255,255,255,.06); pointer-events:none; z-index:4;
}
.bord::before{ top:9px; left:9px } .bord::after{ top:9px; right:9px }

/* ── kop ──────────────────────────────────────────────────── */
.kop{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--lijn);
    background:linear-gradient(180deg, rgba(255,255,255,.035), transparent);
}
.lamp{
    width:9px; height:9px; border-radius:50%; flex:none;
    background:#3a332c; box-shadow:inset 0 0 3px rgba(0,0,0,.8);
}
.lamp.aan{ background:var(--oranje); box-shadow:0 0 10px 1px rgba(255,106,19,.8); animation:pols 1.6s infinite }
@keyframes pols{ 50%{ opacity:.45 } }
.kop-tekst{ flex:1 1 auto; min-width:0 }
.kop-tekst b{
    display:block; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--oranje); font-weight:800;
}
.kop-tekst span{
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    font-size:11px; line-height:1.45; letter-spacing:.13em; text-transform:uppercase;
    color:var(--dim); margin-top:3px;
}
.kop-knoppen{ display:flex; gap:6px; flex:none }
.pil{
    border:1px solid var(--lijn); border-radius:999px; padding:6px 11px;
    font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--dim);
    background:rgba(255,255,255,.03); line-height:1;
}
.pil:hover{ color:var(--been); border-color:rgba(244,236,225,.28) }
.pil[aria-pressed="true"]{ color:var(--bord); background:var(--oranje); border-color:var(--oranje) }

/* ── lamellen ─────────────────────────────────────────────── */
.regel{
    container-type:inline-size;
    display:grid; grid-template-columns:repeat(var(--n,6), 1fr);
    gap:var(--gat,2px); width:100%;
}
.flap{
    --cw: calc((100cqw - (var(--n) - 1) * var(--gat,2px)) / var(--n));
    --ch: calc(var(--cw) / .70);
    position:relative; aspect-ratio:.70; border-radius:3px;
    perspective:calc(var(--ch) * 3);
    background:var(--lamel-o);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.03);
    overflow:hidden;
}
.flap .h,.flap .k{
    position:absolute; left:0; right:0; height:50%; overflow:hidden;
    backface-visibility:hidden;
}
.flap .b,.flap .kb{ top:0; background:linear-gradient(180deg,#322d28,var(--lamel-b)); border-bottom:1px solid var(--naad) }
.flap .o,.flap .ko{ bottom:0; background:linear-gradient(180deg,var(--lamel-o),#1b1815) }
.flap .kb{ transform-origin:bottom; z-index:3 }
.flap .ko{ transform-origin:top; transform:rotateX(90deg); z-index:2 }
.flap i{
    display:block; height:var(--ch); line-height:var(--ch);
    font-size:calc(var(--ch) * .70); font-style:normal; font-weight:800;
    letter-spacing:-.02em; text-align:center; color:var(--been);
    font-variant-numeric:tabular-nums;
}
.flap .o i,.flap .ko i{ transform:translateY(-50%) }
.flap.draait .kb{ animation:valweg var(--klap) ease-in forwards }
.flap.draait .ko{ animation:valaan var(--klap) ease-out forwards }
@keyframes valweg{ 0%{transform:rotateX(0)} 50%,100%{transform:rotateX(-90deg)} }
@keyframes valaan{ 0%,50%{transform:rotateX(90deg)} 100%{transform:rotateX(0)} }
.regel.oranje .flap i{ color:var(--oranje) }
.regel.klein .flap i{ font-size:calc(var(--ch) * .62) }

/* ── scorebord ────────────────────────────────────────────── */
.scherm{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch }
.stand{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:start;
    gap:clamp(8px,3vw,26px); padding:clamp(14px,4vw,26px) clamp(12px,3vw,26px) 10px;
}
.zijde{ display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0 }
.zijde .naam{ width:100%; max-width:210px }
.tel{
    width:100%; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:8px 4px 6px; border-radius:14px; border:1px solid transparent;
    transition:background .12s, border-color .12s;
}
.tel:active{ background:rgba(255,106,19,.10); border-color:rgba(255,106,19,.35) }
.tel .cijfer{ width:100%; max-width:min(31vw, 148px) }
.wenk{
    text-align:center; font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:#6c635b; font-weight:800; padding:2px 12px 0;
}
.min{
    font-size:11px; letter-spacing:.12em; font-weight:700; color:#6c635b;
    padding:7px 16px; border-radius:999px; border:1px solid var(--lijn);
}
.min:hover{ color:var(--been) }
/* de klok hangt op de hoogte van de cijfers, de knopjes eronder */
.midden{ display:flex; flex-direction:column; align-items:center; gap:12px; padding-top:clamp(52px,17vw,104px) }
.klok{ width:clamp(50px,14vw,88px); position:relative }
.klok::after{
    content:"'"; position:absolute; left:calc(100% + 3px); top:2px;
    font-size:clamp(13px,3.4vw,18px); font-weight:900; color:var(--oranje);
    opacity:0; transition:opacity .3s;
}
.klok.loopt-al::after{ opacity:.75 }
.klok-knoppen{ display:flex; gap:6px }
.rond{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--lijn);
    display:grid; place-items:center; font-size:13px; color:var(--dim);
    background:rgba(255,255,255,.03);
}
.rond:hover{ color:var(--been); border-color:rgba(244,236,225,.3) }
.rond.speelt{ color:var(--oranje); border-color:rgba(255,106,19,.5) }

/* ── log ──────────────────────────────────────────────────── */
.log{ padding:4px clamp(12px,3vw,26px) 22px }
.streep{
    display:flex; align-items:center; gap:10px; margin:18px 0 12px;
    font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:#6c635b; font-weight:800;
}
.streep::after{ content:""; flex:1 1 auto; height:1px; background:var(--lijn) }
.doelpunten{ list-style:none; display:flex; flex-direction:column; gap:1px }
.doelpunten li{
    display:grid; grid-template-columns:52px 1fr auto; align-items:center; gap:12px;
    padding:11px 12px; border-radius:8px; background:rgba(255,255,255,.022);
    border-left:2px solid #3a332c;
}
.doelpunten li.eigen{ border-left-color:var(--oranje); background:rgba(255,106,19,.07) }
.doelpunten .m{ font-size:13px; font-weight:800; color:var(--dim); font-variant-numeric:tabular-nums }
.doelpunten li.eigen .m{ color:var(--oranje) }
.doelpunten .w{
    font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.doelpunten li:not(.eigen) .w{ color:var(--dim) }
.weg{ font-size:17px; color:#5c554e; padding:2px 8px; line-height:1 }
.weg:hover{ color:var(--oranje) }
.leeg{ font-size:13px; color:#6c635b; padding:14px 2px; letter-spacing:.03em }
.doelpunten li.leeg,.eerder li.leeg{ display:block; background:none; border-left:0; padding:14px 2px }
.eerder{ list-style:none; display:flex; flex-direction:column; gap:1px }
.eerder li{
    display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px;
    padding:11px 12px; border-radius:8px; background:rgba(255,255,255,.022);
    font-size:13px; letter-spacing:.04em;
}
.eerder .u{ font-weight:800; font-variant-numeric:tabular-nums; color:var(--been) }
.eerder .t{ color:var(--dim); text-transform:uppercase; font-size:12px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.mini{
    font-size:10px; font-weight:800; letter-spacing:.14em; color:var(--dim);
    border:1px solid var(--lijn); border-radius:999px; padding:6px 12px; text-transform:uppercase;
}
.mini:hover{ color:var(--oranje); border-color:rgba(255,106,19,.45) }
.nieuw{ margin-top:16px; width:100%; justify-content:center; display:flex }

/* ── de twee knoppen ──────────────────────────────────────── */
.balk{
    flex:none; display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:12px 0 calc(12px + env(safe-area-inset-bottom));
}
.groot{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    padding:16px 10px; border-radius:14px; min-height:66px;
    font-size:clamp(13px,3.6vw,15px); font-weight:900; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid transparent; line-height:1;
}
.groot small{ font-size:10px; font-weight:700; letter-spacing:.1em; opacity:.62; text-transform:none }
.groot.vol{ background:var(--oranje); color:#160e06; box-shadow:0 10px 26px -12px rgba(255,106,19,.85) }
.groot.vol:active{ background:var(--oranje-diep) }
.groot.leeg{ background:rgba(255,255,255,.04); border-color:var(--lijn); color:var(--been) }
.groot.leeg:active{ background:rgba(255,255,255,.09) }

/* ── lagen (rugnummer + wie scoorde) ──────────────────────── */
.laag{
    position:fixed; inset:0; z-index:40; display:none;
    background:rgba(8,7,6,.86); backdrop-filter:blur(14px);
    padding:max(10px, env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
}
.laag.aan{ display:flex; flex-direction:column; animation:opkomen .22s ease-out }
@keyframes opkomen{ from{ opacity:0; transform:translateY(12px) } }
.blad{
    flex:1 1 auto; display:flex; flex-direction:column; min-height:0; width:100%;
    max-width:560px; margin:0 auto;
    background:linear-gradient(180deg,#1a1714,#100e0c);
    border:1px solid rgba(244,236,225,.09); border-radius:16px; overflow:hidden;
}
.blad-kop{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    border-bottom:1px solid var(--lijn); flex:none;
}
.blad-kop b{ flex:1 1 auto; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--oranje) }
.sluit{ font-size:22px; line-height:1; color:var(--dim); padding:2px 6px }
.sluit:hover{ color:var(--been) }
.blad-lijf{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:14px }

/* ── het shirt ────────────────────────────────────────────── */
.shirt-vak{ display:flex; justify-content:center; padding:2px 0 8px }
.shirt{
    position:relative; width:min(58%, 218px); aspect-ratio:.86;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.6));
}
.doek{
    position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,
        var(--oranje) 0 11.5%, #f7f3ee 11.5% 23%);
    clip-path:polygon(
        32% 0%, 68% 0%,
        79% 3%, 100% 15%,
        90% 33%, 80% 27%,
        84% 100%, 16% 100%,
        20% 27%, 10% 33%,
        0% 15%, 21% 3%);
}
.kraag{
    position:absolute; left:50%; top:-2%; width:26%; height:11%;
    transform:translateX(-50%); border-radius:0 0 60% 60%;
    background:#14110f;
}
.rug-naam{ position:absolute; left:0; right:0; top:11%; height:26% }
.rug-naam text{ font-family:var(--schrift); font-weight:900; letter-spacing:.02em; fill:#17130f }
.rug-nr{
    position:absolute; left:0; right:0; top:32%; text-align:center;
    font-size:min(30cqw, 132px); font-weight:900; letter-spacing:-.04em; color:#17130f;
    line-height:1; font-variant-numeric:tabular-nums;
}
.shirt-vak{ container-type:inline-size }
.geen-shirt .doek{ background:repeating-linear-gradient(90deg,#2b2724 0 11.5%,#232019 11.5% 23%) }
.geen-shirt .rug-nr{ color:#4a443d }

/* ── spelerskaart ─────────────────────────────────────────── */
.kaart{ display:flex; gap:12px; align-items:center; padding:11px; border-radius:12px;
        background:rgba(255,255,255,.03); border:1px solid var(--lijn); margin-bottom:12px }
.kaart img{ width:58px; height:58px; border-radius:10px; object-fit:cover; flex:none;
            background:#221f1c; object-position:top center }
.kaart .wie{ min-width:0 }
.kaart .wie b{ display:block; font-size:16px; font-weight:900; letter-spacing:.02em;
               text-transform:uppercase; overflow:hidden; text-overflow:ellipsis }
.kaart .wie span{ display:block; font-size:12px; color:var(--dim); margin-top:3px; letter-spacing:.05em }
.feiten{ display:grid; grid-template-columns:1fr 1fr; gap:1px; border-radius:12px; overflow:hidden }
.feit{ background:rgba(255,255,255,.03); padding:12px 13px; min-height:60px }
.feit dt{ font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:#6c635b; font-weight:800 }
.feit dd{ font-size:14px; font-weight:700; margin-top:5px; letter-spacing:.02em }
.feit.breed{ grid-column:1 / -1 }

/* ── toetsen ──────────────────────────────────────────────── */
.toetsen{
    flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--lijn); background:rgba(0,0,0,.25);
}
.toets{
    padding:13px 0; border-radius:11px; font-size:21px; font-weight:800;
    background:rgba(255,255,255,.05); border:1px solid var(--lijn);
    font-variant-numeric:tabular-nums;
}
.toets:active{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.toets.stil{ font-size:12px; letter-spacing:.12em; font-weight:800; color:var(--dim) }

/* ── wie scoorde ──────────────────────────────────────────── */
.rooster{ display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px }
.speler{
    display:flex; flex-direction:column; align-items:center; gap:5px; padding:11px 5px;
    border-radius:11px; background:rgba(255,255,255,.035); border:1px solid var(--lijn);
    text-align:center;
}
.speler:active{ background:var(--oranje); color:#160e06; border-color:var(--oranje) }
.speler b{ font-size:20px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1 }
.speler span{ font-size:9.5px; letter-spacing:.04em; text-transform:uppercase; opacity:.72;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100% }

/* ── melding ──────────────────────────────────────────────── */
#melding{
    position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px); z-index:60; opacity:0; pointer-events:none;
    background:#f4ece1; color:#14110f; border-radius:999px; padding:10px 18px;
    font-size:12.5px; font-weight:800; letter-spacing:.04em; white-space:nowrap;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.8); transition:opacity .2s, transform .2s;
}
#melding.aan{ opacity:1; transform:translate(-50%,0) }

/* ── groot scherm ─────────────────────────────────────────── */
@media (min-width:820px){
    .kamer{ padding:22px 22px 0; justify-content:center }
    .bord{ flex:0 1 auto; max-height:calc(100dvh - 44px) }
    .stand{ padding:34px 40px 16px; gap:40px }
    .zijde .naam{ max-width:260px }
    .tel .cijfer{ max-width:180px }
    .log{ padding:0 40px 30px; display:grid; grid-template-columns:1fr 1fr; gap:0 34px; align-items:start }
    .log .kolom-a{ grid-column:1 } .log .kolom-b{ grid-column:2 }
    .balk{ max-width:520px; margin:0 auto }
    .groot{ min-height:74px }
}
@media (min-width:820px) and (max-height:760px){
    .stand{ padding:22px 40px 10px }
    .tel .cijfer{ max-width:140px }
}
</style>
</head>
<body>

<div class="kamer">
    <main class="bord">
        <div class="kop">
            <span class="lamp" id="lamp" aria-hidden="true"></span>
            <div class="kop-tekst">
                <b id="kop-titel">RBC ROOSENDAAL</b>
                <span id="kop-sub"></span>
            </div>
            <div class="kop-knoppen">
                <button class="pil" id="knop-geluid" aria-pressed="true" title="geluid">♪</button>
                <button class="pil" id="knop-taal">EN</button>
            </div>
        </div>

        <div class="scherm">
            <section class="stand">
                <div class="zijde">
                    <div class="regel naam" id="naam-rbc" style="--n:3"></div>
                    <button class="tel" id="tel-rbc" aria-label="doelpunt RBC">
                        <span class="regel cijfer oranje" id="score-rbc" style="--n:1"></span>
                    </button>
                    <button class="min" id="min-rbc">−1</button>
                </div>

                <div class="midden">
                    <div class="regel klok klein" id="klok" style="--n:2"></div>
                    <div class="klok-knoppen">
                        <button class="rond" id="klok-start" aria-label="klok">▶</button>
                        <button class="rond" id="klok-nul" aria-label="klok op nul">↺</button>
                    </div>
                </div>

                <div class="zijde">
                    <div class="regel naam" id="naam-tegen" style="--n:3"></div>
                    <button class="tel" id="tel-tegen" aria-label="doelpunt tegenpartij">
                        <span class="regel cijfer" id="score-tegen" style="--n:1"></span>
                    </button>
                    <button class="min" id="min-tegen">−1</button>
                </div>
            </section>
            <p class="wenk" id="wenk">tik op een cijfer = doelpunt</p>

            <section class="log">
                <div class="kolom-a">
                    <h2 class="streep" id="kop-verloop">verloop</h2>
                    <ul class="doelpunten" id="verloop"></ul>
                </div>
                <div class="kolom-b">
                    <h2 class="streep" id="kop-eerder">eerder</h2>
                    <ul class="eerder" id="eerder"></ul>
                    <div class="nieuw"><button class="mini" id="knop-nieuw">nieuwe wedstrijd</button></div>
                </div>
            </section>
        </div>
    </main>

    <nav class="balk">
        <button class="groot vol" id="knop-stuur">
            <span id="lab-stuur">stuur stand</span>
            <small id="sub-stuur">als bord‑plaatje</small>
        </button>
        <button class="groot leeg" id="knop-nummer">

["Curacao","Netherlands"],"vorige_club":"RVVH Ridderkerk U19"},{"number":24,"name":"Leonardo Rocha de Almeida","nationality":"CV","photo":"players/leonardo-rocha-de-almeida.jpg","positie":"Right-Back","leeftijd":23,"nationaliteiten":["Netherlands","Cape Verde"]}],"squad_bijgewerkt":"2026-08-09"}</script>

<script>
"use strict";

/* ════════════════════════════════════════════════════════
   0. GEREEDSCHAP
   ════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const veilig = s => String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const OPSLAG = {
    lees(k, standaard) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : standaard; } catch (e) { return standaard; } },
    schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const RUSTIG = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Accenten eruit: op een lamellenbord bestaat alleen de rol met
   hoofdletters. Gláucio wordt GLAUCIO. */
function plat(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}

/* ════════════════════════════════════════════════════════
   1. TAAL
   ════════════════════════════════════════════════════════ */
const TEKST = {
    nl: {
        tik: 'tik op een cijfer = doelpunt', verloop: 'verloop', eerder: 'eerder',
        verloop_leeg: 'Nog niet gescoord. Tik op een cijfer.',
        eerder_leeg: 'Nog geen bewaarde wedstrijden.',
        nieuw: 'nieuwe wedstrijd', stuur: 'stuur stand', stuur_sub: 'als bord‑plaatje',
        nummer: 'rugnummer', nummer_sub: 'wie is nummer …',
        wie_nummer: 'wie is nummer', wie_scoorde: 'wie scoorde',
        onbekend: 'onbekend — sla over', geen: 'geen speler met dit nummer',
        positie: 'positie', leeftijd: 'leeftijd', paspoort: 'paspoort', vorige: 'vorige club',
        jaar: 'jaar', onbekende_speler: 'RBC', tegenpartij: 'tegenpartij',
        gekopieerd: 'stand gekopieerd', plaatje: 'bord‑plaatje klaar',
        opgeslagen: 'wedstrijd bewaard', offline: 'geen bereik — bord werkt gewoon door',
        nieuwe_versie: 'nieuwe versie — tik om te verversen', deel: 'stuur',
        uit_bij: 'uit bij', thuis_tegen: 'thuis tegen', bijgewerkt: 'selectie bijgewerkt'
    },
    en: {
        tik: 'tap a digit = goal', verloop: 'timeline', eerder: 'earlier',
        verloop_leeg: 'No goals yet. Tap a digit.',
        eerder_leeg: 'No saved matches yet.',
        nieuw: 'new match', stuur: 'send score', stuur_sub: 'as a board image',
        nummer: 'shirt number', nummer_sub: 'who is number …',
        wie_nummer: 'who is number', wie_scoorde: 'who scored',
        onbekend: 'unknown — skip', geen: 'no player with this number',
        positie: 'position', leeftijd: 'age', paspoort: 'passport', vorige: 'previous club',
        jaar: 'years', onbekende_speler: 'RBC', tegenpartij: 'opponent',
        gekopieerd: 'score copied', plaatje: 'board image ready',
        opgeslagen: 'match saved', offline: 'no signal — the board carries on',
        nieuwe_versie: 'new version — tap to refresh', deel: 'send',
        uit_bij: 'away at', thuis_tegen: 'home to', bijgewerkt: 'squad updated'
    }
};
const POSITIES = {
    'Goalkeeper': ['Doelman', 'Goalkeeper'],
    'Defender': ['Verdediger', 'Defender'],
    'Centre-Back': ['Centrale verdediger', 'Centre-back'],
    'Left-Back': ['Linksback', 'Left-back'],
    'Right-Back': ['Rechtsback', 'Right-back'],
    'Defensive Midfield': ['Verdedigende middenvelder', 'Defensive midfield'],
    'Central Midfield': ['Middenvelder', 'Central midfield'],
    'Attacking Midfield': ['Aanvallende middenvelder', 'Attacking midfield'],
    'Midfielder': ['Middenvelder', 'Midfielder'],
    'Left Winger': ['Linksbuiten', 'Left winger'],
    'Right Winger': ['Rechtsbuiten', 'Right winger'],
    'Centre-Forward': ['Spits', 'Centre-forward'],
    'Striker': ['Spits', 'Striker']
};
let TAAL = OPSLAG.lees('rbc-taal', null) ||
    ((navigator.language || 'nl').toLowerCase().startsWith('nl') ? 'nl' : 'en');
const t = k => (TEKST[TAAL] && TEKST[TAAL][k]) || TEKST.nl[k] || k;

/* ════════════════════════════════════════════════════════
   2. DE LAMEL
   Twee statische helften en twee kleppen. De bovenklep valt weg
   en laat de nieuwe bovenhelft zien, de onderklep valt erop.
   Eén omslag is één letter verder op de rol — precies zoals een
   echt bord, alleen springt hij bij een grote afstand vooruit
   zodat je niet het hele alfabet hoeft af te wachten.
   ════════════════════════════════════════════════════════ */
const ROL_TEKST = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-'&/:";
const ROL_CIJFER = " 0123456789";
const MAX_STAPPEN = 5;

function route(van, naar, rol) {
    const n = rol.length;
    let i = rol.indexOf(van); const j = rol.indexOf(naar);
    if (i < 0) i = 0;
    if (j < 0) return [];
    let d = (j - i + n) % n;
    const pad = [];
    if (d > MAX_STAPPEN) { i = (j - MAX_STAPPEN + n) % n; d = MAX_STAPPEN; pad.push(rol[i]); }
    for (let k = 1; k <= d; k++) pad.push(rol[(i + k) % n]);
    return pad;
}

function maakLamel(rol) {
    const el = document.createElement('span');
    el.className = 'flap';
    el.innerHTML = '<span class="h b"><i></i></span><span class="h o"><i></i></span>' +
                   '<span class="k kb"><i></i></span><span class="k ko"><i></i></span>';
    const i = el.querySelectorAll('i');
    const [boven, onder, klepB, klepO] = i;
    let huidig = ' ', beurt = 0, klok = null;

    function vast(c) { boven.textContent = onder.textContent = klepB.textContent = klepO.textContent = c; huidig = c; }
    vast(' ');

    function omslag(volgende, klaar) {
        boven.textContent = volgende;   /* komt tevoorschijn onder de vallende klep */
        onder.textContent = huidig;     /* blijft staan tot de onderklep landt */
        klepB.textContent = huidig;
        klepO.textContent = volgende;
        el.classList.remove('draait'); void el.offsetWidth; el.classList.add('draait');
        klik();
        klok = setTimeout(function () {
            el.classList.remove('draait');
            vast(volgende);
            klaar && klaar();
        }, RUSTIG ? 1 : 110);
    }

    function zet(doel, wacht) {
        doel = (doel == null || doel === '') ? ' ' : String(doel).charAt(0);
        if (rol.indexOf(doel) < 0) doel = ' ';
        if (doel === huidig) return;
        const mijn = ++beurt;
        clearTimeout(klok);
        if (RUSTIG) { vast(doel); return; }
        const pad = route(huidig, doel, rol);
        setTimeout(function volgende() {
            if (mijn !== beurt) return;
            const v = pad.shift();
            if (v === undefined) return;
            omslag(v, function () { if (mijn === beurt) volgende(); });
        }, wacht || 0);
    }
    return { el, zet };
}

/* Een rij lamellen die samen een woord tonen. */
function maakRegel(houder, aantal, rol) {
    houder.style.setProperty('--n', aantal);
    houder.innerHTML = '';
    const cellen = [];
    for (let k = 0; k < aantal; k++) {
        const c = maakLamel(rol || ROL_TEKST);
        houder.appendChild(c.el);
        cellen.push(c);
    }
    return {
        zet(tekst, midden) {
            let s = plat(tekst);
            if (s.length > aantal) s = s.slice(0, aantal);
            if (midden) {
                const links = Math.floor((aantal - s.length) / 2);
                s = ' '.repeat(links) + s;
            }
            s = s.padEnd(aantal, ' ');
            for (let k = 0; k < aantal; k++) cellen[k].zet(s[k], k * 35);
        }
    };
}

/* ════════════════════════════════════════════════════════
   3. HET GELUID
   Een lamellenbord klinkt. Ruis door een smalle band, heel kort:
   dat is de klik. Geen bestandje nodig, dus ook offline.
   ════════════════════════════════════════════════════════ */
let GELUID = OPSLAG.lees('rbc-geluid', true);
let ac = null, laatsteKlik = 0, klikkenDitSeconde = 0, seconde = 0;
function klik() {
    if (!GELUID || RUSTIG) return;
    const nu = Date.now();
    const s = Math.floor(nu / 1000);
    if (s !== seconde) { seconde = s; klikkenDitSeconde = 0; }
    if (klikkenDitSeconde > 9 || nu - laatsteKlik < 22) return;
    klikkenDitSeconde++; laatsteKlik = nu;
    try {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        const n = 0.035, sr = ac.sampleRate, buf = ac.createBuffer(1, sr * n, sr);
        const d = buf.getChannelData(0);
        for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / d.length, 5);
        const bron = ac.createBufferSource(); bron.buffer = buf;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 1500 + Math.random() * 500; bp.Q.value = 1.4;
        const g = ac.createGain(); g.gain.value = 0.10;
        bron.connect(bp); bp.connect(g); g.connect(ac.destination);
        bron.start();
    } catch (e) { GELUID = false; }
}

/* ════════════════════════════════════════════════════════
   4. GEGEVENS
   ════════════════════════════════════════════════════════ */
const D = { squad: [], bijgewerkt: null, volgende: null };
let W = null;   /* de lopende wedstrijd */

function afkorting(naam) {
    /* Drie lamellen, dus drie letters. Voorvoegsels als RKSV zeggen
       niets, die vallen af; daarna telt het eerste echte woord.
       RKSV GROENE STER wordt GRO, NAC BREDA wordt NAC. */
    const s = plat(naam).replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean)
        .filter(w => !['SC', 'VV', 'FC', 'RKSV', 'SV', 'AFC', 'RKVV', 'VVV', 'DE', 'VAN'].includes(w));
    if (!s.length) return '???';
    if (s[0].length >= 3) return s[0].slice(0, 3);
    return (s.join('') + '  ').slice(0, 3);
}
function tegenstanderVan(m) {
    if (!m) return '';
    const thuis = /rbc/i.test(m.home_team || '');
    return (thuis ? m.away_team : m.home_team) || '';
}
function nieuweWedstrijd(tegen) {
    W = { rbc: 0, hen: 0, tegen: tegen || '', doelpunten: [], start: null, gestopt: 0, sinds: Date.now() };
    bewaar();
}
function bewaar() { OPSLAG.schrijf('rbc-wedstrijd', W); }
function historie() { return OPSLAG.lees('rbc-historie', []); }
function bewaarHistorie(l) { OPSLAG.schrijf('rbc-historie', l.slice(0, 12)); }

/* ════════════════════════════════════════════════════════
   5. KLOK
   Voetbal telt vanaf de eerste minuut: de eerste zestig
   seconden zijn minuut 1, niet minuut 0.
   ════════════════════════════════════════════════════════ */
function verstreken() {
    if (!W) return 1;
    return Math.floor((W.gestopt + (W.start ? Date.now() - W.start : 0)) / 60000) + 1;
}
function loopt() { return !!(W && W.start); }
function minuutNu() { return (W && (W.start || W.gestopt)) ? String(verstreken()) : ''; }

let regelKlok, regelScoreRbc, regelScoreTegen, regelNaamRbc, regelNaamTegen;

function tekenKlok() {
    const aan = loopt();
    $('lamp').classList.toggle('aan', aan);
    $('klok-start').textContent = aan ? '❚❚' : '▶';
    $('klok-start').classList.toggle('speelt', aan);
    const bezig = !!(W && (W.start || W.gestopt));
    $('klok').classList.toggle('loopt-al', bezig);
    regelKlok.zet(bezig ? String(verstreken()).padStart(2, ' ') : '');
}
setInterval(function () { if (loopt()) tekenKlok(); }, 10000);

/* ════════════════════════════════════════════════════════
   6. HET BORD TEKENEN
   ════════════════════════════════════════════════════════ */
function tekenBord() {
    if (!W) nieuweWedstrijd(tegenstanderVan(D.volgende));
    regelNaamRbc.zet('RBC');
    regelNaamTegen.zet(W.tegen ? afkorting(W.tegen) : '???');
    zetStand($('score-rbc'), 'rbc', W.rbc);
    zetStand($('score-tegen'), 'hen', W.hen);
    tekenKlok();
    tekenVerloop();
}

/* Eén lamel toont één cijfer. Wordt het er tien of meer — het
   gebeurt zelden, maar een verkeerd doorgestuurde stand is erger
   dan een extra lamel — dan komt er een lamel bij. */
const lamellenVoor = { rbc: 1, hen: 1 };
function zetStand(houder, kant, waarde) {
    const tekst = String(waarde);
    if (tekst.length !== lamellenVoor[kant]) {
        lamellenVoor[kant] = tekst.length;
        const nieuw = maakRegel(houder, tekst.length, ROL_CIJFER);
        if (kant === 'rbc') regelScoreRbc = nieuw; else regelScoreTegen = nieuw;
    }
    (kant === 'rbc' ? regelScoreRbc : regelScoreTegen).zet(tekst);
}

function tekenVerloop() {
    const l = $('verloop');
    if (!W.doelpunten.length) {
        l.innerHTML = '<li class="leeg">' + veilig(t('verloop_leeg')) + '</li>';
        return;
    }
    l.innerHTML = W.doelpunten.map(function (d, i) {
        const wie = d.eigen ? (d.naam || t('onbekende_speler')) : (W.tegen || t('tegenpartij'));
        return '<li class="' + (d.eigen ? 'eigen' : '') + '">' +
            '<span class="m">' + (d.minuut ? veilig(d.minuut) + "'" : '—') + '</span>' +
            '<span class="w">' + veilig(wie) + '</span>' +
            '<button class="weg" data-i="' + i + '" aria-label="verwijderen">×</button></li>';
    }).join('');
    l.querySelectorAll('.weg').forEach(function (b) {
        b.addEventListener('click', function () {
            const i = +b.dataset.i, d = W.doelpunten[i];
            if (!d) return;
            if (d.eigen) W.rbc = Math.max(0, W.rbc - 1); else W.hen = Math.max(0, W.hen - 1);
            W.doelpunten.splice(i, 1);
            bewaar(); tekenBord();
        });
    });
}

function tekenEerder() {
    const l = $('eerder'), h = historie();
    if (!h.length) { l.innerHTML = '<li class="leeg">' + veilig(t('eerder_leeg')) + '</li>'; return; }
    l.innerHTML = h.map(function (m, i) {
        return '<li><span class="t">RBC – ' + veilig(m.tegen || '—') + '</span>' +
            '<span class="u">' + veilig(m.rbc) + '–' + veilig(m.hen) + '</span>' +
            '<button class="mini" data-deel="' + i + '">' + veilig(t('deel')) + '</button></li>';
    }).join('');
    l.querySelectorAll('[data-deel]').forEach(function (b) {
        b.addEventListener('click', function () { stuur(historie()[+b.dataset.deel]); });
    });
}

function tekenKop() {
    const m = D.volgende;
    if (!m || !m.home_team) { $('kop-sub').textContent = ''; return; }
    const thuis = /rbc/i.test(m.home_team || '');
    const wie = thuis ? m.away_team : m.home_team;
    $('kop-sub').textContent = [(thuis ? t('thuis_tegen') : t('uit_bij')) + ' ' + wie,
                               m.status, m.competition].filter(Boolean).join('  ·  ');
}

/* ════════════════════════════════════════════════════════
   7. SCOREN
   ════════════════════════════════════════════════════════ */
function scoor(eigen) {
    if (!W) nieuweWedstrijd(tegenstanderVan(D.volgende));
    if (eigen) W.rbc++; else W.hen++;
    W.doelpunten.push({ eigen: eigen, minuut: minuutNu(), naam: '' });
    bewaar(); tekenBord();
    if (navigator.vibrate) { try { navigator.vibrate(eigen ? [14, 40, 14] : 10); } catch (e) {} }
    if (eigen) openScorer(W.doelpunten.length - 1);
}
function terug(eigen) {
    if (!W) return;
    for (let i = W.doelpunten.length - 1; i >= 0; i--) {
        if (!!W.doelpunten[i].eigen === !!eigen) { W.doelpunten.splice(i, 1); break; }
    }
    if (eigen) W.rbc = Math.max(0, W.rbc - 1); else W.hen = Math.max(0, W.hen - 1);
    bewaar(); tekenBord();
}

/* ════════════════════════════════════════════════════════
   8. LAGEN
   ════════════════════════════════════════════════════════ */
function open(id) { $(id).classList.add('aan'); }
function dicht(id) { $(id).classList.remove('aan'); }
document.querySelectorAll('[data-sluit]').forEach(function (b) {
    b.addEventListener('click', function () { dicht(b.dataset.sluit); });
});
document.querySelectorAll('.laag').forEach(function (l) {
    l.addEventListener('click', function (e) { if (e.target === l) dicht(l.id); });
});

/* — wie scoorde — */
let scorerVoor = -1;
function openScorer(i) {
    scorerVoor = i;
    const r = $('scorer-rooster');
    r.innerHTML = D.squad.map(function (p) {
        return '<button class="speler" data-nr="' + veilig(p.number) + '">' +
            '<b>' + veilig(p.number) + '</b><span>' + veilig(kortNaam(p.name)) + '</span></button>';
    }).join('') || '<p class="leeg">—</p>';
    r.querySelectorAll('[data-nr]').forEach(function (b) {
        b.addEventListener('click', function () {
            const p = D.squad.find(x => String(x.number) === b.dataset.nr);
            if (p && W.doelpunten[scorerVoor]) { W.doelpunten[scorerVoor].naam = p.name; bewaar(); tekenVerloop(); }
            dicht('laag-scorer');
        });
    });
    open('laag-scorer');
}
$('scorer-onbekend').addEventListener('click', function () { dicht('laag-scorer'); });
function kortNaam(n) {
    const d = String(n || '').trim().split(/\s+/);
    return d.length > 1 ? d[d.length - 1] : (d[0] || '');
}

/* — rugnummer — */
let getikt = '';
function openNummer() { getikt = ''; tekenShirt(); open('laag-nummer'); }
function toetsAan(c) {
    if (c === 'wis') getikt = getikt.slice(0, -1);
    else if (getikt.length < 2) getikt += c;
    else getikt = c;
    tekenShirt();
}
(function bouwToetsen() {
    const k = $('toetsen');
    ['1','2','3','4','5','6','7','8','9','wis','0','sluit'].forEach(function (c) {
        const b = document.createElement('button');
        b.className = 'toets' + (c === 'wis' || c === 'sluit' ? ' stil' : '');
        b.textContent = c === 'wis' ? '⌫' : (c === 'sluit' ? '✕' : c);
        b.addEventListener('click', function () {
            if (c === 'sluit') { dicht('laag-nummer'); return; }
            toetsAan(c);
        });
        k.appendChild(b);
    });
})();

function tekenShirt() {
    const nr = getikt;
    const p = nr ? D.squad.find(x => String(x.number) === String(+nr)) : null;
    $('rug-nr').textContent = nr || '—';
    $('shirt').classList.toggle('geen-shirt', !!nr && !p);

    const naam = p ? plat(kortNaam(p.name)) : '';
    const tp = $('boog-tekst').querySelector('textPath');
    tp.textContent = naam;
    /* lange namen passen niet op de boog: dan kleiner zetten */
    /* Een naam op een shirt loopt nooit over de mouwen. Eerst een
       schatting, daarna één correctie op de echt gemeten breedte —
       zo past BOUYAGHLAFEN net zo goed als YU. */
    const boog = $('boog-tekst');
    const lengte = $('boog').getTotalLength() * 0.92;
    let fs = Math.max(13, Math.min(27, lengte / Math.max(naam.length, 1) / 0.68));
    boog.setAttribute('font-size', String(fs));
    try {
        const nu = tp.getComputedTextLength();
        if (nu > lengte) boog.setAttribute('font-size', String(Math.max(11, fs * lengte / nu)));
    } catch (e) {}

    const uit = $('speler-uit');
    if (!nr) { uit.innerHTML = ''; return; }
    if (!p) { uit.innerHTML = '<p class="leeg">' + veilig(t('geen')) + '</p>'; return; }

    const pos = POSITIES[p.positie] ? POSITIES[p.positie][TAAL === 'nl' ? 0 : 1] : (p.positie || '—');
    const vlaggen = (p.nationaliteiten || []).map(vlagVan).filter(Boolean).join(' ');
    uit.innerHTML =
        '<div class="kaart">' +
            (p.photo ? '<img src="' + veilig(p.photo) + '" alt="" loading="lazy">' : '') +
            '<div class="wie"><b>' + veilig(p.name) + '</b><span>#' + veilig(p.number) + ' · ' + veilig(pos) + '</span></div>' +
        '</div>' +
        '<dl class="feiten">' +
            feit(t('positie'), pos) +
            feit(t('leeftijd'), p.leeftijd ? p.leeftijd + ' ' + t('jaar') : '—') +
            feit(t('paspoort'), (vlaggen || '') + ' ' + (p.nationaliteiten || []).join(', '), true) +
            (p.vorige_club ? feit(t('vorige'), p.vorige_club, true) : '') +
        '</dl>';
}
function feit(k, v, breed) {
    return '<div class="feit' + (breed ? ' breed' : '') + '"><dt>' + veilig(k) + '</dt><dd>' + veilig(v) + '</dd></div>';
}
const LANDCODE = { Netherlands: 'NL', Morocco: 'MA', Belgium: 'BE', Ghana: 'GH', Angola: 'AO',
                   Curacao: 'CW', 'Cape Verde': 'CV', Suriname: 'SR', Turkey: 'TR', Germany: 'DE' };
function vlagVan(land) {
    const c = LANDCODE[land];
    if (!c) return '';
    return String.fromCodePoint(...c.split('').map(x => 0x1F1E6 + x.charCodeAt(0) - 65));
}

/* ════════════════════════════════════════════════════════
   9. STUREN
   Eerst als plaatje: een bord‑plaatje in de groepsapp zegt meer
   dan "2-1". Lukt dat niet, dan gewoon de tekst.
   ════════════════════════════════════════════════════════ */
function tekstVan(m) {
    const r = ['RBC ' + m.rbc + ' - ' + m.hen + (m.tegen ? '  ' + m.tegen : '')];
    if (m.doelpunten && m.doelpunten.length) {
        r.push('');
        m.doelpunten.forEach(function (d) {
            const wie = d.eigen ? (d.naam || 'RBC') : (m.tegen || '—');
            r.push((d.minuut ? d.minuut + "'" : '') + '  ' + wie);
        });
    }
    r.push('', 'rbcroosendaal.com');
    return r.join('\n');
}

function bordPlaatje(m) {
    const S = 1080, c = document.createElement('canvas');
    c.width = S; c.height = S;
    const x = c.getContext('2d');
    const F = '900 %spx ' + 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

    x.fillStyle = '#0a0908'; x.fillRect(0, 0, S, S);
    x.fillStyle = '#161310';
    rond(x, 44, 44, S - 88, S - 88, 34); x.fill();
    x.strokeStyle = 'rgba(244,236,225,.10)'; x.lineWidth = 2;
    rond(x, 44, 44, S - 88, S - 88, 34); x.stroke();

    /* kop */
    x.fillStyle = '#ff6a13'; x.font = F.replace('%s', '26'); x.textAlign = 'center';
    x.fillText(sperr('RBC ROOSENDAAL'), S / 2, 132);
    x.fillStyle = '#8b8178'; x.font = '700 21px system-ui, sans-serif';
    const kop = [(D.volgende && D.volgende.competition) || '', minuutNu() ? minuutNu() + "'" : '']
        .filter(Boolean).join('   ·   ');
    if (kop) x.fillText(sperr(kop.toUpperCase()), S / 2, 176);

    /* lamellen met de stand */
    const nRbc = String(m.rbc), nHen = String(m.hen);
    const bw = 168, bh = 232, y = 250;
    lamel(x, S / 2 - bw - 26, y, bw, bh, nRbc, '#ff6a13');
    lamel(x, S / 2 + 26, y, bw, bh, nHen, '#f4ece1');
    x.fillStyle = '#4a443d'; x.font = F.replace('%s', '64');
    x.fillText('–', S / 2, y + bh / 2 + 22);

    /* teamnamen: elk naar zijn eigen kant, zodat een lange
       clubnaam nooit over RBC heen valt */
    x.font = F.replace('%s', '30'); x.fillStyle = '#f4ece1';
    x.textAlign = 'right';
    x.fillText(sperr('RBC'), S / 2 - 30, y + bh + 62);
    x.fillStyle = '#8b8178'; x.textAlign = 'left';
    x.font = F.replace('%s', '26');
    x.fillText(sperr(plat(m.tegen || '\u2014').slice(0, 18)), S / 2 + 30, y + bh + 62);

    /* doelpunten */
    let ly = y + bh + 132;
    x.textAlign = 'left';
    if (!(m.doelpunten || []).length) {
        x.textAlign = 'center'; x.fillStyle = '#5c554e';
        x.font = '800 24px system-ui, sans-serif';
        x.fillText(sperr(TAAL === 'nl' ? 'NOG GEEN DOELPUNTEN' : 'NO GOALS YET'), S / 2, ly);
        x.textAlign = 'left';
    }
    (m.doelpunten || []).slice(0, 7).forEach(function (d) {
        x.fillStyle = d.eigen ? '#ff6a13' : '#5c554e';
        x.fillRect(150, ly - 26, 5, 36);
        x.font = '800 26px system-ui, sans-serif';
        x.fillStyle = d.eigen ? '#ff6a13' : '#8b8178';
        x.fillText(d.minuut ? d.minuut + "'" : '—', 176, ly);
        x.fillStyle = d.eigen ? '#f4ece1' : '#8b8178';
        x.fillText(plat(d.eigen ? (d.naam || 'RBC') : (m.tegen || '—')).slice(0, 26), 254, ly);
        ly += 52;
    });

    x.textAlign = 'center'; x.fillStyle = '#ff6a13';
    x.font = '800 22px system-ui, sans-serif';
    x.fillText(sperr('RBCROOSENDAAL.COM'), S / 2, S - 92);

    return new Promise(function (res) { c.toBlob(res, 'image/png'); });
}
function sperr(s) { return String(s).split('').join(' '); }
function rond(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
    x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}
function lamel(x, l, t, w, h, tekst, kleur) {
    const g = x.createLinearGradient(0, t, 0, t + h);
    g.addColorStop(0, '#332e28'); g.addColorStop(.5, '#2b2724');
    g.addColorStop(.5001, '#232019'); g.addColorStop(1, '#1b1815');
    x.fillStyle = g; rond(x, l, t, w, h, 10); x.fill();
    x.strokeStyle = 'rgba(0,0,0,.7)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(l, t + h / 2); x.lineTo(l + w, t + h / 2); x.stroke();
    x.fillStyle = kleur; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '900 ' + Math.round(h * .72) + 'px system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
    x.fillText(tekst, l + w / 2, t + h * .52);
    x.textBaseline = 'alphabetic';
}

async function stuur(m) {
    m = m || W;
    if (!m) return;
    const tekst = tekstVan(m);
    try {
        const blob = await bordPlaatje(m);
        if (blob) {
            const bestand = new File([blob], 'rbc-' + m.rbc + '-' + m.hen + '.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [bestand] })) {
                await navigator.share({ files: [bestand], text: tekst });
                return;
            }
        }
    } catch (e) { if (e && e.name === 'AbortError') return; }

    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
        await navigator.clipboard.writeText(tekst);
        meld(t('gekopieerd'));
        window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
    } catch (e) {
        window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
    }
}

/* ════════════════════════════════════════════════════════
   10. MELDING
   ════════════════════════════════════════════════════════ */
let meldKlok = null;
function meld(s, blijf) {
    const el = $('melding');
    el.textContent = s; el.classList.add('aan');
    clearTimeout(meldKlok);
    if (!blijf) meldKlok = setTimeout(function () { el.classList.remove('aan'); }, 2600);
}

/* ════════════════════════════════════════════════════════
   11. TAAL ZETTEN
   ════════════════════════════════════════════════════════ */
function zetTaal(nieuw) {
    TAAL = nieuw; OPSLAG.schrijf('rbc-taal', nieuw);
    document.documentElement.lang = nieuw;
    $('knop-taal').textContent = nieuw === 'nl' ? 'EN' : 'NL';
    $('wenk').textContent = t('tik');
    $('kop-verloop').textContent = t('verloop');
    $('kop-eerder').textContent = t('eerder');
    $('knop-nieuw').textContent = t('nieuw');
    $('lab-stuur').textContent = t('stuur');
    $('sub-stuur').textContent = t('stuur_sub');
    $('lab-nummer').textContent = t('nummer');
    $('sub-nummer').textContent = t('nummer_sub');
    $('kop-nummer').textContent = t('wie_nummer');
    $('kop-scorer').textContent = t('wie_scoorde');
    $('scorer-onbekend').textContent = t('onbekend');
    tekenKop(); tekenVerloop(); tekenEerder();
    if ($('laag-nummer').classList.contains('aan')) tekenShirt();
}

/* ════════════════════════════════════════════════════════
   12. KNOPPEN
   ════════════════════════════════════════════════════════ */
$('tel-rbc').addEventListener('click', () => scoor(true));
$('tel-tegen').addEventListener('click', () => scoor(false));
$('min-rbc').addEventListener('click', () => terug(true));
$('min-tegen').addEventListener('click', () => terug(false));
$('klok-start').addEventListener('click', function () {
    if (!W) nieuweWedstrijd(tegenstanderVan(D.volgende));
    if (W.start) { W.gestopt += Date.now() - W.start; W.start = null; }
    else { W.start = Date.now(); }
    bewaar(); tekenKlok();
});
$('klok-nul').addEventListener('click', function () {
    if (!W) return; W.start = null; W.gestopt = 0; bewaar(); tekenKlok();
});
$('knop-stuur').addEventListener('click', function () { stuur(W); });
$('knop-nummer').addEventListener('click', openNummer);
$('knop-taal').addEventListener('click', function () { zetTaal(TAAL === 'nl' ? 'en' : 'nl'); });
$('knop-geluid').addEventListener('click', function () {
    GELUID = !GELUID; OPSLAG.schrijf('rbc-geluid', GELUID);
    this.setAttribute('aria-pressed', GELUID ? 'true' : 'false');
    this.textContent = GELUID ? '♪' : '♪̸';
    if (GELUID) klik();
});
$('knop-nieuw').addEventListener('click', function () {
    if (W && (W.rbc || W.hen || W.gestopt || W.start)) {
        const l = historie();
        l.unshift({ rbc: W.rbc, hen: W.hen, tegen: W.tegen, doelpunten: W.doelpunten, sinds: W.sinds });
        bewaarHistorie(l);
        meld(t('opgeslagen'));
    }
    nieuweWedstrijd(tegenstanderVan(D.volgende));
    tekenBord(); tekenEerder();
});

/* toetsenbord op de laptop */
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { dicht('laag-nummer'); dicht('laag-scorer'); return; }
    if ($('laag-nummer').classList.contains('aan')) {
        if (/^[0-9]$/.test(e.key)) { toetsAan(e.key); e.preventDefault(); }
        if (e.key === 'Backspace') { toetsAan('wis'); e.preventDefault(); }
        return;
    }
    if ($('laag-scorer').classList.contains('aan')) return;
    if (e.key === ' ') { $('klok-start').click(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') scoor(true);
    if (e.key === 'ArrowRight') scoor(false);
});

/* ════════════════════════════════════════════════════════
   13. START
   Eerst tekenen met wat we al hebben — ingebouwd of uit de
   opslag — en pas daarna het net op. Zo staat het bord er
   meteen, ook zonder bereik.
   ════════════════════════════════════════════════════════ */
function vulUit(m) {
    if (!m) return;
    D.squad = (m.squad || []).slice().sort((a, b) => a.number - b.number);
    D.bijgewerkt = m.squad_bijgewerkt || null;
    D.volgende = m.match || null;
}

(function () {
    regelNaamRbc = maakRegel($('naam-rbc'), 3, ROL_TEKST);
    regelNaamTegen = maakRegel($('naam-tegen'), 3, ROL_TEKST);
    regelScoreRbc = maakRegel($('score-rbc'), 1, ROL_CIJFER);
    regelScoreTegen = maakRegel($('score-tegen'), 1, ROL_CIJFER);
    regelKlok = maakRegel($('klok'), 2, ROL_CIJFER);

    try { vulUit(JSON.parse($('ingebouwd').textContent)); } catch (e) {}
    const bewaard = OPSLAG.lees('rbc-gegevens', null);
    if (bewaard && bewaard.squad && bewaard.squad.length) vulUit(bewaard);

    W = OPSLAG.lees('rbc-wedstrijd', null);
    if (!W || typeof W.rbc !== 'number') nieuweWedstrijd(tegenstanderVan(D.volgende));
    if (!W.tegen && D.volgende) { W.tegen = tegenstanderVan(D.volgende); bewaar(); }

    $('knop-geluid').setAttribute('aria-pressed', GELUID ? 'true' : 'false');
    $('knop-geluid').textContent = GELUID ? '♪' : '♪̸';

    zetTaal(TAAL);
    tekenBord(); tekenEerder(); tekenKop();

    fetch('data.json?v=' + Date.now())
        .then(r => r.json())
        .then(function (m) {
            vulUit(m);
            OPSLAG.schrijf('rbc-gegevens', { squad: D.squad, squad_bijgewerkt: D.bijgewerkt, match: D.volgende });
            if (!W.tegen && D.volgende) { W.tegen = tegenstanderVan(D.volgende); bewaar(); }
            tekenBord(); tekenKop();
        })
        .catch(function () { if (!navigator.onLine) meld(t('offline')); });
})();

/* De app komt uit de cache, dus een nieuwe versie zou pas de
   volgende keer verschijnen. Zodra er één klaarstaat: melden en
   op één tik overschakelen. */
const OP_EIGEN_MACHINE = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) ||
                         location.protocol === 'file:';
if ('serviceWorker' in navigator && !OP_EIGEN_MACHINE) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
                const nieuw = reg.installing;
                if (!nieuw) return;
                nieuw.addEventListener('statechange', function () {
                    if (nieuw.state === 'installed' && navigator.serviceWorker.controller) {
                        meld(t('nieuwe_versie'), true);
                        $('melding').style.pointerEvents = 'auto';
                        $('melding').style.cursor = 'pointer';
                        $('melding').addEventListener('click', function () { location.reload(); });
                    }
                });
            });
        }).catch(function () {});
    });
}
