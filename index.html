/* ════════════════════════════════════════════════════════
   5. KLOK
   Voetbal telt vanaf de eerste minuut: de eerste zestig
   seconden zijn minuut 1, niet minuut 0.
   ════════════════════════════════════════════════════════ */
/* Niemand hoeft een stopwatch te bedienen. De aftrap staat in het
   programma, dus de app weet zelf hoe laat het ongeveer in de
   wedstrijd is. Ruw is precies genoeg: het gaat om "rond de 40e". */
function aftrapTijd() {
    const w = onsDuel();
    if (!w) return null;
    return leesDatum(w.datum, w.tijd);
}
function verstreken() {
    const start = aftrapTijd();
    if (!start) return null;
    const min = Math.floor((Date.now() - start) / 60000) + 1;
    if (min < 1 || min > 140) return null;          /* ruim voor of lang na de tijd */
    if (min > 45 && min <= 60) return 45;           /* rust: blijft op 45 staan */
    if (min > 60) return Math.min(min - 15, 95);    /* na rust weer doortellen */
    return min;
}
function loopt() { return verstreken() != null; }
function minuutNu() { const m = verstreken(); return m == null ? '' : String(m); }

/* Een doelpunt heeft óf een minuut ("38"), óf een fase ("eerste
   helft"), óf niets. Overal waar we een tijd tonen gaat het hier
   langs, zodat het bord, de tekst en het plaatje hetzelfde zeggen. */
function wanneerTekst(d, leegTeken) {
    if (d && d.minuut) return d.minuut + "'";
    if (d && d.fase) return t(d.fase) || d.fase;
    return leegTeken === undefined ? '—' : leegTeken;
}

let regelKlok, regelScoreRbc, regelScoreTegen, regelNaamRbc, regelNaamTegen;

function tekenKlok() {
    const m = verstreken();
    const aan = m != null;
    $('lamp').classList.toggle('aan', aan);
    $('klok').classList.toggle('loopt-al', aan);
    regelKlok.zet(aan ? String(m).padStart(2, ' ') : '');
    $('klok-uitleg').textContent = aan ? t('vanaf_aftrap') : '';
}
setInterval(tekenKlok, 30000);

/* ════════════════════════════════════════════════════════
   6. HET BORD TEKENEN
   ════════════════════════════════════════════════════════ */
function tekenBord() {
    if (!W) nieuweWedstrijd(tegenstanderVan(D.volgende));
    regelNaamRbc.zet('RBC');
    regelNaamTegen.zet(W.tegen ? afkorting(W.tegen) : '???');
    zetStand($('score-rbc'), 'rbc', W.rbc);
    zetStand($('score-tegen'), 'hen', W.hen);
    tekenKlok();
    tekenVerloop();
}

/* Eén lamel toont één cijfer. Wordt het er tien of meer — het
   gebeurt zelden, maar een verkeerd doorgestuurde stand is erger
   dan een extra lamel — dan komt er een lamel bij. */
const lamellenVoor = { rbc: 1, hen: 1 };
function zetStand(houder, kant, waarde) {
    const tekst = String(waarde);
    if (tekst.length !== lamellenVoor[kant]) {
        lamellenVoor[kant] = tekst.length;
        const nieuw = maakRegel(houder, tekst.length, ROL_CIJFER);
        if (kant === 'rbc') regelScoreRbc = nieuw; else regelScoreTegen = nieuw;
    }
    (kant === 'rbc' ? regelScoreRbc : regelScoreTegen).zet(tekst);
}

function tekenVerloop() {
    const l = $('verloop');
    if (!W.doelpunten.length) {
        l.innerHTML = '<li class="leeg">' + veilig(t('verloop_leeg')) + '</li>';
        return;
    }
    l.innerHTML = W.doelpunten.map(function (d, i) {
        const wie = d.eigen ? (d.naam || t('onbekende_speler')) : (W.tegen || t('tegenpartij'));
        return '<li class="' + (d.eigen ? 'eigen' : '') + '">' +
            '<button class="m" data-tijd="' + i + '">' + veilig(wanneerTekst(d)) + '</button>' +
            '<span class="w">' + veilig(wie) + '</span>' +
            '<button class="weg" data-i="' + i + '" aria-label="verwijderen">×</button></li>';
    }).join('');
    l.querySelectorAll('[data-tijd]').forEach(function (b) {
        b.addEventListener('click', function () { vraagWanneer(+b.dataset.tijd); });
    });
    l.querySelectorAll('.weg').forEach(function (b) {
        b.addEventListener('click', function () {
            const i = +b.dataset.i, d = W.doelpunten[i];
            if (!d) return;
            if (d.eigen) W.rbc = Math.max(0, W.rbc - 1); else W.hen = Math.max(0, W.hen - 1);
            W.doelpunten.splice(i, 1);
            bewaar(); tekenBord();
        });
    });
}

function tekenEerder() {
    const l = $('eerder'), h = historie();
    if (!h.length) { l.innerHTML = '<li class="leeg">' + veilig(t('eerder_leeg')) + '</li>'; return; }
    l.innerHTML = h.map(function (m, i) {
        return '<li><span class="t">RBC – ' + veilig(m.tegen || '—') + '</span>' +
            '<span class="u">' + veilig(m.rbc) + '–' + veilig(m.hen) + '</span>' +
            '<button class="mini" data-deel="' + i + '">' + veilig(t('deel')) + '</button></li>';
    }).join('');
    l.querySelectorAll('[data-deel]').forEach(function (b) {
        b.addEventListener('click', function () { stuur(historie()[+b.dataset.deel]); });
    });
}

function tekenKop() {
    const m = D.volgende;
    if (!m || !m.home_team) { $('kop-sub').textContent = ''; return; }
    const thuis = /rbc/i.test(m.home_team || '');
    const wie = thuis ? m.away_team : m.home_team;
    $('kop-sub').textContent = [(thuis ? t('thuis_tegen') : t('uit_bij')) + ' ' + wie,
                               m.status, m.competition].filter(Boolean).join('  ·  ');
}

/* ════════════════════════════════════════════════════════
   7. SCOREN
   ════════════════════════════════════════════════════════ */
function scoor(eigen, naam) {
    if (!W) nieuweWedstrijd(tegenstanderVan(D.volgende));
    if (eigen) W.rbc++; else W.hen++;
    const minuut = minuutNu();
    W.doelpunten.push({ eigen: eigen, minuut: minuut, naam: naam || '', fase: null });
    bewaar(); tekenBord(); tekenSeizoen();
    if (navigator.vibrate) { try { navigator.vibrate(eigen ? [14, 40, 14] : 10); } catch (e) {} }
    /* Weet de app de tijd niet, dan vragen we hem: anders staat er
       straks een doelpunt zonder wanneer in de groepsapp. */
    if (!minuut) setTimeout(function () { vraagWanneer(W.doelpunten.length - 1); }, 220);
    else meld(minuut + "'  ·  " + t('tik_tijd'));
}

/* Zelf een minuut intikken. Dezelfde toetsen als bij het rugnummer,
   met een grote OK eronder; 1 t/m 120, want blessuretijd bestaat. */
let minuutGetikt = '', minuutKlaar = null;
function openMinuut(begin, klaar) {
    minuutGetikt = begin ? String(begin) : '';
    minuutKlaar = klaar;
    $('kop-minuut').textContent = t('welke_minuut');
    $('minuut-hint').textContent = t('minuut_hint');
    tekenMinuut();
    open('laag-minuut');
}
function tekenMinuut() {
    $('minuut-cijfer').textContent = minuutGetikt || '—';
    const ok = $('minuut-ok');
    if (ok) ok.disabled = !minuutGetikt;
    if (ok) ok.style.opacity = minuutGetikt ? '1' : '.45';
}
(function bouwMinuutToetsen() {
    const k = $('minuut-toetsen');
    ['1','2','3','4','5','6','7','8','9','wis','0','ok'].forEach(function (c) {
        const b = document.createElement('button');
        b.className = 'toets' + (c === 'wis' ? ' stil' : (c === 'ok' ? ' klaar' : ''));
        b.textContent = c === 'wis' ? '⌫' : (c === 'ok' ? '✓' : c);
        if (c === 'ok') b.id = 'minuut-ok';
        b.addEventListener('click', function () {
            if (c === 'ok') {
                if (!minuutGetikt) return;
                const m = Math.max(1, Math.min(120, +minuutGetikt));
                dicht('laag-minuut');
                if (minuutKlaar) { const f = minuutKlaar; minuutKlaar = null; f(String(m)); }
                return;
            }
            if (c === 'wis') minuutGetikt = minuutGetikt.slice(0, -1);
            else if (minuutGetikt.length < 3) minuutGetikt += c;
            if (+minuutGetikt > 120) minuutGetikt = minuutGetikt.slice(0, -1);
            tekenMinuut();
        });
        k.appendChild(b);
    });
})();

/* Wanneer ongeveer? Weet de app de aftrap, dan staat de lopende
   minuut bovenaan als eerste keuze en is het één tik. Weet hij het
   niet, dan is "eerste helft" ook een prima antwoord — het gaat om
   wat je het thuisfront vertelt, niet om de officiële statistiek. */
function vraagWanneer(i, klaar) {
    const d = W.doelpunten[i];
    if (!d) return;
    const nu = verstreken();
    const keuzes = [];
    if (nu != null) keuzes.push({ merk: 'nu', groot: t('nu_ongeveer')(nu), tip: true });
    keuzes.push({ merk: 'zelf', groot: t('zelf_minuut') });
    keuzes.push({ merk: '1', groot: t('eerste_helft') });
    keuzes.push({ merk: 'rust', groot: t('rust_tijd') });
    keuzes.push({ merk: '2', groot: t('tweede_helft') });
    keuzes.push({ merk: 'na', groot: t('na_afloop') });
    keuzes.push({ merk: 'geen', groot: t('wanneer_weet_niet') });

    $('kop-wanneer').textContent = t('wanneer_kop');
    $('wanneer-keuze').innerHTML = keuzes.map(function (k) {
        return '<button type="button" data-merk="' + k.merk + '"' +
               (k.tip ? ' class="nu-tip"' : '') + '>' +
               '<b>' + veilig(k.groot) + '</b></button>';
    }).join('');
    $('wanneer-keuze').querySelectorAll('[data-merk]').forEach(function (b) {
        b.addEventListener('click', function () {
            const m = b.dataset.merk;
            if (m === 'zelf') {
                dicht('laag-wanneer');
                openMinuut(d.minuut || (nu != null ? nu : ''), function (gekozen) {
                    d.minuut = gekozen; d.fase = null;
                    bewaar(); tekenVerloop(); tekenSeizoen();
                    if (klaar) klaar();
                });
                return;
            }
            d.minuut = ''; d.fase = null;
            if (m === 'nu') d.minuut = String(nu);
            else if (m === '1') d.fase = 'eerste_helft';
            else if (m === 'rust') d.fase = 'rust_tijd';
            else if (m === '2') d.fase = 'tweede_helft';
            else if (m === 'na') d.fase = 'na_afloop';
            bewaar(); tekenVerloop(); tekenSeizoen();
            dicht('laag-wanneer');
            if (klaar) klaar();
        });
    });
    open('laag-wanneer');
}

/* De enige handeling tijdens de wedstrijd: er is gescoord. Wie het
   was vraagt hij meteen erna, en de tegenpartij staat als eerste
   keuze bovenaan — dan is het één knop en één tik. */
function erIsGescoord() {
    const r = $('scorer-rooster');
    $('kop-scorer').textContent = t('wie_was_het');
    const tegen = (W && W.tegen) || t('de_tegenpartij');
    r.innerHTML =
        '<button class="speler breed" data-kant="tegen"><b>⚽</b><span>' +
            veilig(tegen) + '<i class="kant">' + veilig(t('tegenpartij_kant')) + '</i></span></button>' +
        '<p class="rooster-kop">' + veilig(t('rbc_kant')) + '</p>' +
        D.squad.map(function (p) {
            return '<button class="speler" data-nr="' + veilig(p.number) + '">' +
                '<b>' + veilig(p.number) + '</b><span>' + veilig(kortNaam(p.name)) + '</span></button>';
        }).join('');
    r.querySelectorAll('[data-nr]').forEach(function (b) {
        b.addEventListener('click', function () {
            const p = D.squad.find(x => String(x.number) === b.dataset.nr);
            dicht('laag-scorer');
            scoor(true, p ? p.name : '');
        });
    });
    const t2 = r.querySelector('[data-kant="tegen"]');
    if (t2) t2.addEventListener('click', function () { dicht('laag-scorer'); scoor(false); });
    kiesKlaar = null;
    open('laag-scorer');
}
function terug(eigen) {
    if (!W) return;
    for (let i = W.doelpunten.length - 1; i >= 0; i--) {
        if (!!W.doelpunten[i].eigen === !!eigen) { W.doelpunten.splice(i, 1); break; }
    }
    if (eigen) W.rbc = Math.max(0, W.rbc - 1); else W.hen = Math.max(0, W.hen - 1);
    bewaar(); tekenBord();
}

/* ════════════════════════════════════════════════════════
   8. LAGEN
   ════════════════════════════════════════════════════════ */
function open(id) { $(id).classList.add('aan'); }
function dicht(id) { $(id).classList.remove('aan'); }
document.querySelectorAll('[data-sluit]').forEach(function (b) {
    b.addEventListener('click', function () { dicht(b.dataset.sluit); });
});
document.querySelectorAll('.laag').forEach(function (l) {
    l.addEventListener('click', function (e) { if (e.target === l) dicht(l.id); });
});

/* — wie scoorde — */
let kiesKlaar = null;
function openKiezer(titel, klaar) {
    kiesKlaar = klaar;
    $('kop-scorer').textContent = titel;
    const r = $('scorer-rooster');
    r.innerHTML = D.squad.map(function (p) {
        return '<button class="speler" data-nr="' + veilig(p.number) + '">' +
            '<b>' + veilig(p.number) + '</b><span>' + veilig(kortNaam(p.name)) + '</span></button>';
    }).join('') || '<p class="leeg">—</p>';
    r.querySelectorAll('[data-nr]').forEach(function (b) {
        b.addEventListener('click', function () {
            const p = D.squad.find(x => String(x.number) === b.dataset.nr);
            dicht('laag-scorer');
            if (kiesKlaar) kiesKlaar(p || null);
        });
    });
    open('laag-scorer');
}
function openScorer(i) {
    openKiezer(t('wie_scoorde'), function (p) {
        if (p && W.doelpunten[i]) { W.doelpunten[i].naam = p.name; bewaar(); tekenVerloop(); }
    });
}
$('scorer-onbekend').addEventListener('click', function () {
    dicht('laag-scorer');
    if (kiesKlaar) { const k = kiesKlaar; kiesKlaar = null; k(null); return; }
    scoor(true);                       /* wel een RBC-doelpunt, alleen geen naam */
});
function kortNaam(n) {
    const d = String(n || '').trim().split(/\s+/);
    return d.length > 1 ? d[d.length - 1] : (d[0] || '');
}

/* — rugnummer — */
let getikt = '';
function openNummer() { getikt = ''; tekenShirt(); open('laag-nummer'); }
function toetsAan(c) {
    if (c === 'wis') getikt = getikt.slice(0, -1);
    else if (getikt.length < 2) getikt += c;
    else getikt = c;
    tekenShirt();
}
(function bouwToetsen() {
    const k = $('toetsen');
    ['1','2','3','4','5','6','7','8','9','wis','0','sluit'].forEach(function (c) {
        const b = document.createElement('button');
        b.className = 'toets' + (c === 'wis' || c === 'sluit' ? ' stil' : '');
        b.textContent = c === 'wis' ? '⌫' : (c === 'sluit' ? '✕' : c);
        b.addEventListener('click', function () {
            if (c === 'sluit') { dicht('laag-nummer'); return; }
            toetsAan(c);
        });
        k.appendChild(b);
    });
})();

function tekenShirt() {
    const nr = getikt;
    const p = nr ? D.squad.find(x => String(x.number) === String(+nr)) : null;
    $('rug-nr').textContent = nr || '—';
    $('shirt').classList.toggle('geen-shirt', !!nr && !p);

    const naam = p ? plat(kortNaam(p.name)) : '';
    const tp = $('boog-tekst').querySelector('textPath');
    tp.textContent = naam;
    /* lange namen passen niet op de boog: dan kleiner zetten */
    /* Een naam op een shirt loopt nooit over de mouwen. Eerst een
       schatting, daarna één correctie op de echt gemeten breedte —
       zo past BOUYAGHLAFEN net zo goed als YU. */
    const boog = $('boog-tekst');
    const lengte = $('boog').getTotalLength() * 0.92;
    let fs = Math.max(13, Math.min(27, lengte / Math.max(naam.length, 1) / 0.68));
    boog.setAttribute('font-size', String(fs));
    try {
        const nu = tp.getComputedTextLength();
        if (nu > lengte) boog.setAttribute('font-size', String(Math.max(11, fs * lengte / nu)));
    } catch (e) {}

    const uit = $('speler-uit');
    if (!nr) { uit.innerHTML = ''; return; }
    if (!p) { uit.innerHTML = '<p class="leeg">' + veilig(t('geen')) + '</p>'; return; }

    const pos = POSITIES[p.positie] ? POSITIES[p.positie][TAAL === 'nl' ? 0 : 1] : (p.positie || '—');
    const vlaggen = (p.nationaliteiten || []).map(vlagVan).filter(Boolean).join(' ');
    uit.innerHTML =
        '<div class="kaart">' +
            (p.photo ? '<img src="' + veilig(p.photo) + '" alt="" loading="lazy">' : '') +
            '<div class="wie"><b>' + veilig(p.name) + '</b><span>#' + veilig(p.number) + ' · ' + veilig(pos) + '</span></div>' +
        '</div>' +
        '<dl class="feiten">' +
            feit(t('positie'), pos) +
            feit(t('leeftijd'), p.leeftijd ? p.leeftijd + ' ' + t('jaar') : '—') +
            feit(t('paspoort'), (vlaggen || '') + ' ' + (p.nationaliteiten || []).join(', '), true) +
            (p.vorige_club ? feit(t('vorige'), p.vorige_club, true) : '') +
        '</dl>';
}
function feit(k, v, breed) {
    return '<div class="feit' + (breed ? ' breed' : '') + '"><dt>' + veilig(k) + '</dt><dd>' + veilig(v) + '</dd></div>';
}
const LANDCODE = { Netherlands: 'NL', Morocco: 'MA', Belgium: 'BE', Ghana: 'GH', Angola: 'AO',
                   Curacao: 'CW', 'Cape Verde': 'CV', Suriname: 'SR', Turkey: 'TR', Germany: 'DE' };
function vlagVan(land) {
    const c = LANDCODE[land];
    if (!c) return '';
    return String.fromCodePoint(...c.split('').map(x => 0x1F1E6 + x.charCodeAt(0) - 65));
}

/* ════════════════════════════════════════════════════════
   8b. BLADEN
   Het bord heeft drie pagina's: het scorebord, de stand en de
   periodes. Je veegt ertussen — geen derde knop onderaan.
   ════════════════════════════════════════════════════════ */
const BLADEN = ['bord', 'wedstrijd', 'opstelling', 'tabel', 'periodes'];
let bladNu = 0;

(function bouwStippen() {
    const h = $('stippen');
    BLADEN.forEach(function (naam, i) {
        const b = document.createElement('button');
        b.className = 'stip'; b.type = 'button';
        b.setAttribute('aria-label', naam);
        b.addEventListener('click', function () { naarBlad(i); });
        h.appendChild(b);
    });
})();
function naarBlad(i) {
    i = Math.max(0, Math.min(BLADEN.length - 1, i));
    const bladen = $('bladen');
    bladen.scrollTo({ left: bladen.clientWidth * i, behavior: RUSTIG ? 'auto' : 'smooth' });
}
function merkBlad() {
    const bladen = $('bladen');
    const i = Math.round(bladen.scrollLeft / Math.max(bladen.clientWidth, 1));
    if (i === bladNu) return;
    bladNu = i;
    [...$('stippen').children].forEach(function (s, k) {
        s.setAttribute('aria-current', k === i ? 'true' : 'false');
    });
    OPSLAG.schrijf('rbc-blad', i);
    klik();
}
$('bladen').addEventListener('scroll', function () {
    clearTimeout(merkBlad.klok);
    merkBlad.klok = setTimeout(merkBlad, 90);
}, { passive: true });

/* ════════════════════════════════════════════════════════
   8c. STAND, PROGRAMMA EN PERIODES
   Uit competitie.json, dat elk uur door een taak in de repo
   wordt ververst. Geen proxy vanaf de telefoon dus: op de
   tribune staat de tabel er meteen, ook zonder bereik.
   ════════════════════════════════════════════════════════ */
let C = null;
const isRBC = naam => /^rbc\b/i.test(String(naam || '').trim());

function zoneVan(pos, aantal) {
    if (!C || !C.zones) return '';
    if (pos <= (C.zones.promotie || 0)) return 'zone-p';
    if (pos <= (C.zones.promotie || 0) + (C.zones.nacompetitie || 0)) return 'zone-n';
    if (pos > aantal - (C.zones.degradatie || 0)) return 'zone-d';
    return '';
}

function tekenTabel() {
    const el = $('tabel-uit');
    if (!C || !C.stand || !C.stand.length) {
        el.innerHTML = '<p class="leeg">' + veilig(t('geen_tabel')) + '</p>';
        return;
    }
    const n = C.stand.length;
    el.innerHTML =
        '<table class="rang"><thead><tr>' +
            '<th></th><th class="l">' + veilig(t('th_club')) + '</th>' +
            '<th>' + veilig(t('th_wed')) + '</th><th>' + veilig(t('th_pnt')) + '</th>' +
            '<th>' + veilig(t('th_ds')) + '</th><th class="l">' + veilig(t('th_vorm')) + '</th>' +
        '</tr></thead><tbody>' +
        C.stand.map(function (r) {
            const klas = [zoneVan(r.pos, n), isRBC(r.club) ? 'rbc' : ''].filter(Boolean).join(' ');
            const vorm = (r.vorm || []).map(function (v) {
                return '<i class="' + veilig(v.uitslag) + '" title="' + veilig(v.wat || '') + '"></i>';
            }).join('');
            return '<tr class="' + klas + '">' +
                '<td class="pos">' + veilig(r.pos) + '</td>' +
                '<td class="club">' + veilig(r.club) + '</td>' +
                '<td>' + veilig(r.wed) + '</td>' +
                '<td class="pnt">' + veilig(r.pnt) + '</td>' +
                '<td>' + (r.ds > 0 ? '+' : '') + veilig(r.ds) + '</td>' +
                '<td><span class="vorm">' + vorm + '</span></td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div class="uitleg">' +
            '<span><b style="background:#39c07a"></b>' + veilig(t('z_promotie')) + '</span>' +
            '<span><b style="background:#ff6a13"></b>' + veilig(t('z_nacompetitie')) + '</span>' +
            '<span><b style="background:#d1453c"></b>' + veilig(t('z_degradatie')) + '</span>' +
        '</div>' +
        '<p class="bron">' + veilig(t('bijgewerkt_om')) + ' ' + veilig(wanneer(C.bijgewerkt)) +
            '  ·  ' + veilig(t('van_bron')) + '</p>';
}

function wanneer(iso) {
    if (!iso) return '—';
    try {
        return new Date(iso).toLocaleString(TAAL === 'nl' ? 'nl-NL' : 'en-GB',
            { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
}

function tekenProgramma() {
    const el = $('programma-uit');
    const duels = (C && C.programma) || [];
    if (!duels.length) { el.innerHTML = '<li class="leeg">—</li>'; return; }
    let dag = '';
    el.innerHTML = duels.slice(0, 12).map(function (w) {
        let kop = '';
        if (w.datum && w.datum !== dag) { dag = w.datum; kop = '<li class="dag">' + veilig(dag) + '</li>'; }
        const ons = isRBC(w.thuis) || isRBC(w.uit);
        return kop + '<li class="' + (ons ? 'rbc' : '') + '">' +
            '<span class="duel">' + veilig(w.thuis) + ' – ' + veilig(w.uit) + '</span>' +
            '<span class="wanneer">' + veilig(w.tijd || '') + '</span></li>';
    }).join('');
}

function tekenPeriodes() {
    const kop = $('periode-kop'), el = $('periodes-uit');
    if (!C || !C.periodes || !C.periodes.length) {
        kop.innerHTML = ''; el.innerHTML = '<p class="leeg">' + veilig(t('geen_tabel')) + '</p>';
        return;
    }
    const nu = C.periode_nu || 1;
    const rest = C.periode_resterend;
    kop.innerHTML =
        '<b>' + veilig(nu) + veilig(t('periode_nu')) + '</b>' +
        '<span>' + (rest != null ? veilig(t('nog_rondes')(rest)) : '') + '</span>' +
        '<em>' + veilig(t('periode_uitleg')) + '</em>';

    el.innerHTML = C.periodes.map(function (p, i) {
        const actief = (i + 1) === nu;
        const rijen = p.rijen || [];
        const n = rijen.length;
        return '<div class="periode' + (i + 1 > nu ? ' later' : '') + '">' +
            '<h3>' + veilig(p.naam) + (actief ? '<span class="nu">nu</span>' : '') + '</h3>' +
            '<table class="rang"><tbody>' +
            rijen.slice(0, actief ? n : 5).map(function (r) {
                const klas = [r.pos === 1 ? 'zone-n' : '', isRBC(r.club) ? 'rbc' : ''].filter(Boolean).join(' ');
                return '<tr class="' + klas + '">' +
                    '<td class="pos">' + veilig(r.pos) + '</td>' +
                    '<td class="club">' + veilig(r.club) + '</td>' +
                    '<td>' + veilig(r.wed) + '</td>' +
                    '<td class="pnt">' + veilig(r.pnt) + '</td>' +
                    '<td>' + (r.ds > 0 ? '+' : '') + veilig(r.ds) + '</td></tr>';
            }).join('') +
            '</tbody></table></div>';
    }).join('');
}

function tekenCompetitie() { tekenTabel(); tekenProgramma(); tekenPeriodes(); tekenWedstrijd(); }

function haalCompetitie() {
    const bewaard = OPSLAG.lees('rbc-competitie', null);
    if (bewaard) { C = bewaard; tekenCompetitie(); }
    fetch('competitie.json?v=' + Date.now())
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(function (d) {
            if (!d || !d.stand) return;
            C = d; OPSLAG.schrijf('rbc-competitie', d); tekenCompetitie();
        })
        .catch(function () { if (!C) tekenCompetitie(); });
}

/* ════════════════════════════════════════════════════════
   8d. WEDSTRIJD: AFTELLEN, HEENWEG, UITSLAGEN, EIGEN SEIZOEN
   De grote apps tellen af naar de aftrap en zetten de wedstrijd
   in je agenda. Dat kan hier ook, en zonder pushdienst: een ICS
   in je eigen agenda werkt ook als de telefoon geen bereik heeft.
   ════════════════════════════════════════════════════════ */
const STADION = { naam: 'Atik Stadion', adres: 'Borchwerf 4, 4704 RG Roosendaal' };
const MAANDNR = { januari: 0, februari: 1, maart: 2, april: 3, mei: 4, juni: 5, juli: 6,
                  augustus: 7, september: 8, oktober: 9, november: 10, december: 11 };

/* "zondag 16 augustus" + "14:30" -> Date. Het seizoen loopt over de
   jaarwisseling heen: augustus t/m december is het eerste jaar. */
function leesDatum(datum, tijd) {
    if (!datum) return null;
    const d = String(datum).toLowerCase().match(/(\d{1,2})\s+([a-zé]+)/);
    if (!d) return null;
    const maand = MAANDNR[d[2]];
    if (maand === undefined) return null;
    const jaren = String((C && C.seizoen) || '2026/2027').match(/(\d{4})\D+(\d{4})/);
    const jaar = maand >= 6 ? +(jaren ? jaren[1] : 2026) : +(jaren ? jaren[2] : 2027);
    let uur = 14, min = 30;
    const tm = String(tijd || '').match(/(\d{1,2})[.:](\d{2})/);
    if (tm) { uur = +tm[1]; min = +tm[2]; }
    return new Date(jaar, maand, +d[1], uur, min);
}
function onsDuel() {
    const lijst = (C && C.programma) || [];
    for (const w of lijst) if (isRBC(w.thuis) || isRBC(w.uit)) return w;
    return null;
}
function tweeCijfers(n) { return String(n).padStart(2, '0'); }
function icsTijd(d) {
    return d.getFullYear() + tweeCijfers(d.getMonth() + 1) + tweeCijfers(d.getDate()) +
           'T' + tweeCijfers(d.getHours()) + tweeCijfers(d.getMinutes()) + '00';
}
function kaartLink(zoek) {
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(zoek);
}

let aftelKlok = null;
function tekenWedstrijd() {
    const el = $('aftrap'), doen = $('doen');
    const w = onsDuel();
    clearInterval(aftelKlok);

    if (!w) {
        el.innerHTML = '<p class="leeg">' + veilig(t('geen_tabel')) + '</p>';
        doen.innerHTML = '';
    } else {
        const thuis = isRBC(w.thuis);
        const tegen = thuis ? w.uit : w.thuis;
        const rij = (C.stand || []).find(r => r.club === tegen);
        const start = leesDatum(w.datum, w.tijd);

        function verf() {
            const ms = start ? start - Date.now() : null;
            let klokjes;
            if (ms == null) klokjes = '';
            else if (ms <= 0 && ms > -3.5 * 3600000) klokjes = '<p class="nu-bezig">' + veilig(t('bezig')) + '</p>';
            else if (ms <= 0) klokjes = '<p class="onder">' + veilig(t('afgelopen')) + '</p>';
            else {
                const d = Math.floor(ms / 86400000);
                const u = Math.floor(ms / 3600000) % 24;
                const m = Math.floor(ms / 60000) % 60;
                klokjes = '<div class="klokjes">' +
                    [[d, t('dagen')], [u, t('uren')], [m, t('minuten')]].map(function (x) {
                        return '<div class="klokje"><b>' + tweeCijfers(x[0]) + '</b><span>' + veilig(x[1]) + '</span></div>';
                    }).join('') + '</div>';
            }
            el.innerHTML =
                '<p class="wanneer-kop">' + veilig(t('volgende')) + '</p>' +
                '<p class="duel-groot">' + veilig(w.thuis) + '<br>' + veilig(w.uit) + '</p>' +
                '<p class="onder">' + veilig(w.datum || '') + (w.tijd ? ' · ' + veilig(w.tijd) : '') +
                    (rij ? '  ·  ' + veilig(tegen) + ' ' + veilig(rij.pos) + 'e, ' + veilig(rij.pnt) + ' ' + veilig(t('th_pnt')) : '') +
                    (thuis ? '  ·  ' + veilig(t('thuis_bij')) : '') + '</p>' +
                klokjes;
        }
        verf();
        if (start && start - Date.now() > 0) aftelKlok = setInterval(verf, 30000);

        const plek = thuis ? (STADION.naam + ', ' + STADION.adres) : (tegen + ' voetbal');
        doen.innerHTML =
            '<a href="' + veilig(kaartLink(plek)) + '" target="_blank" rel="noopener">📍 ' + veilig(t('heenweg')) + '</a>' +
            '<button type="button" id="knop-agenda">🗓 ' + veilig(t('agenda')) + '</button>';
        const ag = $('knop-agenda');
        if (ag) ag.addEventListener('click', function () { zetInAgenda(w, start, plek); });
    }

    tekenUitslagen();
    tekenSeizoen();
}

function zetInAgenda(w, start, plek) {
    if (!start) return;
    const eind = new Date(start.getTime() + 105 * 60000);      /* 90 minuten plus rust */
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//RBC Roosendaal//NL', 'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        'UID:rbc-' + icsTijd(start) + '@rbcroosendaal.com',
        'DTSTAMP:' + icsTijd(new Date()),
        'DTSTART:' + icsTijd(start),
        'DTEND:' + icsTijd(eind),
        'SUMMARY:' + (w.thuis + ' - ' + w.uit).replace(/[,;]/g, ' '),
        'LOCATION:' + String(plek || '').replace(/[,;]/g, ' '),
        'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rbc-wedstrijd.ics';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function tekenUitslagen() {
    const el = $('uitslagen-uit');
    const lijst = ((C && C.uitslagen) || []).slice().reverse();
    if (!lijst.length) { el.innerHTML = '<li class="leeg">—</li>'; return; }
    let dag = '';
    el.innerHTML = lijst.slice(0, 12).map(function (w) {
        let kop = '';
        if (w.datum && w.datum !== dag) { dag = w.datum; kop = '<li class="dag">' + veilig(dag) + '</li>'; }
        const ons = isRBC(w.thuis) || isRBC(w.uit);
        return kop + '<li class="' + (ons ? 'rbc' : '') + '">' +
            '<span class="duel">' + veilig(w.thuis) + ' – ' + veilig(w.uit) + '</span>' +
            '<span class="wanneer">' + veilig(w.thuis_doelpunten) + '–' + veilig(w.uit_doelpunten) + '</span></li>';
    }).join('');
}

/* Wat geen enkele grote app heeft: jouw eigen seizoen. Alles wat je
   op het bord bijhield, bij elkaar opgeteld — en het blijft van jou,
   want het staat alleen in deze telefoon. */
function tekenSeizoen() {
    const el = $('seizoen-uit');
    const alles = historie().slice();
    if (W && (W.rbc || W.hen || W.doelpunten.length)) alles.unshift(W);
    if (!alles.length) { el.innerHTML = '<p class="leeg">' + veilig(t('nog_niets')) + '</p>'; return; }

    let goals = 0, winst = 0;
    const schutters = {};
    alles.forEach(function (m) {
        goals += m.rbc || 0;
        if ((m.rbc || 0) > (m.hen || 0)) winst++;
        (m.doelpunten || []).forEach(function (d) {
            if (!d.eigen || !d.naam) return;
            schutters[d.naam] = (schutters[d.naam] || 0) + 1;
        });
    });
    const top = Object.keys(schutters).map(k => ({ naam: k, n: schutters[k] }))
        .sort((a, b) => b.n - a.n).slice(0, 5);

    el.innerHTML =
        '<div class="seizoen">' +
            '<div><b>' + alles.length + '</b><span>' + veilig(t('m_gezien')) + '</span></div>' +
            '<div><b>' + goals + '</b><span>' + veilig(t('m_goals')) + '</span></div>' +
            '<div><b>' + winst + '</b><span>' + veilig(t('m_winst')) + '</span></div>' +
        '</div>' +
        (top.length ? '<ul class="schutters">' + top.map(function (x) {
            const p = D.squad.find(q => q.name === x.naam);
            return '<li><span class="nr">' + veilig(p ? p.number : '·') + '</span>' +
                   '<span>' + veilig(x.naam) + '</span>' +
                   '<span class="aantal">' + x.n + '</span></li>';
        }).join('') + '</ul>' : '');
}

/* ════════════════════════════════════════════════════════
   8e. OPSTELLING
   Wat de grote apps een line-up builder noemen: tik een plek
   aan, kies een speler, stuur het veld door als plaatje. Bij
   ons met de echte selectie erin, en het werkt zonder bereik.
   ════════════════════════════════════════════════════════ */
const FORMATIES = {
    '4-3-3':   [[50], [16, 38, 62, 84], [28, 50, 72], [22, 50, 78]],
    '4-4-2':   [[50], [16, 38, 62, 84], [16, 38, 62, 84], [35, 65]],
    '4-2-3-1': [[50], [16, 38, 62, 84], [36, 64], [20, 50, 80], [50]],
    '3-5-2':   [[50], [28, 50, 72], [10, 30, 50, 70, 90], [35, 65]],
    '5-3-2':   [[50], [10, 30, 50, 70, 90], [28, 50, 72], [35, 65]]
};
const LIJNHOOGTE = {
    4: [87, 67, 44, 19],
    5: [87, 69, 53, 34, 15]
};
const VAKKEN = ['K', 'V', 'M', 'A'];
let formatieNu = OPSLAG.lees('rbc-formatie', '4-3-3');
let opstelling = OPSLAG.lees('rbc-opstelling', {});

function lijnenVan(naam) {
    const f = FORMATIES[naam] || FORMATIES['4-3-3'];
    return { rijen: f, hoogtes: LIJNHOOGTE[f.length] || LIJNHOOGTE[4] };
}
function vakVan(positie) {
    const p = String(positie || '');
    if (/goalkeeper|keeper/i.test(p)) return 'K';
    if (/back|defender/i.test(p)) return 'V';
    if (/midfield/i.test(p)) return 'M';
    if (/winger|forward|striker/i.test(p)) return 'A';
    return 'M';
}

function tekenVeld() {
    const veld = $('veld');
    const { rijen, hoogtes } = lijnenVan(formatieNu);
    let h = '<div class="middenlijn"></div><div class="zestien boven"></div><div class="zestien onder"></div>';
    rijen.forEach(function (rij, r) {
        rij.forEach(function (x, k) {
            const sleutel = r + '-' + k;
            const nr = opstelling[sleutel];
            const p = nr != null ? D.squad.find(q => String(q.number) === String(nr)) : null;
            h += '<button type="button" class="plek' + (p ? '' : ' leeg') + '" data-plek="' + sleutel + '"' +
                 ' style="left:' + x + '%; top:' + hoogtes[r] + '%">' +
                 '<span class="romp"><span class="rugnr">' + (p ? veilig(p.number) : '+') + '</span></span>' +
                 '<span class="wie">' + (p ? veilig(plat(kortNaam(p.name))) : veilig(t('geen_plek'))) + '</span>' +
                 '</button>';
        });
    });
    veld.innerHTML = h;
    veld.querySelectorAll('[data-plek]').forEach(function (b) {
        b.addEventListener('click', function () {
            openKiezer(t('kies_speler'), function (p) {
                if (p) opstelling[b.dataset.plek] = p.number;
                else delete opstelling[b.dataset.plek];
                OPSLAG.schrijf('rbc-opstelling', opstelling);
                tekenVeld();
            });
        });
    });
}

function tekenFormaties() {
    const h = $('formaties');
    h.innerHTML = Object.keys(FORMATIES).map(function (naam) {
        return '<button type="button" class="form-knop" data-form="' + naam + '"' +
               ' aria-pressed="' + (naam === formatieNu) + '">' + naam + '</button>';
    }).join('');
    h.querySelectorAll('[data-form]').forEach(function (b) {
        b.addEventListener('click', function () {
            formatieNu = b.dataset.form;
            opstelling = {};
            OPSLAG.schrijf('rbc-formatie', formatieNu);
            OPSLAG.schrijf('rbc-opstelling', opstelling);
            tekenFormaties(); tekenVeld(); klik();
        });
    });
}

/* Zelf een elftal voorstellen: per linie de spelers met de laagste
   rugnummers, want die staan bij een club meestal in de basis. */
function vulElftal() {
    const { rijen } = lijnenVan(formatieNu);
    const gebruikt = new Set();
    opstelling = {};
    rijen.forEach(function (rij, r) {
        const vak = VAKKEN[Math.min(r, VAKKEN.length - 1)];
        const wens = r === 0 ? 'K' : (r === rijen.length - 1 ? 'A' : vak);
        const kandidaten = D.squad
            .filter(p => !gebruikt.has(p.number) && vakVan(p.positie) === wens)
            .sort((a, b) => a.number - b.number);
        const rest = D.squad.filter(p => !gebruikt.has(p.number) && p.number !== 1)
            .sort((a, b) => a.number - b.number);
        rij.forEach(function (_, k) {
            const p = kandidaten.shift() || rest.shift();
            if (!p) return;
            gebruikt.add(p.number);
            opstelling[r + '-' + k] = p.number;
        });
    });
    OPSLAG.schrijf('rbc-opstelling', opstelling);
    tekenVeld();
}

/* Het veld als plaatje, om door te sturen. */
async function opstellingPlaatje() {
    const B = 1080, H = 1350, c = document.createElement('canvas');
    c.width = B; c.height = H;
    const x = c.getContext('2d');
    const F = n => '900 ' + n + 'px system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

    x.fillStyle = '#0a0908'; x.fillRect(0, 0, B, H);
    /* gras met maaibanen */
    const vt = 150, vh = H - 260, vl = 40, vb = B - 80;
    x.fillStyle = '#16281b'; rond(x, vl, vt, vb, vh, 16); x.fill();
    x.save(); rond(x, vl, vt, vb, vh, 16); x.clip();
    for (let i = 0; i < 12; i++) {
        x.fillStyle = i % 2 ? 'rgba(255,255,255,.030)' : 'rgba(255,255,255,.012)';
        x.fillRect(vl, vt + i * (vh / 12), vb, vh / 12);
    }
    x.strokeStyle = 'rgba(244,236,225,.20)'; x.lineWidth = 3;
    x.strokeRect(vl + 14, vt + 14, vb - 28, vh - 28);
    x.beginPath(); x.moveTo(vl + 14, vt + vh / 2); x.lineTo(vl + vb - 14, vt + vh / 2); x.stroke();
    x.beginPath(); x.arc(vl + vb / 2, vt + vh / 2, vb * .13, 0, 7); x.stroke();
    x.strokeRect(vl + vb * .22, vt + 14, vb * .56, vh * .12);
    x.strokeRect(vl + vb * .22, vt + vh - 14 - vh * .12, vb * .56, vh * .12);
    x.restore();

    x.textAlign = 'center';
    x.fillStyle = '#ff6a13'; x.font = F(30);
    x.fillText(sperr('RBC ROOSENDAAL'), B / 2, 74);
    x.fillStyle = '#8b8178'; x.font = '800 24px system-ui, sans-serif';
    x.fillText(sperr(plat(t('mijn_opstelling')) + '   ' + formatieNu), B / 2, 116);

    const { rijen, hoogtes } = lijnenVan(formatieNu);
    rijen.forEach(function (rij, r) {
        rij.forEach(function (px, k) {
            const nr = opstelling[r + '-' + k];
            const p = nr != null ? D.squad.find(q => String(q.number) === String(nr)) : null;
            const cx = vl + vb * (px / 100);
            const cy = vt + vh * (hoogtes[r] / 100);
            /* shirt */
            const bw = 96, bh = 86;
            x.fillStyle = p ? '#ff6a13' : 'rgba(244,236,225,.16)';
            rond(x, cx - bw / 2, cy - bh / 2, bw, bh, 12); x.fill();
            if (p) {
                for (let i = 0; i < 4; i++) {
                    x.fillStyle = '#f7f3ee';
                    x.fillRect(cx - bw / 2 + 7 + i * 23, cy - bh / 2, 11, bh);
                }
            }
            /* Het nummer moet leesbaar blijven op oranje én op wit: eerst
               een lichte rand, dan de donkere letter. */
            x.font = F(40); x.textBaseline = 'middle';
            const tekst = p ? String(p.number) : '+';
            if (p) {
                x.lineWidth = 7; x.lineJoin = 'round';
                x.strokeStyle = 'rgba(255,240,225,.95)';
                x.strokeText(tekst, cx, cy + 4);
            }
            x.fillStyle = p ? '#17130f' : 'rgba(244,236,225,.5)';
            x.fillText(tekst, cx, cy + 4);
            x.textBaseline = 'alphabetic';
            if (p) {
                x.fillStyle = '#f4ece1'; x.font = '800 22px system-ui, sans-serif';
                x.fillText(plat(kortNaam(p.name)).slice(0, 14), cx, cy + bh / 2 + 30);
            }
        });
    });

    x.fillStyle = '#ff6a13'; x.font = '800 22px system-ui, sans-serif';
    x.fillText(sperr('RBCROOSENDAAL.COM'), B / 2, H - 52);
    return new Promise(function (res) { c.toBlob(res, 'image/png'); });
}

async function stuurOpstelling() {
    const namen = Object.keys(opstelling).map(function (k) {
        const p = D.squad.find(q => String(q.number) === String(opstelling[k]));
        return p ? p.number + ' ' + p.name : null;
    }).filter(Boolean);
    const tekst = [plat(t('mijn_opstelling')) + ' — ' + formatieNu, ''].concat(namen)
        .concat(['', 'rbcroosendaal.com']).join('\n');
    try {
        const blob = await opstellingPlaatje();
        if (blob) {
            const bestand = new File([blob], 'rbc-opstelling.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [bestand] })) {
                await navigator.share({ files: [bestand], text: tekst });
                return;
            }
        }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
}

$('knop-elftal').addEventListener('click', vulElftal);
$('knop-opst-leeg').addEventListener('click', function () {
    opstelling = {}; OPSLAG.schrijf('rbc-opstelling', opstelling); tekenVeld();
});
$('knop-opst-deel').addEventListener('click', stuurOpstelling);

/* ════════════════════════════════════════════════════════
   9. STUREN
   Eerst als plaatje: een bord‑plaatje in de groepsapp zegt meer
   dan "2-1". Lukt dat niet, dan gewoon de tekst.
   ════════════════════════════════════════════════════════ */
function tekstVan(m) {
    const r = ['RBC ' + m.rbc + ' - ' + m.hen + (m.tegen ? '  ' + m.tegen : '')];
    if (m.doelpunten && m.doelpunten.length) {
        r.push('');
        m.doelpunten.forEach(function (d) {
            const wie = d.eigen ? (d.naam || 'RBC') : (m.tegen || '—');
            r.push(wanneerTekst(d, '') + '  ' + wie);
        });
    }
    r.push('', 'rbcroosendaal.com');
    return r.join('\n');
}

function bordPlaatje(m) {
    const S = 1080, c = document.createElement('canvas');
    c.width = S; c.height = S;
    const x = c.getContext('2d');
    const F = '900 %spx ' + 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';

    x.fillStyle = '#0a0908'; x.fillRect(0, 0, S, S);
    x.fillStyle = '#161310';
    rond(x, 44, 44, S - 88, S - 88, 34); x.fill();
    x.strokeStyle = 'rgba(244,236,225,.10)'; x.lineWidth = 2;
    rond(x, 44, 44, S - 88, S - 88, 34); x.stroke();

    /* kop */
    x.fillStyle = '#ff6a13'; x.font = F.replace('%s', '26'); x.textAlign = 'center';
    x.fillText(sperr('RBC ROOSENDAAL'), S / 2, 132);
    x.fillStyle = '#8b8178'; x.font = '700 21px system-ui, sans-serif';
    const kop = [(D.volgende && D.volgende.competition) || '', minuutNu() ? minuutNu() + "'" : '']
        .filter(Boolean).join('   ·   ');
    if (kop) x.fillText(sperr(kop.toUpperCase()), S / 2, 176);

    /* lamellen met de stand */
    const nRbc = String(m.rbc), nHen = String(m.hen);
    const bw = 168, bh = 232, y = 250;
    lamel(x, S / 2 - bw - 26, y, bw, bh, nRbc, '#ff6a13');
    lamel(x, S / 2 + 26, y, bw, bh, nHen, '#f4ece1');
    x.fillStyle = '#4a443d'; x.font = F.replace('%s', '64');
    x.fillText('–', S / 2, y + bh / 2 + 22);

    /* teamnamen: elk naar zijn eigen kant, zodat een lange
       clubnaam nooit over RBC heen valt */
    x.font = F.replace('%s', '30'); x.fillStyle = '#f4ece1';
    x.textAlign = 'right';
    x.fillText(sperr('RBC'), S / 2 - 30, y + bh + 62);
    x.fillStyle = '#8b8178'; x.textAlign = 'left';
    x.font = F.replace('%s', '26');
    x.fillText(sperr(plat(m.tegen || '\u2014').slice(0, 18)), S / 2 + 30, y + bh + 62);

    /* doelpunten */
    let ly = y + bh + 132;
    x.textAlign = 'left';
    if (!(m.doelpunten || []).length) {
        x.textAlign = 'center'; x.fillStyle = '#5c554e';
        x.font = '800 24px system-ui, sans-serif';
        x.fillText(sperr(TAAL === 'nl' ? 'NOG GEEN DOELPUNTEN' : 'NO GOALS YET'), S / 2, ly);
        x.textAlign = 'left';
    }
    (m.doelpunten || []).slice(0, 7).forEach(function (d) {
        x.fillStyle = d.eigen ? '#ff6a13' : '#5c554e';
        x.fillRect(150, ly - 26, 5, 36);
        x.font = '800 26px system-ui, sans-serif';
        x.fillStyle = d.eigen ? '#ff6a13' : '#8b8178';
        /* "38'" is smal, "TWEEDE HELFT" niet: de naam schuift mee, anders
           schrijven ze over elkaar heen. */
        const tijd = plat(wanneerTekst(d));
        x.fillText(tijd, 176, ly);
        const kolom = Math.max(x.measureText(tijd).width + 22, 78);
        x.fillStyle = d.eigen ? '#f4ece1' : '#8b8178';
        x.fillText(plat(d.eigen ? (d.naam || 'RBC') : (m.tegen || '—')).slice(0, 24), 176 + kolom, ly);
        ly += 52;
    });

    x.textAlign = 'center'; x.fillStyle = '#ff6a13';
    x.font = '800 22px system-ui, sans-serif';
    x.fillText(sperr('RBCROOSENDAAL.COM'), S / 2, S - 92);

    return new Promise(function (res) { c.toBlob(res, 'image/png'); });
}
function sperr(s) { return String(s).split('').join(' '); }
function rond(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t); x.arcTo(l + w, t, l + w, t + h, r); x.arcTo(l + w, t + h, l, t + h, r);
    x.arcTo(l, t + h, l, t, r); x.arcTo(l, t, l + w, t, r); x.closePath();
}
function lamel(x, l, t, w, h, tekst, kleur) {
    const g = x.createLinearGradient(0, t, 0, t + h);
    g.addColorStop(0, '#332e28'); g.addColorStop(.5, '#2b2724');
    g.addColorStop(.5001, '#232019'); g.addColorStop(1, '#1b1815');
    x.fillStyle = g; rond(x, l, t, w, h, 10); x.fill();
    x.strokeStyle = 'rgba(0,0,0,.7)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(l, t + h / 2); x.lineTo(l + w, t + h / 2); x.stroke();
    x.fillStyle = kleur; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '900 ' + Math.round(h * .72) + 'px system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
    x.fillText(tekst, l + w / 2, t + h * .52);
    x.textBaseline = 'alphabetic';
}

async function stuur(m) {
    m = m || W;
    if (!m) return;
    const tekst = tekstVan(m);
    try {
        const blob = await bordPlaatje(m);
        if (blob) {
            const bestand = new File([blob], 'rbc-' + m.rbc + '-' + m.hen + '.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [bestand] })) {
                await navigator.share({ files: [bestand], text: tekst });
                return;
            }
        }
    } catch (e) { if (e && e.name === 'AbortError') return; }

    if (navigator.share) {
        try { await navigator.share({ text: tekst }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
        await navigator.clipboard.writeText(tekst);
        meld(t('gekopieerd'));
        window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
    } catch (e) {
        window.open('https://wa.me/?text=' + encodeURIComponent(tekst), '_blank', 'noopener');
    }
}

document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { dicht('laag-nummer'); dicht('laag-scorer'); return; }
    if ($('laag-nummer').classList.contains('aan')) {
        if (/^[0-9]$/.test(e.key)) { toetsAan(e.key); e.preventDefault(); }
        if (e.key === 'Backspace') { toetsAan('wis'); e.preventDefault(); }
        return;
    }
    if ($('laag-scorer').classList.contains('aan')) return;
    if (e.key === ' ') { $('knop-doelpunt').click(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') naarBlad(bladNu - 1);
    if (e.key === 'ArrowRight') naarBlad(bladNu + 1);
});

function vulUit(m) {
    if (!m) return;
    D.squad = (m.squad || []).slice().sort((a, b) => a.number - b.number);
    D.bijgewerkt = m.squad_bijgewerkt || null;
    D.volgende = m.match || null;
}

(function () {
    regelNaamRbc = maakRegel($('naam-rbc'), 3, ROL_TEKST);
    regelNaamTegen = maakRegel($('naam-tegen'), 3, ROL_TEKST);
    regelScoreRbc = maakRegel($('score-rbc'), 1, ROL_CIJFER);
    regelScoreTegen = maakRegel($('score-tegen'), 1, ROL_CIJFER);
    regelKlok = maakRegel($('klok'), 2, ROL_CIJFER);

    try { vulUit(JSON.parse($('ingebouwd').textContent)); } catch (e) {}
    const bewaard = OPSLAG.lees('rbc-gegevens', null);
    if (bewaard && bewaard.squad && bewaard.squad.length) vulUit(bewaard);

    W = OPSLAG.lees('rbc-wedstrijd', null);
    if (!W || typeof W.rbc !== 'number') nieuweWedstrijd(tegenstanderVan(D.volgende));
    if (!W.tegen && D.volgende) { W.tegen = tegenstanderVan(D.volgende); bewaar(); }

    $('knop-geluid').setAttribute('aria-pressed', GELUID ? 'true' : 'false');
    $('knop-geluid').textContent = GELUID ? '♪' : '♪̸';

    zetTaal(TAAL);
    tekenBord(); tekenEerder(); tekenKop();
    tekenFormaties(); tekenVeld();
    haalCompetitie();
    [...$('stippen').children].forEach(function (s, k) {
        s.setAttribute('aria-current', k === 0 ? 'true' : 'false');
    });

    fetch('data.json?v=' + Date.now())
        .then(r => r.json())
        .then(function (m) {
            vulUit(m);
            OPSLAG.schrijf('rbc-gegevens', { squad: D.squad, squad_bijgewerkt: D.bijgewerkt, match: D.volgende });
            if (!W.tegen && D.volgende) { W.tegen = tegenstanderVan(D.volgende); bewaar(); }
            tekenBord(); tekenKop();
        })
        .catch(function () { if (!navigator.onLine) meld(t('offline')); });
})();

/* De app komt uit de cache, dus een nieuwe versie zou pas de
   volgende keer verschijnen. Zodra er één klaarstaat: melden en
   op één tik overschakelen. */
const OP_EIGEN_MACHINE = /^(localhost|127\.|0\.0\.0\.0|\[::1\])/.test(location.hostname) ||
                         location.protocol === 'file:';
if ('serviceWorker' in navigator && !OP_EIGEN_MACHINE) {
    window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').then(function (reg) {
            reg.addEventListener('updatefound', function () {
                const nieuw = reg.installing;
                if (!nieuw) return;
                nieuw.addEventListener('statechange', function () {
                    if (nieuw.state === 'installed' && navigator.serviceWorker.controller) {
                        meld(t('nieuwe_versie'), true);
                        $('melding').style.pointerEvents = 'auto';
                        $('melding').style.cursor = 'pointer';
                        $('melding').addEventListener('click', function () { location.reload(); });
                    }
                });
            });
        }).catch(function () {});
    });
}
